<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grow Magic Preview</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:linear-gradient(#f3ead2,#e7f0da);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
#growCanvas{
  width:min(84vw,520px);
  height:auto;
  aspect-ratio:2/3;
  display:block;
}
#title{
  position:fixed;
  top:max(18px,env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.9);
  color:#455b35;
  font-size:14px;
  font-weight:700;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
  z-index:5;
}
</style>
</head>

<body>
<div id="title">MAGIC 04 · GROW 🌱</div>

<div class="wrap">
  <canvas id="growCanvas" width="640" height="960"></canvas>
</div>

<script>
const canvas=document.getElementById("growCanvas");
const ctx=canvas.getContext("2d");

const sources={
  vine:"../assets/grow/grow_vine.png",
  leaves:"../assets/grow/grow_leaves.png",
  flower:"../assets/grow/grow_flower.png"
};

const images={};
let loaded=0;
const total=Object.keys(sources).length;

Object.entries(sources).forEach(([key,src])=>{
  const img=new Image();
  img.onload=()=>{
    images[key]=img;
    loaded++;
  };
  img.src=src;
});

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function easeOutCubic(x){ return 1-Math.pow(1-x,3); }
function smoothstep(x){ x=clamp(x,0,1); return x*x*(3-2*x); }

function drawImageCentered(img,cx,cy,w,h,alpha=1,scaleY=1){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);
  ctx.scale(1,scaleY);
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();
}

const start=performance.now();

function draw(){
  requestAnimationFrame(draw);
  if(loaded<total)return;

  const w=canvas.width;
  const h=canvas.height;
  const t=(performance.now()-start)/1000;

  ctx.clearRect(0,0,w,h);

  // One full growth story every 6 seconds.
  const cycle=6.0;
  const phase=(t%cycle)/cycle;

  // 1) Vine grows upward first.
  const vineP=easeOutCubic(clamp(phase/0.48,0,1));

  // 2) Leaves appear after the vine is mostly present.
  const leavesP=smoothstep((phase-0.28)/0.34);

  // 3) Flower blooms last.
  const flowerP=smoothstep((phase-0.55)/0.28);

  // Gentle magical breathing after fully grown.
  const breathe=1+0.018*Math.sin(t*2.2);
  const glow=0.92+0.08*Math.sin(t*3.0);

  // Vine grows from the bottom upward using a bottom-anchored crop.
  const vineW=w*.58;
  const vineH=h*.78;
  const sx=0, sy=images.vine.height*(1-vineP);
  const sw=images.vine.width, sh=images.vine.height*vineP;
  const dx=w*.21;
  const dy=h*.86-vineH*vineP;
  const dw=vineW;
  const dh=vineH*vineP;

  if(vineP>0.01){
    ctx.save();
    ctx.globalAlpha=.98;
    ctx.drawImage(images.vine,sx,sy,sw,sh,dx,dy,dw,dh);
    ctx.restore();
  }

  // Leaves fade in and subtly expand.
  if(leavesP>0.01){
    drawImageCentered(
      images.leaves,
      w*.50,
      h*.49,
      w*.56*(.90+.10*leavesP),
      h*.66*(.90+.10*leavesP),
      .78*leavesP,
      breathe
    );
  }

  // Flower blooms last with a gentle pop.
  if(flowerP>0.01){
    const bloomScale=.70+.30*flowerP;
    drawImageCentered(
      images.flower,
      w*.50,
      h*.44,
      w*.50*bloomScale,
      h*.60*bloomScale,
      flowerP*glow,
      1
    );
  }
}

draw();
</script>
</body>
</html>
