<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGIC 02 · 三昧真火 Preview</title>
<style>
html,body{
  margin:0;
  min-height:100%;
  background:#f4ecd9;
}
.stage{
  width:min(90vw,760px);
  aspect-ratio:1/1;
  margin:4vh auto 0;
  border-radius:24px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 55%, rgba(255,230,180,.45), rgba(244,236,217,.95) 55%, #f4ecd9 100%);
}
#fxCanvas{
  width:100%;
  height:100%;
  display:block;
}
.caption{
  text-align:center;
  font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#594a37;
  margin:12px 20px 30px;
}
</style>
</head>

<body>
<div class="stage">
  <canvas id="fxCanvas" width="1024" height="1024"></canvas>
</div>

<div class="caption">
  MAGIC 02 · 三昧真火 — Fire Preview
</div>

<script>
const canvas = document.getElementById("fxCanvas");
const ctx = canvas.getContext("2d");

const images = {};
let loaded = 0;
const startTime = performance.now();

const sources = {
  fire: "../assets/fire/fire_main.png",
  sparks: "../assets/fire/fire_sparks.png",
  smoke: "../assets/fire/smoke.png",
  heat: "../assets/fire/heat_wave.png"
};

Object.entries(sources).forEach(([key, src]) => {
  const img = new Image();
  img.onload = () => {
    images[key] = img;
    loaded++;
  };
  img.src = src;
});

function drawCentered(img, cx, cy, width, height, rotation = 0, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.drawImage(img, -width/2, -height/2, width, height);
  ctx.restore();
}

function animate() {
  requestAnimationFrame(animate);
  if (loaded < 4) return;

  const w = canvas.width;
  const h = canvas.height;
  const t = (performance.now() - startTime) / 1000;

  ctx.clearRect(0, 0, w, h);

  // 1) Heat wave — wide base ring, slow pulse + rotation
  const heatScale = 0.94 + 0.10 * (0.5 + 0.5 * Math.sin(t * 1.6));
  const heatRot = 4 * Math.sin(t * 0.9) * Math.PI / 180;
  drawCentered(
    images.heat,
    w * 0.50,
    h * 0.61,
    w * 0.78 * heatScale,
    h * 0.48 * heatScale,
    heatRot,
    0.58
  );

  // 2) Smoke — rises slowly and sways side to side
  const smokeX = w * (0.50 + 0.035 * Math.sin(t * 1.2));
  const smokeY = h * (0.42 - 0.035 * Math.sin(t * 1.0));
  const smokeScale = 0.92 + 0.10 * (0.5 + 0.5 * Math.sin(t * 1.4));
  drawCentered(
    images.smoke,
    smokeX,
    smokeY,
    w * 0.62 * smokeScale,
    h * 0.42 * smokeScale,
    2.5 * Math.sin(t * 1.1) * Math.PI / 180,
    0.48
  );

  // 3) Main fire — strong vertical bounce + breathing
  const fireY = h * (0.54 - 0.06 * Math.sin(t * 2.2));
  const fireScale = 0.88 + 0.18 * (0.5 + 0.5 * Math.sin(t * 2.6));
  const fireRot = 3.5 * Math.sin(t * 1.8) * Math.PI / 180;
  drawCentered(
    images.fire,
    w * 0.47,
    fireY,
    w * 0.52 * fireScale,
    h * 0.42 * fireScale,
    fireRot,
    1.0
  );

  // 4) Sparks — upward flicker + pulse
  const sparkY = h * (0.42 - 0.08 * Math.sin(t * 1.7));
  const sparkScale = 0.88 + 0.22 * (0.5 + 0.5 * Math.sin(t * 4.0));
  const sparkAlpha = 0.55 + 0.40 * (0.5 + 0.5 * Math.sin(t * 5.2));
  drawCentered(
    images.sparks,
    w * 0.53,
    sparkY,
    w * 0.66 * sparkScale,
    h * 0.44 * sparkScale,
    0,
    sparkAlpha
  );
}

animate();
</script>
</body>
</html>
