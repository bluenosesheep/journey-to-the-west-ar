<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rain Magic Preview</title>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

body{background:linear-gradient(#dbe9f5,#eef6fb)}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#rainCanvas{width:min(88vw,560px);height:auto;aspect-ratio:1/1;display:block}
#title{position:fixed;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.9);color:#31465c;font-size:14px;font-weight:700;box-shadow:0 5px 18px rgba(0,0,0,.12);z-index:5}
</style></head><body>
<div id="title">MAGIC 03 · RAIN 🌧️</div>
<div class="wrap"><canvas id="rainCanvas" width="768" height="768"></canvas></div>

<script>
function dc(ctx,img,cx,cy,w,h,r=0,a=1){
  ctx.save();ctx.globalAlpha=a;ctx.translate(cx,cy);ctx.rotate(r);
  ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();
}

const canvas=document.getElementById("rainCanvas");
const ctx=canvas.getContext("2d");
const sources={
      cloud:"../assets/rain/rain_cloud.png",
      drops:"../assets/rain/rain_drops.png",
      splash:"../assets/rain/rain_splash.png"
    };
const images={};let loaded=0;const total=Object.keys(sources).length;
Object.entries(sources).forEach(([key,src])=>{const img=new Image();img.onload=()=>{images[key]=img;loaded++};img.src=src;});
const start=performance.now();
function draw(){
  requestAnimationFrame(draw);
  if(loaded<total)return;
  const w=canvas.width,h=canvas.height,t=(performance.now()-start)/1000;
  ctx.clearRect(0,0,w,h);
  const I=images;

      const cycle=2.0;                         // one complete rain rhythm
      const phase=(t%cycle)/cycle;                // 0..1 shared by all layers
      const wave=Math.sin(phase*Math.PI*2);

      // Cloud: one gentle bob per rain cycle.
      const cloudY=h*.25 + wave*5;
      const cloudX=w*.50 + Math.sin(phase*Math.PI*2)*2;

      // Rain: falls once during the same cycle.
      // Keep it moving only downward; reset at the top at the next cycle.
      const dropDrift=phase*30;
      const dropX=Math.sin(phase*Math.PI*2)*1.5;

      // Splash: strongest just as the rain reaches the bottom.
      const impactCenter=.84;
      const impactWidth=.12;
      const impact=Math.max(0,1-Math.abs(phase-impactCenter)/impactWidth);
      const splashPulse=.96 + .08*impact;
      const splashAlpha=.45 + .48*impact;

      dc(ctx,I.drops,w*.50+dropX,h*.535+dropDrift,w*.88,h*.50,0,.72);
      dc(ctx,I.cloud,cloudX,cloudY,w*.70,h*.45,0,1);
      dc(
        ctx,
        I.splash,
        w*.50,
        h*.81,
        w*.86*splashPulse,
        h*.27*splashPulse,
        0,
        splashAlpha
      );

}
draw();
</script>
</body></html>
