<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rain Magic Preview</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:linear-gradient(#dbe9f5,#eef6fb);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
#rainCanvas{
  width:min(88vw,560px);
  height:auto;
  aspect-ratio:1/1;
  display:block;
}
#title{
  position:fixed;
  top:max(18px,env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.9);
  color:#31465c;
  font-size:14px;
  font-weight:700;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
  z-index:5;
}
</style>
</head>

<body>
<div id="title">MAGIC 03 · RAIN 🌧️</div>

<div class="wrap">
  <canvas id="rainCanvas" width="768" height="768"></canvas>
</div>

<script>
const canvas=document.getElementById("rainCanvas");
const ctx=canvas.getContext("2d");

const sources={
  cloud:"../assets/rain/rain_cloud.png",
  drops:"../assets/rain/rain_drops.png",
  splash:"../assets/rain/rain_splash.png"
};

const images={};
let loaded=0;
const total=Object.keys(sources).length;

function dc(img,cx,cy,w,h,r=0,a=1){
  ctx.save();
  ctx.globalAlpha=a;
  ctx.translate(cx,cy);
  ctx.rotate(r);
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();
}

Object.entries(sources).forEach(([key,src])=>{
  const img=new Image();
  img.onload=()=>{
    images[key]=img;
    loaded++;
  };
  img.src=src;
});

const start=performance.now();

function draw(){
  requestAnimationFrame(draw);
  if(loaded<total)return;

  const w=canvas.width,h=canvas.height;
  const t=(performance.now()-start)/1000;

  ctx.clearRect(0,0,w,h);

  const cloudY=h*.31+Math.sin(t*1.2)*8;
  const cloudX=w*.50+Math.sin(t*.7)*6;

  const rainOffset=(t*150)%h;
  const splashAlpha=.55+.35*Math.sin(t*4.2);

  dc(images.drops,w*.50,h*.50+rainOffset,w*.92,h*.64,0,.72);
  dc(images.drops,w*.50,h*.50+rainOffset-h,w*.92,h*.64,0,.72);

  dc(images.cloud,cloudX,cloudY,w*.72,h*.48,0,1);

  dc(images.splash,w*.50,h*.79,w*.92,h*.34,0,splashAlpha);
}

draw();
</script>
</body>
</html>
