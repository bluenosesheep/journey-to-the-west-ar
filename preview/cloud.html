<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>筋斗云 AR Motion Preview</title>
<style>
html,body{margin:0;height:100%;background:#f4ecd9;overflow:hidden}
.stage{position:relative;width:min(88vw,720px);aspect-ratio:1/1;margin:4vh auto 0;background:#f4ecd9;border-radius:24px;overflow:hidden}
#fxCanvas{width:100%;height:100%;display:block}
.caption{text-align:center;font:15px/1.5 system-ui;color:#594a37;margin:12px 20px}
</style></head><body>
<div class="stage"><canvas id="fxCanvas" width="1024" height="1024"></canvas></div>
<div class="caption">与当前 AR index 同步：位置不变，仅增强动画幅度，并按 1.65 / 1.35 ≈ 1.22 倍预览整体画面尺寸。</div>
<script>
const canvas=document.getElementById("fxCanvas"),ctx=canvas.getContext("2d"),images={};let loaded=0;const startTime=performance.now();
const sources={cloud:"./assets/cloud/cloud.png",wind01:"./assets/cloud/wind_01.png",wind02:"./assets/cloud/wind_02.png",sparkles:"./assets/cloud/sparkles.png"};
Object.entries(sources).forEach(([key,src])=>{const img=new Image();img.onload=()=>{images[key]=img;loaded++};img.src=src;});
function drawCentered(img,cx,cy,width,height,rotation=0,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.rotate(rotation);ctx.drawImage(img,-width/2,-height/2,width,height);ctx.restore();}
function animate(){requestAnimationFrame(animate);if(loaded<4)return;const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const t=(performance.now()-startTime)/1000;
const P=1.65/1.35,cx0=w*.5,cy0=h*.5,X=x=>cx0+(x-cx0)*P,Y=y=>cy0+(y-cy0)*P,S=v=>v*P;
const w2Scale=.92+.08*(.5+.5*Math.sin(t*2.2));
drawCentered(images.wind02,X(w*.72),Y(h*.34),S(w*.23*w2Scale),S(h*.36*w2Scale),(-5+12*(.5+.5*Math.sin(t*1.7)))*Math.PI/180,.82);
const cloudY=h*(.50-.06*Math.sin(t*2.0)),cloudRot=3.0*Math.sin(t*1.4)*Math.PI/180;
drawCentered(images.cloud,X(w*.42),Y(cloudY),S(w*.43),S(h*.43),cloudRot,1);
const sweepX=w*(.50+.10*Math.sin(t*2.4));
drawCentered(images.wind01,X(sweepX),Y(h*.61),S(w*.68),S(h*.24),0,.80);
const spScale=.75+.40*(.5+.5*Math.sin(t*5.0)),spAlpha=.45+.55*(.5+.5*Math.sin(t*5.0));
drawCentered(images.sparkles,X(w*.66),Y(h*.28),S(w*.20*spScale),S(h*.20*spScale),0,spAlpha);}
animate();
</script></body></html>
