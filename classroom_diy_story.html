<script>

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

window.ParkCameraOrientation={
  angle:0,
  init(){
    const select=document.getElementById("cameraOrientationSelect");
    this.angle=Number(localStorage.getItem("parkCameraAngle")||0);
    if(select){
      select.value=String(this.angle);
      select.addEventListener("change",()=>{
        this.angle=Number(select.value)||0;
        localStorage.setItem("parkCameraAngle",String(this.angle));
        this.apply();
      });
    }
    this.apply();
  },
  apply(){
    const video=document.querySelector("video");
    if(!video){setTimeout(()=>this.apply(),120);return}
    const a=this.angle;
    video.style.transformOrigin="50% 50%";
    video.style.transform=`rotate(${a}deg)`;
    if(a===90||a===270){
      const scale=Math.max(innerWidth/innerHeight,innerHeight/innerWidth);
      video.style.transform=`rotate(${a}deg) scale(${scale})`;
    }
  },
  mapPoint(x,y,width,height){
    const a=this.angle;
    if(a===90)return{x:width-(y/height)*width,y:(x/width)*height};
    if(a===180)return{x:width-x,y:height-y};
    if(a===270)return{x:(y/height)*width,y:height-(x/width)*height};
    return{x,y};
  }
};


window.StandaloneParkMode={
  mode:"story",
  showStory(keepTracking=false){
    this.mode="story";
    document.body.classList.add("park-story");
    window.StandaloneHandMode?.sleep();
    document.getElementById("parkStoryLayer").style.display="block";
    document.getElementById("fixParkBtn").style.display="block";
    document.getElementById("doneParkBtn").style.display="none";
    document.getElementById("dragLayer").style.display="none";

    const c=document.querySelector('[park-drag-controller]')?.components?.["park-drag-controller"];
    if(c){
      // When called from targetFound, keep tracking alive long enough to capture
      // the Park card pose for the later interactive handoff.
      if(!keepTracking)c.tracking=false;
      c.holding=false;
      c.dragState=null;
      c.hideHits();
    }

    const w=document.getElementById("parkWorld");
    if(w)w.object3D.visible=false;

    document.getElementById("hint").textContent="PARK · 先用玩偶讲讲公园里发生了什么吧 🌳";
  },
  enterFix(){
    this.mode="fix";
    document.body.classList.remove("park-story");
    document.getElementById("parkStoryLayer").style.display="none";
    document.getElementById("fixParkBtn").style.display="none";
    document.getElementById("doneParkBtn").style.display="block";
    document.getElementById("dragLayer").style.display="block";
    const c=document.querySelector('[park-drag-controller]')?.components?.["park-drag-controller"];
    const w=document.getElementById("parkWorld");
    if(c&&w){
      const o=w.object3D;o.position.copy(c.basePos);o.quaternion.identity();o.scale.copy(c.baseScale);o.visible=true;o.updateMatrixWorld(true);
      c.tracking=false;c.holding=true;c.holdStart=performance.now();c.showHits();c.updateHitPositions();

      const canvasComp=document.getElementById("parkDisplay")?.components?.["park-canvas"];
      if(canvasComp)canvasComp._lastDraw=0;
    }
    document.getElementById("hint").textContent="PARK · 把乱掉的东西拖回合适的位置吧！🌳";
  },
  finishFix(){
    window.StandaloneHandMode?.sleep();
    const c=document.querySelector('[park-drag-controller]')?.components?.["park-drag-controller"];
    if(c){c.tracking=false;c.holding=false;c.dragState=null;c.hideHits()}
    const w=document.getElementById("parkWorld");if(w)w.object3D.visible=false;
    this.showStory();
    document.getElementById("hint").textContent="PARK · 公园整理好啦，太棒了 🌿";
  }
};

window.StandaloneHandMode={
  running:false,
  sleeping:false,
  timer:null,
  sleepMs:5000,
  clearTimer(){if(this.timer){clearTimeout(this.timer);this.timer=null}},
  noteInteraction(){
    if(!this.running)return;
    this.clearTimer();
    this.timer=setTimeout(()=>this.sleep(),this.sleepMs);
  },
  async start(){
    if(this.running)return;
    const status=document.getElementById("handStatus");
    const cursor=document.getElementById("handCursor");
    const video=document.querySelector("video");
    if(!video||!window.ClassroomHandTracking)return;

    if(status){status.style.display="block";status.textContent="手势：启动中…";}
    await window.ClassroomHandTracking.start({
      video,cursor,mirror:false,maxFps:18,smoothing:.38,
      pinchDownRatio:.34,pinchUpRatio:.44,reuseExistingVideo:true,
      viewport:()=>({width:innerWidth,height:innerHeight}),
      onStatus:(msg)=>{if(status)status.textContent="手势："+msg},
      onArmedChange:(armed)=>{if(status)status.textContent=armed?"手势：PARK":"放下识别卡，张开手 ✋"},
      onMetrics:(data)=>{
        if(!status)return;
        if(!data.handVisible)status.textContent="手势：请伸出一只手";
        else if(data.armed===false)status.textContent="放下识别卡，张开手 ✋";
        else if(data.pinching)status.textContent="手势：抓住";
        else status.textContent="手势：PARK";
      }
    });
    this.running=true;this.sleeping=false;this.noteInteraction();
    window.ClassroomHandTracking.requireReleaseToArm(300);
    document.getElementById("handBtn").textContent="✨ INTERACT · ON";
  },
  sleep(){
    if(!this.running)return;
    this.clearTimer();
    window.ClassroomHandTracking?.stop({keepVideo:true,keepModel:true});
    this.running=false;this.sleeping=true;
    const c=document.getElementById("handCursor"),s=document.getElementById("handStatus");
    if(c)c.style.display="none";
    if(s){s.style.display="block";s.textContent="手势：已关闭 · 再点 INTERACT 唤醒";}
    document.getElementById("handBtn").textContent="✨ INTERACT · OFF";
  },
  toggle(){this.running?this.sleep():this.start()}
};

document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("fixParkBtn")?.addEventListener("click",()=>window.StandaloneParkMode.enterFix());
  document.getElementById("doneParkBtn")?.addEventListener("click",()=>window.StandaloneParkMode.finishFix());
  window.CityInput.register("hand-auto-sleep",{
    down:(input)=>{if(input.source==="hand")window.StandaloneHandMode.noteInteraction()},
    up:(input)=>{if(input.source==="hand")window.StandaloneHandMode.noteInteraction()}
  });
});

AFRAME.registerComponent("park-canvas",{
  init(){
    this.c=document.getElementById("parkCanvas");this.ctx=this.c.getContext("2d");
    this.images={};
    ["tree","flower","bench","fountain"].forEach(kind=>{
      const img=new Image();img.src=`./assets/park/${kind}.png?v=1`;this.images[kind]=img;
    });

    this.initial={
      tree:{x:170,y:165,rotation:-.18,scale:1.0},
      flower:{x:315,y:350,rotation:.25,scale:.82},
      bench:{x:460,y:355,rotation:.24,scale:.86},
      fountain:{x:565,y:215,rotation:-.12,scale:.92}
    };
    this.items={};
    this.resetMessy();
  },
  resetMessy(){
    Object.entries(this.initial).forEach(([k,p])=>this.items[k]={...p});
  },
  setPosition(kind,x,y){
    const item=this.items[kind];if(!item)return;
    item.x=Math.max(90,Math.min(678,x));item.y=Math.max(85,Math.min(430,y));item.rotation=0;
  },
  reset(){
    this.resetMessy();
    document.getElementById("hint").textContent="PARK · 公园又乱了，重新修好它吧！✨";
  },
  tick(){
    if(window.StandaloneParkMode?.mode==="story")return;
    const now=performance.now();
    const active=!!window.ParkDragController?.dragging;
    const frameMs=active?33:67;
    if(this._lastDraw&&now-this._lastDraw<frameMs)return;
    this._lastDraw=now;

    const ctx=this.ctx,c=this.c,w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h);

    ctx.save();
    ctx.fillStyle="rgba(126,181,92,.24)";ctx.beginPath();ctx.ellipse(w/2,390,245,74,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(210,180,125,.46)";ctx.lineWidth=30;ctx.lineCap="round";ctx.beginPath();
    ctx.moveTo(205,425);ctx.bezierCurveTo(290,350,455,455,565,370);ctx.stroke();
    ctx.strokeStyle="rgba(255,244,211,.34)";ctx.lineWidth=12;ctx.beginPath();
    ctx.moveTo(205,425);ctx.bezierCurveTo(290,350,455,455,565,370);ctx.stroke();
    ctx.font='30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.globalAlpha=.72;
    ctx.fillText("🌱",175,385);ctx.fillText("🌱",585,410);ctx.fillText("🌱",305,430);ctx.restore();

    const bt=now/1000,travel=(Math.sin(bt*.72)+1)/2;
    ctx.save();ctx.globalAlpha=.86;ctx.translate(185+travel*395,245+Math.sin(bt*1.55)*16);
    ctx.scale(.86+.10*Math.sin(bt*3.1),.86+.10*Math.sin(bt*3.1));
    ctx.font='38px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.fillText("🦋",0,0);ctx.restore();

    Object.entries(this.items).forEach(([kind,item])=>{
      ctx.save();ctx.translate(item.x,item.y);ctx.rotate(item.rotation||0);ctx.scale(item.scale||1,item.scale||1);
      const img=this.images[kind];
      if(img&&img.complete&&img.naturalWidth){
        const size=kind==="bench"?118:kind==="tree"?112:kind==="flower"?110:108;
        ctx.drawImage(img,-size/2,-size/2,size,size);

    const mesh=this.el.getObject3D("mesh");
    if(mesh&&mesh.material&&mesh.material.map)mesh.material.map.needsUpdate=true;
  }
});

  init(){

      this.tracking=true;this.holding=false;this.poseHistory=[];

        if(this.world)this.world.object3D.visible=false;

      }
    });

    this.el.addEventListener("targetLost",()=>{
      this.tracking=false;this.holding=true;this.holdStart=performance.now();
      if(this.world){
        const obj=this.world.object3D;let stable=null,now=performance.now();
        for(let i=this.poseHistory.length-1;i>=0;i--){if(now-this.poseHistory[i].time>=280){stable=this.poseHistory[i];break}}
        if(!stable&&this.poseHistory.length)stable=this.poseHistory[0];
        if(stable){
          this.basePos.copy(stable.pos);
          this.baseScale.copy(stable.scale);
        }else{
          // Very short scans may not build enough pose history. Use the current
          // target matrix as a fallback so FIX still has a valid position/scale.
          this.el.object3D.updateMatrixWorld(true);
          const p=new THREE.Vector3(),q=new THREE.Quaternion(),sc=new THREE.Vector3();
          this.el.object3D.matrixWorld.decompose(p,q,sc);
          this.basePos.copy(p);
          this.baseScale.copy(sc);
        }

        obj.position.copy(this.basePos);
        obj.quaternion.identity();
        obj.scale.copy(this.baseScale);
        obj.visible=true;
        obj.updateMatrixWorld(true);
      }
      if(window.StandaloneParkMode?.mode==="story"){
        this.holding=false;this.hideHits();
        if(this.world)this.world.object3D.visible=false;
        // Keep the current Park story hint unchanged after targetLost.
      }else{

        document.getElementById("hint").textContent="PARK · 可以继续拖动，或用玩偶讲故事 🌿";
      }
    });
  },
  get dragging(){return !!this.dragState},
  getCanvasComp(){return document.getElementById("parkDisplay")?.components?.["park-canvas"]},
  getCamera(){if(!this.camera){const e=document.querySelector("a-camera");this.camera=e&&e.getObject3D("camera")}return this.camera},
  projectWorld(v){const cam=this.getCamera();if(!cam)return null;const p=v.clone().project(cam);return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight}},
  canvasToLocal(x,y){return new THREE.Vector3((x/this.canvasW-.5)*this.planeWidth,(.5-y/this.canvasH)*this.planeHeight,.10)},
  getScreenScale(){
    if(!this.world)return null;const obj=this.world.object3D;obj.updateMatrixWorld(true);
    const c=this.projectWorld(new THREE.Vector3(0,0,0).applyMatrix4(obj.matrixWorld));
    const r=this.projectWorld(new THREE.Vector3(.5,0,0).applyMatrix4(obj.matrixWorld));
    const u=this.projectWorld(new THREE.Vector3(0,.5,0).applyMatrix4(obj.matrixWorld));
    if(!c||!r||!u)return null;
    return{pxPerUnitX:Math.max(1,Math.abs(r.x-c.x)*2),pxPerUnitY:Math.max(1,Math.abs(u.y-c.y)*2)}
  },
  hitKindAt(x,y,source){
    const done=document.getElementById("doneParkBtn");
    if(done&&done.style.display!=="none"){
      const r=done.getBoundingClientRect(),pad=source==="hand"?12:4;
      if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad)return "done";
    }
    for(const kind of ["reset","tree","flower","bench","fountain"]){
      const b=this.hits[kind];if(!b||b.style.display==="none")continue;
      const r=b.getBoundingClientRect(),pad=source==="hand"?8:0;
      if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad)return kind;
    }
    return null;
  },
  handleDown(input){
    const kind=this.hitKindAt(input.x,input.y,input.source);if(!kind)return;
    if(input.nativeEvent)input.nativeEvent.preventDefault();
    if(kind==="done"){window.StandaloneParkMode?.finishFix();return}
    if(kind==="reset"){this.getCanvasComp()?.reset();return}
    const comp=this.getCanvasComp(),scale=this.getScreenScale();if(!comp||!scale)return;
    const item=comp.items[kind];
    this.dragState={pointerId:input.pointerId,kind,startScreenX:input.x,startScreenY:input.y,
      startCanvasX:item.x,startCanvasY:item.y,pxPerUnitX:scale.pxPerUnitX,pxPerUnitY:scale.pxPerUnitY};
    document.getElementById("hint").textContent="拖到你喜欢的位置！";
  },
  handleMove(input){
    if(!this.dragState||input.pointerId!==this.dragState.pointerId)return;
    if(input.nativeEvent)input.nativeEvent.preventDefault();
    const comp=this.getCanvasComp();if(!comp)return;
    const dx=input.x-this.dragState.startScreenX,dy=input.y-this.dragState.startScreenY;
    const sx=(this.dragState.pxPerUnitX*this.planeWidth)/this.canvasW;
    const sy=(this.dragState.pxPerUnitY*this.planeHeight)/this.canvasH;
    comp.setPosition(this.dragState.kind,this.dragState.startCanvasX+dx/Math.max(.001,sx),this.dragState.startCanvasY+dy/Math.max(.001,sy));
    this.updateHitPositions();
  },
  handleUp(input){
    if(!this.dragState||input.pointerId!==this.dragState.pointerId)return;
    this.dragState=null;document.getElementById("hint").textContent="PARK · 继续拖动来修好公园吧！🌳";
  },
  showHits(){Object.values(this.hits).forEach(b=>b.style.display="block")},
  hideHits(){Object.values(this.hits).forEach(b=>b.style.display="none")},
  updateHitPositions(){
    if(!this.world)return;const comp=this.getCanvasComp();if(!comp)return;
    const obj=this.world.object3D;obj.updateMatrixWorld(true);const scale=this.getScreenScale();if(!scale)return;
    const base=Math.max(52,.46*scale.pxPerUnitX);
    Object.entries(comp.items).forEach(([kind,item])=>{
      const s=this.projectWorld(this.canvasToLocal(item.x,item.y).applyMatrix4(obj.matrixWorld));if(!s)return;
      const b=this.hits[kind],size=base*Math.max(.85,item.scale||1);
      b.style.left=(s.x-size/2)+"px";b.style.top=(s.y-size/2)+"px";b.style.width=size+"px";b.style.height=size+"px";
    });
    const rs=this.projectWorld(this.canvasToLocal(this.canvasW/2,505).applyMatrix4(obj.matrixWorld));
    if(rs){
      const bw=Math.max(96,.46*scale.pxPerUnitX),bh=Math.max(26,.095*scale.pxPerUnitY);
      const b=this.hits.reset;b.style.left=(rs.x-bw/2)+"px";b.style.top=(rs.y-bh/2)+"px";b.style.width=bw+"px";b.style.height=bh+"px";
      const done=document.getElementById("doneParkBtn");
      if(done&&window.StandaloneParkMode?.mode==="fix"){
        const rr=b.getBoundingClientRect();
        done.style.left=(rr.right+10)+"px";
        done.style.top=rr.top+"px";
        done.style.width=Math.max(104,rr.width*.92)+"px";
        done.style.height=rr.height+"px";
      }
    }
  },
  tick(){
    if(!this.world)return;
    if(window.StandaloneParkMode?.mode==="story"&&!this.tracking)return;
    const now=performance.now(),active=this.tracking||this.dragState,frameMs=active?33:67;
    if(this._lastTick&&now-this._lastTick<frameMs)return;this._lastTick=now;
    const obj=this.world.object3D;
    if(this.tracking){
      this.el.object3D.updateMatrixWorld(true);this.lastMatrix.copy(this.el.object3D.matrixWorld);
      const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();this.lastMatrix.decompose(p,q,s);
      this.poseHistory.push({pos:p.clone(),scale:s.clone(),time:now});if(this.poseHistory.length>this.maxPoseHistory)this.poseHistory.shift();
      this.basePos.copy(p);this.baseScale.copy(s);
      if(window.StandaloneParkMode?.mode!=="story"){
        obj.position.copy(p);obj.quaternion.identity();obj.scale.copy(s);obj.updateMatrixWorld(true);this.updateHitPositions();
      }
      return;
    }
    if(this.holding){
      const t=(now-this.holdStart)/1000;
      obj.position.copy(this.basePos);obj.position.x+=Math.sin(t*.95)*.008;obj.position.y+=Math.sin(t*1.35)*.014;
      obj.quaternion.identity();obj.scale.copy(this.baseScale);obj.updateMatrixWorld(true);
      this.updateHitPositions();
    }
  }
});

</script>

<script>

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}


AFRAME.registerComponent("market-persist",{
  schema:{
    seconds:{type:"number",default:15},
    world:{type:"selector"}
  },

  init:function(){
    this.world=this.data.world;
    this.tracking=false;
    this.timer=null;
    this.camera=null;

    this.lastMatrix=new THREE.Matrix4();
    this.holding=false;
    this.holdStart=0;
    this.basePos=new THREE.Vector3();
    this.baseQuat=new THREE.Quaternion();
    this.baseScale=new THREE.Vector3(1,1,1);

    // Keep a short history of stable tracked poses.
    // When the card is moved away, MindAR can briefly report a distorted pose.
    // We freeze from an earlier stable sample instead of the very last frame.
    this.poseHistory=[];
    this.maxPoseHistory=24;

    this.hits={
      peach:document.getElementById("holdPeach"),
      cabbage:document.getElementById("holdCabbage"),
      egg:document.getElementById("holdEgg"),
      reset:document.getElementById("holdReset"),
      checkout:document.getElementById("checkoutBtn")
    };

    this.localPoints={
      peach:new THREE.Vector3(-0.38,0.35,0.10),
      cabbage:new THREE.Vector3(0,0.38,0.10),
      egg:new THREE.Vector3(0.38,0.35,0.10),
      reset:new THREE.Vector3(0,-0.62,0.14)
    };

    this.localSizes={
      peach:[0.58,0.58],
      cabbage:[0.58,0.58],
      egg:[0.58,0.58],
      reset:[0.74,0.30]
    };

    const comp=()=>document.getElementById("marketDisplay")?.components?.["market-canvas"];

    window.CityInput.register("market-standalone",{
      down:(input)=>this.handleInputDown(input)
    });

    if(this.world){
      this.world.object3D.visible=false;
    }

    this.el.addEventListener("targetFound",()=>{
      this.tracking=true;
      this.holding=false;
      this.poseHistory=[];
      this.hideHoldHits();

      if(this.timer){
        clearTimeout(this.timer);
        this.timer=null;
      }

      if(window.StandaloneMarketMode?.mode==="story"){
        if(this.world)this.world.object3D.visible=false;
        window.StandaloneMarketMode.showStory();
      }else if(this.world){
        this.world.object3D.visible=true;
      }
    });

    this.el.addEventListener("targetLost",()=>{
      this.tracking=false;
      this.holding=true;
      this.holdStart=performance.now();

      if(this.world){
        const obj=this.world.object3D;

        // Use a pose from roughly 250-350ms BEFORE targetLost.
        // That avoids freezing the bad skew/tilt that often happens while the card is being pulled away.
        let stablePose=null;
        const now=performance.now();
        for(let i=this.poseHistory.length-1;i>=0;i--){
          const age=now-this.poseHistory[i].time;
          if(age>=280){
            stablePose=this.poseHistory[i];
            break;
          }
        }

        // Fallback to the oldest available recent pose, then finally current pose.
        if(!stablePose && this.poseHistory.length){
          stablePose=this.poseHistory[0];
        }

        if(stablePose){
          this.basePos.copy(stablePose.pos);
          this.baseQuat.copy(stablePose.quat);
          this.baseScale.copy(stablePose.scale);

          obj.position.copy(this.basePos);
          obj.quaternion.copy(this.baseQuat);
          obj.scale.copy(this.baseScale);
          obj.updateMatrixWorld(true);
        }else{
          this.basePos.copy(obj.position);
          this.baseQuat.copy(obj.quaternion);
          this.baseScale.copy(obj.scale);
        }

        obj.visible=true;
      }

      // A-Frame raycaster is unreliable after targetLost on some mobile browsers.
      // Switch interaction to DOM hit zones and keep them synced to the idle motion.
      if(window.StandaloneMarketMode?.mode==="story"){
        this.holding=false;this.hideHoldHits();
        if(this.world)this.world.object3D.visible=false;
        // Keep the current Market story hint unchanged after targetLost.
      }else{
        this.updateHoldHits();this.showHoldHits();
      }

      if(this.timer){clearTimeout(this.timer);this.timer=null;}
    });
  },

  hitKindAt:function(x,y,source){
    const checkoutEl=this.hits.checkout;
    if(
      checkoutEl &&
      checkoutEl.style.display!=="none"
    ){
      const r=checkoutEl.getBoundingClientRect();
      const pad=source==="hand"?12:4;
      if(
        x>=r.left-pad && x<=r.right+pad &&
        y>=r.top-pad && y<=r.bottom+pad
      ){
        return "checkout";
      }
    }

    const resetEl=this.hits.reset;
    if(resetEl && resetEl.style.display!=="none"){
      const r=resetEl.getBoundingClientRect();
      const pad=source==="hand"?10:4;
      if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad){
        return "reset";
      }
    }

    for(const [kind,el] of Object.entries(this.hits)){
      if(kind==="reset"||kind==="checkout"||!el||el.style.display==="none")continue;
      const r=el.getBoundingClientRect();
      const pad=source==="hand"?8:0;
      if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad){
        return kind;
      }
    }
    return null;
  },

  handleInputDown:function(input){
    const kind=this.hitKindAt(input.x,input.y,input.source);
    if(!kind)return;

    if(input.nativeEvent)input.nativeEvent.preventDefault();

    const comp=document.getElementById("marketDisplay")
      ?.components?.["market-canvas"];
    if(!comp)return;

    if(kind==="checkout"){
      window.StandaloneMarketMode?.checkout();
      return;
    }

    if(kind==="reset"){
      comp.reset();
      document.getElementById("hint").textContent="MARKET · 已清空篮筐 🧺";
    }else{
      comp.pick(kind);
    }
  },

  getCamera:function(){
    if(!this.camera){
      const camEl=document.querySelector("a-camera");
      this.camera=camEl && camEl.getObject3D("camera");
    }
    return this.camera;
  },

  projectWorld:function(v){
    const cam=this.getCamera();
    if(!cam)return null;
    const p=v.clone().project(cam);
    return {
      x:(p.x*0.5+0.5)*window.innerWidth,
      y:(-p.y*0.5+0.5)*window.innerHeight
    };
  },

  updateHoldHits:function(){
    if(!this.world)return;

    const obj=this.world.object3D;
    obj.updateMatrixWorld(true);

    const centerWorld=new THREE.Vector3(0,0,0).applyMatrix4(obj.matrixWorld);
    const rightWorld=new THREE.Vector3(0.5,0,0).applyMatrix4(obj.matrixWorld);
    const upWorld=new THREE.Vector3(0,0.5,0).applyMatrix4(obj.matrixWorld);

    const center=this.projectWorld(centerWorld);
    const right=this.projectWorld(rightWorld);
    const up=this.projectWorld(upWorld);
    if(!center||!right||!up)return;

    const pxPerUnitX=Math.max(1,Math.abs(right.x-center.x)*2);
    const pxPerUnitY=Math.max(1,Math.abs(up.y-center.y)*2);

    Object.entries(this.localPoints).forEach(([key,local])=>{
      const worldPoint=local.clone().applyMatrix4(obj.matrixWorld);
      const screen=this.projectWorld(worldPoint);
      if(!screen)return;

      const [wu,hu]=this.localSizes[key];
      const bw=Math.max(key==="reset"?96:54,(key==="reset"?.46:wu)*pxPerUnitX);
      const bh=Math.max(key==="reset"?26:54,(key==="reset"?.095:hu)*pxPerUnitY);

      const b=this.hits[key];
      b.style.left=(screen.x-bw/2)+"px";
      b.style.top=(screen.y-bh/2)+"px";
      b.style.width=bw+"px";
      b.style.height=bh+"px";
    });

    // Place checkout immediately to the right of the real Reset button.
    const reset=this.hits.reset;
    const checkout=document.getElementById("checkoutBtn");
    if(reset&&checkout&&reset.style.display!=="none"){
      const rr=reset.getBoundingClientRect();
      const gap=10;
      const cw=Math.max(112,rr.width*.92);
      checkout.style.left=(rr.right+gap)+"px";
      checkout.style.top=rr.top+"px";
      checkout.style.width=cw+"px";
      checkout.style.height=rr.height+"px";
    }
  },

  showHoldHits:function(){
    ["peach","cabbage","egg","reset"].forEach(k=>{
      const b=this.hits[k];
      if(b)b.style.display="block";
    });
  },

  hideHoldHits:function(){
    ["peach","cabbage","egg","reset"].forEach(k=>{
      const b=this.hits[k];
      if(b)b.style.display="none";
    });
  },

  tick:function(){
    if(!this.world)return;
    if(window.StandaloneMarketMode?.mode==="story"&&!this.tracking)return;
    const now=performance.now(),frameMs=this.tracking?33:67;
    if(this._lastControllerTick&&now-this._lastControllerTick<frameMs)return;
    this._lastControllerTick=now;
    const obj=this.world.object3D;

    if(this.tracking){
      this.el.object3D.updateMatrixWorld(true);
      this.lastMatrix.copy(this.el.object3D.matrixWorld);

      const pos=new THREE.Vector3();
      const quat=new THREE.Quaternion();
      const scale=new THREE.Vector3();
      this.lastMatrix.decompose(pos,quat,scale);

      // Save recent poses. About 20-24 frames gives us a few hundred ms of history.
      this.poseHistory.push({
        pos:pos.clone(),
        quat:quat.clone(),
        scale:scale.clone(),
        time:performance.now()
      });
      if(this.poseHistory.length>this.maxPoseHistory){
        this.poseHistory.shift();
      }

      this.basePos.copy(pos);this.baseScale.copy(scale);
      if(window.StandaloneMarketMode?.mode!=="story"){
        obj.position.copy(pos);obj.quaternion.copy(quat);obj.scale.copy(scale);obj.updateMatrixWorld(true);
      }
      return;
    }

    if(this.holding){
      // Very small, slow motion so the AR still feels "alive" after the card is removed.
      // It is intentionally much steadier than real tracking jitter.
      const t=(performance.now()-this.holdStart)/1000;
      const bob=Math.sin(t*1.45)*0.022;
      const sway=Math.sin(t*1.05)*0.014;
      const roll=Math.sin(t*1.18)*THREE.MathUtils.degToRad(1.4);

      obj.position.copy(this.basePos);
      obj.position.x+=sway;
      obj.position.y+=bob;

      const qRoll=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),roll);
      // Integrated SHOP is a screen-facing activity. Do not inherit the physical
      // Market card's rotation after it is removed.
      obj.quaternion.identity().multiply(qRoll);
      obj.scale.copy(this.baseScale);
      obj.updateMatrixWorld(true);

      // Re-project DOM hit zones only while hand tracking is active.
      // Mouse keeps using the last stable positions while hand inference sleeps.
      if(window.StandaloneMarketHandMode?.running){
        this.updateHoldHits();
      }
    }
  }
});


AFRAME.registerComponent("market-canvas",{

  tick:function(){
    if(window.StandaloneMarketMode?.mode==="story")return;
    const now=performance.now();
    const animating=Object.values(this.items).some(item=>item.selected&&now-item.start<700);
    const frameMs=animating?33:67;
    if(this._lastDraw&&now-this._lastDraw<frameMs)return;this._lastDraw=now;
    const ctx=this.ctx,c=this.c,w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h); // fully transparent canvas

    ctx.textAlign="center";ctx.textBaseline="middle";

    Object.entries(this.items).forEach(([kind,item])=>{
      let x=item.x,y=item.y,s=1;
      if(item.selected){
        const p=Math.min(1,(performance.now()-item.start)/650);
        const e=1-Math.pow(1-p,3);
        const arc=Math.sin(Math.PI*p)*75;
        x=item.x+(item.tx-item.x)*e;
        y=item.y+(item.ty-item.y)*e-arc;
        s=1-.50*e;
      }
      ctx.save();ctx.translate(x,y);ctx.scale(s,s);
      const img=kind==="peach"?this.peachImage:kind==="cabbage"?this.cabbageImage:this.eggImage;
      if(img&&img.complete&&img.naturalWidth)ctx.drawImage(img,-48,-48,96,96);
      else{ctx.font='96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.fillText(item.emoji,0,0)}
      ctx.restore();
    });

    // Draw a consistent basket ourselves instead of using the system 🧺 emoji.
    // This keeps the basket shape identical on iPhone, Android and desktop.
    const basketCx=w/2;
    const basketTop=330;
    const basketW=220;
    const basketH=105;

    // handle
    ctx.save();
    ctx.lineWidth=18;
    ctx.lineCap="round";
    ctx.strokeStyle="#c88435";
    ctx.beginPath();
    ctx.arc(basketCx, basketTop-8, 58, Math.PI, 0);
    ctx.stroke();

    // basket body
    const left=basketCx-basketW/2;
    const right=basketCx+basketW/2;
    const bottom=basketTop+basketH;
    ctx.beginPath();
    ctx.moveTo(left+18,basketTop);
    ctx.lineTo(right-18,basketTop);
    ctx.lineTo(right-38,bottom);
    ctx.quadraticCurveTo(basketCx,bottom+14,left+38,bottom);
    ctx.closePath();
    ctx.fillStyle="#d9a45a";
    ctx.fill();
    ctx.lineWidth=5;
    ctx.strokeStyle="#a96f2b";
    ctx.stroke();

    // rim
    ctx.fillStyle="#e7b66d";
    roundRect(ctx,left,basketTop-14,basketW,28,14);
    ctx.fill();
    ctx.lineWidth=4;
    ctx.strokeStyle="#b7772e";
    ctx.stroke();

    // woven lines
    ctx.save();
    ctx.beginPath();
    ctx.rect(left+20,basketTop+10,basketW-40,basketH-24);
    ctx.clip();
    ctx.strokeStyle="rgba(150,92,35,.55)";
    ctx.lineWidth=4;
    for(let x=left-40;x<right+40;x+=32){
      ctx.beginPath();ctx.moveTo(x,basketTop+10);ctx.lineTo(x+90,bottom);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+90,basketTop+10);ctx.lineTo(x,bottom);ctx.stroke();
    }
    ctx.restore();
    ctx.restore();

    // RESET UI is provided by the DOM button #holdReset.

    const mesh=this.el.getObject3D("mesh");
    if(mesh&&mesh.material&&mesh.material.map)mesh.material.map.needsUpdate=true;
  }
});

window.ClassroomCameraOrientation={
  angle:0,
  init(){
    const select=document.getElementById("cameraOrientationSelect");
    this.angle=Number(localStorage.getItem("marketCameraAngle")||0);
    if(select){
      select.value=String(this.angle);
      select.addEventListener("change",()=>{
        this.angle=Number(select.value)||0;
        localStorage.setItem("marketCameraAngle",String(this.angle));
        this.apply();
      });
    }
    this.apply();
  },
  apply(){
    const video=document.querySelector("video");
    if(!video){setTimeout(()=>this.apply(),120);return}
    const a=this.angle;
    video.style.transformOrigin="50% 50%";
    video.style.transform=`rotate(${a}deg)`;
    if(a===90||a===270){
      const scale=Math.max(innerWidth/innerHeight,innerHeight/innerWidth);
      video.style.transform=`rotate(${a}deg) scale(${scale})`;
    }
  },
  mapPoint(x,y,width,height){
    const a=this.angle;
    if(a===90)return{x:width-(y/height)*width,y:(x/width)*height};
    if(a===180)return{x:width-x,y:height-y};
    if(a===270)return{x:(y/height)*width,y:height-(x/width)*height};
    return{x,y};
  }
};

window.StandaloneMarketHandMode={
  running:false,
  sleeping:false,
  timer:null,
  sleepMs:5000,

  clearTimer(){
    if(this.timer){clearTimeout(this.timer);this.timer=null}
  },

  noteInteraction(){
    if(!this.running)return;
    this.clearTimer();
    this.timer=setTimeout(()=>this.sleep(),this.sleepMs);
  },

  async start(){
    if(this.running)return;

    const status=document.getElementById("handStatus");
    const cursor=document.getElementById("handCursor");
    const video=document.querySelector("video");

    if(!video||!window.ClassroomHandTracking)return;

    if(status){
      status.style.display="block";
      status.textContent="手势：启动中…";
    }

    await window.ClassroomHandTracking.start({
      video,
      cursor,
      mirror:false,
      maxFps:18,
      smoothing:.38,
      pinchDownRatio:.34,
      pinchUpRatio:.44,
      reuseExistingVideo:true,
      viewport:()=>({width:innerWidth,height:innerHeight}),
      onStatus:(msg)=>{
        if(status)status.textContent="手势："+msg;
      },
      onArmedChange:(armed)=>{
        if(status)status.textContent=armed?"手势：MARKET":"放下识别卡，张开手 ✋";
      },
      onMetrics:(data)=>{
        if(!status)return;
        if(!data.handVisible)status.textContent="手势：请伸出一只手";
        else if(data.armed===false)status.textContent="放下识别卡，张开手 ✋";
        else if(data.pinching)status.textContent="手势：选择";
        else status.textContent="手势：MARKET";
      }
    });

    this.running=true;
    this.sleeping=false;
    this.noteInteraction();
    window.ClassroomHandTracking.requireReleaseToArm(300);

    const btn=document.getElementById("handBtn");
    if(btn)btn.textContent="✨ INTERACT · ON";
  },

  sleep(){
    if(!this.running)return;

    this.clearTimer();
    window.ClassroomHandTracking?.stop({keepVideo:true,keepModel:true});
    this.running=false;
    this.sleeping=true;

    const cursor=document.getElementById("handCursor");
    const status=document.getElementById("handStatus");
    const btn=document.getElementById("handBtn");

    if(cursor)cursor.style.display="none";
    if(status){
      status.style.display="block";
      status.textContent="手势：已关闭 · 再点 INTERACT 唤醒";
    }
    if(btn)btn.textContent="✨ INTERACT · OFF";
  },

  toggle(){
    this.running?this.sleep():this.start();
  }
};

  showStory(){

    window.StandaloneSpiderHandMode?.sleep();

    document.getElementById("spiderRetryBtn").style.display="none";
    document.getElementById("spiderLeaveBtn").style.display="none";

    ["spiderFightBtn","spiderLeaveBtn","spiderRetryBtn","handBtn","handStatus","spiderProgress"].forEach(id=>{
      const el=document.getElementById(id);if(el)el.style.display="none";

AFRAME.registerComponent("spider-canvas",{
  init(){
    this.c=document.getElementById("spiderCanvas");
    this.ctx=this.c.getContext("2d");
    this.mode="waiting";
    this.start=performance.now();

    this.img={};
    this.loaded=0;

    const sources={
      body:"./assets/spider/spider_body.png",
      shadow:"./assets/spider/spider_shadow.png",
      web:"./assets/spider/spider_web.png",
      dust:"./assets/spider/spider_dust.png",
      lines:"./assets/spider/spider_attack_lines.png",
      bin:"./assets/spider/spider_bin.png"
    };

    const entries=Object.entries(sources);
    this.total=entries.length;

    entries.forEach(([k,src])=>{
      const im=new Image();
      im.onload=()=>{this.img[k]=im;this.loaded++};
      im.src=src;
    });

    this.resetGame();
  },

  setMode(mode){
    this.mode=mode;
    this.start=performance.now();
    this._last=0;
  },

  resetGame(){
    const specs=[
      {x:110,y:105,vx:44,vy:31,phase:.2,scale:.13},
      {x:655,y:115,vx:-41,vy:34,phase:1.4,scale:.12},
      {x:135,y:330,vx:47,vy:-35,phase:2.7,scale:.13},
      {x:635,y:305,vx:-45,vy:-30,phase:4.1,scale:.12}
    ];
    this.spiders=specs.map((s,i)=>({
      ...s,
      id:i,
      caught:false,
      dragging:false,
      wanderPhase:Math.random()*Math.PI*2,
      wanderSpeed:.55+Math.random()*.75,
      turnBias:(Math.random()-.5)*.9,
      nextTurn:performance.now()+700+Math.random()*1400
    }));
    this.lastGameTime=performance.now();
    this.updateProgress();
    this._last=0;
  },

  updateProgress(){
    const caught=this.spiders?.filter(s=>s.caught).length||0;
    const p=document.getElementById("spiderProgress");
    if(p)p.textContent=`🕷️ ${caught} / 4`;
  },

  getSpider(id){
    return this.spiders.find(s=>s.id===id);
  },

  setSpiderPosition(id,x,y){
    const s=this.getSpider(id);
    if(!s||s.caught)return;
    s.x=Math.max(55,Math.min(713,x));
    // v7 moved the bin lower, so allow a dragged spider to travel deep enough
    // into the bin. The previous max Y=400 made the front-rim threshold
    // physically unreachable.
    s.y=Math.max(45,Math.min(495,y));
    s.dragging=true;
    this._last=0;
  },

  releaseSpider(id){
    const s=this.getSpider(id);
    if(!s||s.caught)return false;
    s.dragging=false;

    // IMPORTANT: use the exact same bin geometry as drawGame().
    // In v5 the visual hide threshold and the drop-success threshold were
    // different, so the spider could disappear visually but fail the drop.
    const w=this.c.width,h=this.c.height;
    const binW=220;
    const binRatio=this.img.bin?.naturalHeight/Math.max(1,this.img.bin?.naturalWidth||1);
    const binH=binW*binRatio;
    const binCX=w*.50;
    const binCY=h*.84;
    const frontRimY=binCY-binH*.12;

    const withinMouthX =
      s.x>=binCX-binW*.44 && s.x<=binCX+binW*.44;

    const belowFrontRim =
      s.y>=frontRimY-6;

    if(withinMouthX && belowFrontRim){
      s.caught=true;
      s.dragging=false;
      this.updateProgress();

      const caught=this.spiders.filter(x=>x.caught).length;

      if(caught>=4){
        setTimeout(()=>window.SpiderMode.complete(),180);
      }else{
        window.SpiderMode.setHint(`抓到了！还有 ${4-caught} 只小蜘蛛`);
      }
      return true;
    }

    window.SpiderMode.setHint("再往下放一点，越过桶口前沿就可以啦！");
    return false;
  },

  drawCentered(img,cx,cy,w,h,r=0,a=1){
    if(!img)return;
    const ctx=this.ctx;
    ctx.save();
    ctx.globalAlpha=a;
    ctx.translate(cx,cy);
    ctx.rotate(r);
    ctx.drawImage(img,-w/2,-h/2,w,h);
    ctx.restore();
  },

  drawStory(now){
    const c=this.c,w=c.width,h=c.height;
    const t=((now-this.start)/1000)%3.8;

    this.drawCentered(this.img.web,w*.50,h*.61,w*.86,h*.49,0,.46);

    let x=0,y=0,sx=1,sy=1,rot=0;
    let shadowSx=1,shadowSy=.62,shadowA=.48;
    let dustA=0,dustScale=.75,dustX=0;
    let linesA=0,linesScale=.72;

    if(t<1.45){
      const u=t/1.45,b=Math.sin(u*Math.PI*4);
      y=b*5;sx=1+b*.012;sy=1-b*.018;
      rot=Math.sin(u*Math.PI*2)*.7*Math.PI/180;
      shadowSx=1-b*.018;shadowSy=.62+b*.015;
    }else if(t<2.55){
      const u=(t-1.45)/1.10,e=u*u*(3-2*u);
      y=-9*e+Math.sin(u*Math.PI*4)*4;
      x=Math.sin(u*Math.PI*2)*8;
      sx=1.015+.02*Math.sin(u*Math.PI*2);
      sy=.985-.015*Math.sin(u*Math.PI*2);
      rot=Math.sin(u*Math.PI*2)*1.2*Math.PI/180;
      dustA=.18+.28*Math.sin(Math.PI*u);
      dustScale=.72+.12*e;dustX=-x*.7;
      shadowSx=1.02;shadowSy=.58;
    }else if(t<3.15){
      const u=(t-2.55)/.60;
      if(u<.34){
        const q=u/.34;
        y=13*q;sx=1.05-.04*q;sy=.94+.03*q;
        rot=Math.sin(q*Math.PI)*1.2*Math.PI/180;
        shadowSx=.92;shadowSy=.56;
      }else{
        const q=(u-.34)/.66,e=1-Math.pow(1-q,3);
        y=13-62*e;sx=1.01+.20*e;sy=.97+.16*e;
        rot=Math.sin(q*Math.PI)*1.8*Math.PI/180;
        linesA=Math.sin(Math.PI*q)*.88;
        linesScale=.70+.20*e;
        dustA=.30+.45*Math.sin(Math.PI*q);
        dustScale=.82+.18*e;
        shadowSx=1.04+.10*e;shadowSy=.55-.08*e;shadowA=.48-.10*e;
      }
    }else{
      const u=(t-3.15)/.65,e=u*u*(3-2*u);
      y=-44*(1-e);sx=1.18-.18*e;sy=1.12-.12*e;
      rot=Math.sin((1-u)*Math.PI)*.8*Math.PI/180;
      linesA=(1-u)*.18;dustA=(1-u)*.25;dustScale=.95-.12*e;
      shadowSx=1.12-.12*e;shadowSy=.50+.12*e;shadowA=.40+.08*e;
    }

    if(linesA>0){
      this.drawCentered(this.img.lines,w*.50,h*.47,w*.94*linesScale,h*.94*linesScale,0,linesA);
    }
    this.drawCentered(this.img.shadow,w*.50,h*.70,w*.49*shadowSx,h*.18*shadowSy,0,shadowA);
    if(dustA>0){
      this.drawCentered(this.img.dust,w*.50+dustX,h*.69,w*.79*dustScale,h*.40*dustScale,0,dustA);
    }

    const body=this.img.body;
    if(body){
      const ratio=body.naturalHeight/body.naturalWidth;
      const bw=w*.58,bh=bw*ratio;
      this.ctx.save();
      this.ctx.translate(w*.50+x,h*.47+y);
      this.ctx.rotate(rot);this.ctx.scale(sx,sy);
      this.ctx.drawImage(body,-bw/2,-bh/2,bw,bh);
      this.ctx.restore();
    }
  },

  drawGame(now){
    const c=this.c,w=c.width,h=c.height;
    const dt=Math.min(.05,(now-this.lastGameTime)/1000);
    this.lastGameTime=now;

    // Web extends beyond the full roaming area of all four small spiders.
    // Oversize it deliberately so spiders always appear to be running on the web.
    this.drawCentered(this.img.web,w*.50,h*.48,w*1.48,h*1.08,0,.21);

    // Bin at bottom-center.
    // First draw the whole bin behind the spiders. After the spiders are drawn,
    // redraw only the FRONT wall of the bin so a dragged spider appears to go
    // inside the opening instead of floating in front of the bin.
    const binW=220;
    const binRatio=this.img.bin?.naturalHeight/Math.max(1,this.img.bin?.naturalWidth||1);
    const binH=binW*binRatio;
    const binCX=w*.50;
    const binCY=h*.84;

    // Approximate visible mouth / front-rim positions in canvas space.
    const mouthY=binCY-binH*.34;
    const frontRimY=binCY-binH*.12;

    this.drawCentered(this.img.bin,binCX,binCY,binW,binH,0,1);

    for(const s of this.spiders){
      if(s.caught)continue;

      if(!s.dragging){
        // Organic roaming: mild sinusoidal drift plus occasional random turns.
        const nowMs=now;
        if(nowMs>=s.nextTurn){
          const speed=Math.max(34,Math.min(58,Math.hypot(s.vx,s.vy)));
          const angle=Math.atan2(s.vy,s.vx)+(Math.random()-.5)*1.25+s.turnBias*.18;
          s.vx=Math.cos(angle)*speed;
          s.vy=Math.sin(angle)*speed;
          s.nextTurn=nowMs+650+Math.random()*1700;
          s.turnBias=(Math.random()-.5)*.9;
        }

        const drift=Math.sin(nowMs*.001*s.wanderSpeed+s.wanderPhase);
        s.x+=(s.vx+drift*5.5)*dt;
        s.y+=(s.vy+Math.cos(nowMs*.0011*s.wanderSpeed+s.wanderPhase)*4.5)*dt;

        // Use almost the full canvas so they don't bunch up.
        if(s.x<55){s.x=55;s.vx=Math.abs(s.vx)*(0.92+Math.random()*.18)}
        if(s.x>w-55){s.x=w-55;s.vx=-Math.abs(s.vx)*(0.92+Math.random()*.18)}
        if(s.y<45){s.y=45;s.vy=Math.abs(s.vy)*(0.92+Math.random()*.18)}
        if(s.y>h-95){s.y=h-95;s.vy=-Math.abs(s.vy)*(0.92+Math.random()*.18)}

        // Keep a soft no-roam zone around the bin so play starts with some distance.
        const bx=w*.50, by=h*.79;
        const dx=s.x-bx, dy=s.y-by;
        const d=Math.hypot(dx,dy);
        const avoidR=155;
        if(d<avoidR && d>0.001){
          const push=(avoidR-d)/avoidR;
          s.x+=(dx/d)*42*push*dt;
          s.y+=(dy/d)*42*push*dt;
          s.vx+=(dx/d)*18*push;
          s.vy+=(dy/d)*18*push;
        }
      }

      const wiggle=Math.sin(now*.006+s.phase);
      const body=this.img.body;
      if(!body)continue;

      let visualScale=1;
      let visualY=s.y;
      let visualAlpha=1;

      const insideMouthX =
        Math.abs(s.x-binCX) < binW*.44;

      if(s.dragging && insideMouthX){
        // At the bin opening: gradually shrink.
        if(s.y>=mouthY && s.y<frontRimY){
          const depth=Math.max(0,Math.min(1,(s.y-mouthY)/(frontRimY-mouthY)));
          visualScale=1-.48*depth;
          visualY=s.y+8*depth;
        }
        // Once below the front rim, hide the spider completely.
        else if(s.y>=frontRimY){
          visualScale=.52;
          visualY=s.y+8;
          visualAlpha=0;
        }
      }

      const size=w*s.scale*(1+.025*wiggle)*visualScale;
      const ratio=body.naturalHeight/body.naturalWidth;
      this.drawCentered(body,s.x,visualY,size,size*ratio,wiggle*.045,visualAlpha);
    }

    // Front-wall occlusion pass.
    // Keep the top/opening behind the spider, but paint the lower ~72% of the
    // bin back on top. This creates a convincing "drop into the bin" effect.
    if(this.img.bin){
      const img=this.img.bin;
      const srcY=Math.round(img.naturalHeight*.38);
      const srcH=img.naturalHeight-srcY;
      const dstTop=frontRimY;
      const dstH=(binCY+binH/2)-frontRimY;

      this.ctx.save();
      this.ctx.drawImage(
        img,
        0,srcY,img.naturalWidth,srcH,
        binCX-binW/2,dstTop,binW,dstH
      );
      this.ctx.restore();
    }
  },

  tick(){
    if(this.loaded<this.total)return;

    const now=performance.now();
    const frameMs=this.mode==="game"?33:50;
    if(this._last&&now-this._last<frameMs)return;
    this._last=now;

    const c=this.c,ctx=this.ctx;
    ctx.clearRect(0,0,c.width,c.height);

    if(this.mode==="story")this.drawStory(now);
    else if(this.mode==="game"||this.mode==="complete")this.drawGame(now);

    const mesh=this.el.getObject3D("mesh");
    if(mesh?.material?.map)mesh.material.map.needsUpdate=true;
  }
});

AFRAME.registerComponent("spider-controller",{
  schema:{world:{type:"selector"}},

  init(){
    this.world=this.data.world;
    this.tracking=false;
    this.holding=false;
    this.dragState=null;
    this.poseHistory=[];
    this.maxPoseHistory=24;
    this.basePos=new THREE.Vector3();
    this.baseScale=new THREE.Vector3(1,1,1);

    this.planeWidth=2.15;
    this.planeHeight=2.15;
    this.canvasW=768;
    this.canvasH=512;

    if(this.world)this.world.object3D.visible=false;

    window.CityInput.register("spider-game",{
      down:(input)=>this.handleDown(input),
      move:(input)=>this.handleMove(input),
      up:(input)=>this.handleUp(input),
      cancel:(input)=>this.handleUp(input)
    });

    window.CityInput.register("spider-hand-auto-sleep",{
      down:(input)=>{if(input.source==="hand")window.StandaloneSpiderHandMode.noteInteraction()},
      up:(input)=>{if(input.source==="hand")window.StandaloneSpiderHandMode.noteInteraction()}
    });

    this.el.addEventListener("targetFound",()=>{
      if(window.SpiderMode.mode!=="waiting")return;

      window.DIYSceneManager?.activate("spider");

      this.tracking=true;
      this.holding=false;
      this.poseHistory=[];

      if(this.world)this.world.object3D.visible=true;
      window.SpiderMode.showStory();
    });

    this.el.addEventListener("targetLost",()=>{
      if(window.SpiderMode.mode==="waiting")return;

      this.tracking=false;
      this.holding=true;
      this.holdStart=performance.now();

      let stable=null;
      const now=performance.now();

      for(let i=this.poseHistory.length-1;i>=0;i--){
        if(now-this.poseHistory[i].time>=260){
          stable=this.poseHistory[i];
          break;
        }
      }
      if(!stable&&this.poseHistory.length)stable=this.poseHistory[0];

      if(stable){
        this.basePos.copy(stable.pos);
        this.baseScale.copy(stable.scale);
      }else{
        this.el.object3D.updateMatrixWorld(true);
        const p=new THREE.Vector3(),q=new THREE.Quaternion(),sc=new THREE.Vector3();
        this.el.object3D.matrixWorld.decompose(p,q,sc);
        this.basePos.copy(p);
        this.baseScale.copy(sc);
      }

      if(this.world){
        const o=this.world.object3D;
        o.position.copy(this.basePos);
        o.quaternion.identity();
        o.scale.copy(this.baseScale);
        o.visible=true;
        o.updateMatrixWorld(true);
      }
    });
  },

  getCanvasComp(){
    return document.getElementById("spiderDisplay")?.components?.["spider-canvas"];
  },

  getCamera(){
    if(!this.camera){
      const e=document.querySelector("a-camera");
      this.camera=e&&e.getObject3D("camera");
    }
    return this.camera;
  },

  projectWorld(v){
    const cam=this.getCamera();
    if(!cam)return null;
    const p=v.clone().project(cam);
    return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight};
  },

  canvasToLocal(x,y){
    return new THREE.Vector3(
      (x/this.canvasW-.5)*this.planeWidth,
      (.5-y/this.canvasH)*this.planeHeight,
      .10
    );
  },

  screenToCanvas(x,y){
    if(!this.world)return null;
    const obj=this.world.object3D;
    obj.updateMatrixWorld(true);

    const center=this.projectWorld(new THREE.Vector3(0,0,0).applyMatrix4(obj.matrixWorld));
    const right=this.projectWorld(new THREE.Vector3(.5,0,0).applyMatrix4(obj.matrixWorld));
    const up=this.projectWorld(new THREE.Vector3(0,.5,0).applyMatrix4(obj.matrixWorld));
    if(!center||!right||!up)return null;

    const pxPerUnitX=Math.max(1,Math.abs(right.x-center.x)*2);
    const pxPerUnitY=Math.max(1,Math.abs(up.y-center.y)*2);

    const localX=(x-center.x)/pxPerUnitX;
    const localY=-(y-center.y)/pxPerUnitY;

    return{
      x:(localX/this.planeWidth+.5)*this.canvasW,
      y:(.5-localY/this.planeHeight)*this.canvasH
    };
  },

  hitSpiderAt(screenX,screenY,source){
    if(window.SpiderMode.mode!=="game")return null;
    const c=this.screenToCanvas(screenX,screenY);
    const comp=this.getCanvasComp();
    if(!c||!comp)return null;

    // generous hit radius for small hands
    let best=null,bestD=Infinity;
    for(const s of comp.spiders){
      if(s.caught)continue;
      const d=Math.hypot(c.x-s.x,c.y-s.y);
      const radius=source==="hand"?78:60;
      if(d<=radius&&d<bestD){best=s.id;bestD=d}
    }
    return best;
  },

  handleDown(input){
    if(window.SpiderMode.mode!=="game")return;
    const id=this.hitSpiderAt(input.x,input.y,input.source);
    if(id===null)return;

    if(input.nativeEvent)input.nativeEvent.preventDefault();

    const comp=this.getCanvasComp();
    const pt=this.screenToCanvas(input.x,input.y);
    const s=comp?.getSpider(id);
    if(!comp||!pt||!s)return;

    this.dragState={
      pointerId:input.pointerId,
      id,
      dx:s.x-pt.x,
      dy:s.y-pt.y
    };
    s.dragging=true;
    window.SpiderMode.setHint("抓住了！把它放进垃圾筐 🗑️");
  },

  handleMove(input){
    if(!this.dragState||input.pointerId!==this.dragState.pointerId)return;
    if(input.nativeEvent)input.nativeEvent.preventDefault();

    const pt=this.screenToCanvas(input.x,input.y);
    const comp=this.getCanvasComp();
    if(!pt||!comp)return;

    comp.setSpiderPosition(
      this.dragState.id,
      pt.x+this.dragState.dx,
      pt.y+this.dragState.dy
    );
  },

  handleUp(input){
    if(!this.dragState||input.pointerId!==this.dragState.pointerId)return;

    const comp=this.getCanvasComp();
    comp?.releaseSpider(this.dragState.id);
    this.dragState=null;
  },

  hideWorld(){
    this.tracking=false;
    this.holding=false;
    this.dragState=null;
    if(this.world)this.world.object3D.visible=false;
  },

  tick(){
    if(!this.world||window.SpiderMode.mode==="waiting")return;

    const now=performance.now();
    const active=this.tracking||this.dragState;
    const frameMs=active?33:67;
    if(this._last&&now-this._last<frameMs)return;
    this._last=now;

    const obj=this.world.object3D;

    if(this.tracking){
      this.el.object3D.updateMatrixWorld(true);
      const p=new THREE.Vector3(),q=new THREE.Quaternion(),sc=new THREE.Vector3();
      this.el.object3D.matrixWorld.decompose(p,q,sc);

      this.poseHistory.push({pos:p.clone(),scale:sc.clone(),time:now});
      if(this.poseHistory.length>this.maxPoseHistory)this.poseHistory.shift();

      this.basePos.copy(p);
      this.baseScale.copy(sc);

      obj.position.copy(p);
      obj.quaternion.identity();
      obj.scale.copy(sc);
      obj.visible=true;
      obj.updateMatrixWorld(true);
    }else if(this.holding){
      // Hold in a stable location after the recognition card is removed.
      obj.position.copy(this.basePos);
      obj.quaternion.identity();
      obj.scale.copy(this.baseScale);
      obj.visible=true;
      obj.updateMatrixWorld(true);
    }
  }
});

<script>
/* ---------- Unified DIY scene state ---------- */
window.DIYSceneManager={
  active:null,

  setHint(text){
    const h=document.getElementById("hint");
    if(h)h.textContent=text;
  },

  stopHands(){
    window.StandaloneHandMode?.sleep();
    window.StandaloneMarketHandMode?.sleep();
    window.StandaloneSpiderHandMode?.sleep();
    const cursor=document.getElementById("handCursor");
    if(cursor)cursor.style.display="none";
  },

  hideBuilding(){
    const mini=document.getElementById("storyCityMini");
    if(mini){
      mini.classList.remove("show","near");
      mini.style.display="none";
      mini.style.opacity="0";
    }

    const sw=document.getElementById("buildingViewSwitch");
    if(sw)sw.style.display="none";

    document.getElementById("buildingFarBtn")?.classList.add("active");
    document.getElementById("buildingNearBtn")?.classList.remove("active");
  },

  hidePark(){
    window.StandaloneHandMode?.sleep();
    document.body.classList.remove("park-story");

    ["parkStoryLayer","fixParkBtn","doneParkBtn","dragLayer"].forEach(id=>{
      const el=document.getElementById(id);if(el)el.style.display="none";
    });

    const c=document.querySelector('[park-drag-controller]')?.components?.["park-drag-controller"];
    if(c){
      c.tracking=false;c.holding=false;c.dragState=null;c.hideHits?.();
    }

    const w=document.getElementById("parkWorld");
    if(w)w.object3D.visible=false;
  },

  hideMarket(){
    window.StandaloneMarketHandMode?.sleep();
    document.body.classList.remove("market-story","market-shop");

    ["marketStoryLayer","shopBtn","checkoutBtn","holdHitLayer"].forEach(id=>{
      const el=document.getElementById(id);if(el)el.style.display="none";
    });

    const c=document.querySelector('[market-persist]')?.components?.["market-persist"];
    if(c){
      c.tracking=false;c.holding=false;c.dragState=null;c.hideHoldHits?.();
    }

    const w=document.getElementById("marketWorld");
    if(w)w.object3D.visible=false;
  },

  hideSpider(){
    window.StandaloneSpiderHandMode?.sleep();
    ["spiderFightBtn","spiderRetryBtn","spiderLeaveBtn","spiderProgress"].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display="none"});
    const ctrl=document.querySelector('[spider-controller]')?.components?.["spider-controller"];
    if(ctrl){ctrl.tracking=false;ctrl.holding=false;ctrl.dragState=null;ctrl.hideWorld?.()}
    const comp=document.getElementById("spiderDisplay")?.components?.["spider-canvas"];
    if(comp){comp.setMode("waiting");comp.resetGame()}
    if(window.SpiderMode)window.SpiderMode.mode="waiting";
  },

  hideAll(){
    this.stopHands();
    this.hideBuilding();
    this.hidePark();
    this.hideMarket();
    this.hideSpider();
    document.body.classList.remove("diy-building","diy-park","diy-market","diy-spider");
  },

  activate(kind){
    if(this.active!==kind)this.hideAll();

    this.active=kind;
    document.body.classList.remove("diy-waiting","diy-building","diy-park","diy-market","diy-spider");
    document.body.classList.add("diy-"+kind);

    const leave=document.getElementById("leaveSceneBtn");
    if(leave){
      leave.style.display="block";
      leave.textContent=kind==="building"?"← 离开城市":kind==="park"?"← 离开公园":kind==="market"?"← 离开市场":"← 离开蜘蛛挑战";
    }
  },

  showBuilding(){
    this.activate("building");

    const sw=document.getElementById("buildingViewSwitch");
    if(sw)sw.style.display="flex";

    this.setBuildingFar();
  },

  setBuildingFar(){
    if(this.active!=="building")return;

    const mini=document.getElementById("storyCityMini");
    if(mini){
      mini.hidden=false;
      mini.style.display="block";
      mini.style.opacity="";
      mini.classList.add("show");
      mini.classList.remove("near");
    }

    document.getElementById("buildingFarBtn")?.classList.add("active");
    document.getElementById("buildingNearBtn")?.classList.remove("active");

    this.setHint("CITY · 🌆 远景 · 用玩偶讲故事");
  },

  setBuildingNear(){
    if(this.active!=="building")return;

    const mini=document.getElementById("storyCityMini");
    if(mini){
      mini.hidden=false;
      mini.style.display="block";
      mini.style.opacity="";
      mini.classList.add("show");
      requestAnimationFrame(()=>mini.classList.add("near"));
    }

    document.getElementById("buildingFarBtn")?.classList.remove("active");
    document.getElementById("buildingNearBtn")?.classList.add("active");

    this.setHint("CITY · 🔎 近景 · 城市来到眼前");
  },

  leaveCurrent(){
    this.hideAll();
    this.active=null;
    document.body.classList.add("diy-waiting");

    const leave=document.getElementById("leaveSceneBtn");
    if(leave)leave.style.display="none";

    this.setHint("✨ 扫描 BUILDING / PARK / MARKET / SPIDER 开始一个场景，也可以随时扫描 CLOUD / FIRE / RAIN / GROW");
  },

  handToggle(){
    if(this.active==="park")window.StandaloneHandMode?.toggle();
    else if(this.active==="market")window.StandaloneMarketHandMode?.toggle();
    else if(this.active==="spider")window.StandaloneSpiderHandMode?.toggle();
  }
};

AFRAME.registerComponent("diy-scene-trigger",{
  schema:{kind:{type:"string"}},
  init(){

  document.body.classList.add("diy-waiting");

  document.getElementById("homeBtn")

  document.getElementById("leaveSceneBtn")

  document.getElementById("handBtn")

  window.DIYSceneManager.leaveCurrent();
});
</script>

  mindar-image="imageTargetSrc: ./targets/citywithmagic.mind; autoStart: true; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true;antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"
    cursor="fuse:false; rayOrigin:mouse"
    raycaster="objects:.clickable; far:10000"></a-camera>

  <!-- Scene targets -->
  <a-entity mindar-image-target="targetIndex:0" diy-scene-trigger="kind:building"></a-entity>

  <a-entity mindar-image-target="targetIndex:1"
    diy-scene-trigger="kind:park"
    park-drag-controller="world:#parkWorld">
  </a-entity>

  <a-entity mindar-image-target="targetIndex:2"
    diy-scene-trigger="kind:market"
    market-persist="world:#marketWorld">
  </a-entity>

  <!-- Magic targets remain exactly Magic Only's mapping -->
  <a-entity mindar-image-target="targetIndex:3" magic-target="kind:cloud"></a-entity>
  <a-entity mindar-image-target="targetIndex:4" magic-target="kind:fire"></a-entity>
  <a-entity mindar-image-target="targetIndex:5" magic-target="kind:rain"></a-entity>
  <a-entity mindar-image-target="targetIndex:6" magic-target="kind:grow"></a-entity>

  <!-- SPIDER is targetIndex 7 in the updated citywithmagic.mind -->
  <a-entity mindar-image-target="targetIndex:7" spider-controller="world:#spiderWorld"></a-entity>

  <a-entity id="parkWorld" visible="false">
    <a-plane id="parkDisplay"
      width="2.15" height="1.43" position="0 0.03 0.02"
      material="shader:flat;src:#parkCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      park-canvas>
    </a-plane>
  </a-entity>

  <a-entity id="marketWorld" visible="false">
    <a-plane id="marketDisplay"
      width="2.15" height="1.43" position="0 0.03 0.02"
      material="shader:flat;src:#marketCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      market-canvas>
    </a-plane>

    <a-plane class="clickable" pick-item="kind:peach"
      position="-0.38 0.35 0.10" width="0.58" height="0.58"
      material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"></a-plane>
    <a-plane class="clickable" pick-item="kind:cabbage"
      position="0 0.38 0.10" width="0.58" height="0.58"
      material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"></a-plane>
    <a-plane class="clickable" pick-item="kind:egg"
      position="0.38 0.35 0.10" width="0.58" height="0.58"
      material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"></a-plane>
    <a-plane class="clickable" position="0 -0.62 0.14"
      width="0.74" height="0.30"
      material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"
      reset-market></a-plane>
  </a-entity>

  <a-entity id="spiderWorld" visible="false">
    <a-plane id="spiderDisplay" width="2.15" height="2.15" position="0 0.03 0.02"
      material="shader:flat;src:#spiderCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double" spider-canvas>
    </a-plane>
  </a-entity>
</a-scene>

</body>
</html>
