<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Journey to the West AR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:32px;background:linear-gradient(145deg,#fff8e9,#eef8ef);color:#26332a}
main{width:min(920px,100%);text-align:center}
h1{margin:0 0 8px;font-size:clamp(30px,5vw,54px)}
.lead{margin:0 0 30px;color:#5a665d;font-size:clamp(15px,2vw,19px)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card{min-height:270px;border-radius:28px;padding:30px 26px;background:rgba(255,255,255,.94);box-shadow:0 16px 42px rgba(45,65,50,.13);color:inherit;text-decoration:none;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform .18s,box-shadow .18s}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 20px 48px rgba(45,65,50,.18)}
.icon{font-size:62px;margin-bottom:14px}
.en{font-weight:800;letter-spacing:.05em;color:#708076;font-size:13px}
.card h2{font-size:27px;margin:7px 0 8px}
.desc{margin:12px auto 0;max-width:330px;line-height:1.6;color:#59645d}
.go{margin-top:20px;font-weight:800}
@media(max-width:680px){.choices{grid-template-columns:1fr}.card{min-height:220px}}
</style>
</head>
<body>
<main>
<h1>Journey to the West World</h1>
<p class="lead">Choose one method to tell your story</p>
<div class="choices">
  <a class="card" href="./classroom_city_story_scene_demo.html">
    <div class="icon">🏞️</div>
    <div class="en">AR STORY WORLD</div>
    <h2>Enter Story World</h2>
    <p class="desc">You will see AR scene</p>
    <div class="go">START →</div>
  </a>
  <a class="card" href="./classroom_magic_only.html">
    <div class="icon">✨</div>
    <div class="en">MY OWN STORY</div>
    <h2>Build My Own Story World</h2>
    <p class="desc">Build your own scene and you can use AR magic card</p>
    <div class="go">START →</div>
  </a>
</div>
</main>
</body>
</html>
