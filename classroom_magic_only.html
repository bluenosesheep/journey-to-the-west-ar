<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Journey to the West AR · Magic Only</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}
canvas.a-canvas{background:transparent!important}
#homeBtn{position:fixed;left:18px;top:18px;z-index:80;border:0;border-radius:999px;padding:10px 15px;background:rgba(255,255,255,.94);color:#26332a;font-weight:800;box-shadow:0 5px 18px rgba(0,0,0,.16);cursor:pointer}
#modeLabel{position:fixed;right:18px;top:18px;z-index:80;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.90);font-weight:800;box-shadow:0 5px 18px rgba(0,0,0,.12)}
#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;max-width:min(88vw,680px);padding:11px 17px;border-radius:999px;background:rgba(255,255,255,.94);color:#27322b;text-align:center;font:700 15px/1.35 system-ui,sans-serif;box-shadow:0 6px 22px rgba(0,0,0,.16)}


/* Hide MindAR scanning animation only; recognition continues normally. */
.mindar-ui-scanning,
.mindar-ui-scanning .scanning,
.mindar-ui-scanning .scanning-line,
.mindar-ui-scanning .inner,
.mindar-ui-scanning .scanline{
  display:none !important;
  opacity:0 !important;
  visibility:hidden !important;
  pointer-events:none !important;
}
</style>
<script src="./js/magic-only-manager.js?v=1"></script>
</head>
<body>
<button id="homeBtn" type="button">← HOME</button>
<div id="modeLabel">✨ MY OWN STORY</div>
<div id="hint">自由讲故事吧 · 需要魔法时扫描 CLOUD / FIRE / RAIN / GROW</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets/citywithmagic.mind; autoStart: false; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true;antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex:3" magic-target="kind:cloud"></a-entity>
  <a-entity mindar-image-target="targetIndex:4" magic-target="kind:fire"></a-entity>
  <a-entity mindar-image-target="targetIndex:5" magic-target="kind:rain"></a-entity>
  <a-entity mindar-image-target="targetIndex:6" magic-target="kind:grow"></a-entity>
</a-scene>

<script>
(() => {
  const TARGET_URL = './targets/citywithmagic.mind';
  const scene = document.querySelector('a-scene');
  const hint = document.getElementById('hint');
  let started = false;

  const setHint = text => { if (hint) hint.textContent = text; };

  function waitForSceneLoaded(){
    return new Promise(resolve => {
      if (scene && scene.hasLoaded) return resolve();
      scene?.addEventListener('loaded', resolve, {once:true});
    });
  }

  async function warmTarget(){
    // This is intentionally done before MindAR starts. If Index already warmed
    // the file, this resolves from the browser cache; otherwise it completes the
    // first download here instead of racing MindAR's own startup.
    const response = await fetch(TARGET_URL, {cache:'force-cache', credentials:'same-origin'});
    if (!response.ok) throw new Error(`Target HTTP ${response.status}`);
    await response.arrayBuffer();
  }

  async function startMindAR(){
    if (started) return;
    started = true;
    setHint('正在准备 AR 识别…');

    try {
      await Promise.all([waitForSceneLoaded(), warmTarget()]);
      const system = scene?.systems?.['mindar-image-system'];
      if (!system) throw new Error('MindAR image system is not ready');

      const ready = () => setHint('自由讲故事吧 · 需要魔法时扫描 CLOUD / FIRE / RAIN / GROW');
      const failed = () => {
        started = false;
        setHint('AR 启动失败，请刷新页面再试一次');
      };
      scene.addEventListener('arReady', ready, {once:true});
      scene.addEventListener('arError', failed, {once:true});

      await system.start();
    } catch (err) {
      console.error('Magic Only startup failed:', err);
      started = false;
      setHint('AR 启动失败，请刷新页面再试一次');
    }
  }

  // Start only after DOM exists; camera/MindAR no longer races the .mind download.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startMindAR, {once:true});
  } else {
    startMindAR();
  }
})();
</script>

<script>
document.getElementById("homeBtn").addEventListener("click",()=>location.href="./index.html");
</script>
</body>
</html>
