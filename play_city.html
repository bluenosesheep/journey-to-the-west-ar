<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Journey to the West AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}canvas.a-canvas{background:transparent!important}.off{display:none}#hint{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;max-width:88vw;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font:14px system-ui;text-align:center}</style>
<script>
AFRAME.registerComponent("building-events",{init:function(){const h=document.getElementById("hint");this.el.addEventListener("targetFound",()=>h.textContent="CITY · 建筑出现啦！🏙️");this.el.addEventListener("targetLost",()=>h.textContent="选择一个城市场景或 MAGIC 卡吧！")}});
AFRAME.registerComponent("park-events",{init:function(){const h=document.getElementById("hint");this.el.addEventListener("targetFound",()=>h.textContent="CITY · 公园出现啦！🌳⛲");this.el.addEventListener("targetLost",()=>h.textContent="选择一个城市场景或 MAGIC 卡吧！")}});
AFRAME.registerComponent("market-events",{init:function(){const h=document.getElementById("hint");this.el.addEventListener("targetFound",()=>h.textContent="CITY · 市场出现啦！🧺🥕");this.el.addEventListener("targetLost",()=>h.textContent="选择一个城市场景或 MAGIC 卡吧！")}});
function makeUpdater(canvasId,sources,drawFn){return{init:function(){this.c=document.getElementById(canvasId);this.ctx=this.c.getContext("2d");this.img={};this.loaded=0;this.start=performance.now();Object.entries(sources).forEach(([k,s])=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>{this.img[k]=i;this.loaded++};i.src=s})},tick:function(){if(this.loaded<Object.keys(sources).length)return;const w=this.c.width,h=this.c.height,t=(performance.now()-this.start)/1000;this.ctx.clearRect(0,0,w,h);drawFn(this.ctx,this.img,w,h,t);const m=this.el.getObject3D("mesh");if(m&&m.material&&m.material.map)m.material.map.needsUpdate=true;}}}
const dc=(ctx,img,x,y,w,h,r=0,a=1)=>{ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(r);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore()};
AFRAME.registerComponent("building-canvas",makeUpdater("buildingCanvas",{building:"./assets/city/building_scene.png"},(ctx,I,w,h,t)=>{dc(ctx,I.building,w*.50,h*.50,w*.98,h*.66,0,1)}));
AFRAME.registerComponent("park-canvas",makeUpdater("parkCanvas",{park:"./assets/city/park_scene.png"},(ctx,I,w,h,t)=>{dc(ctx,I.park,w*.50,h*.50,w*.98,h*.66,0,1)}));
AFRAME.registerComponent("market-canvas",makeUpdater("marketCanvas",{market:"./assets/city/market_scene.png"},(ctx,I,w,h,t)=>{dc(ctx,I.market,w*.50,h*.50,w*.98,h*.66,0,1)}));
</script></head><body>
<div id="hint">选择一个城市场景吧！</div>
<canvas id="buildingCanvas" class="off" width="768" height="512"></canvas><canvas id="parkCanvas" class="off" width="768" height="512"></canvas><canvas id="marketCanvas" class="off" width="768" height="512"></canvas>
<a-scene mindar-image="imageTargetSrc: ./targets/city_world.mind; autoStart: true; maxTrack: 3;" color-space="sRGB" renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity mindar-image-target="targetIndex:0" building-events><a-plane width="1.15" height="1.73" position="0 0.03 0.03" material="shader:flat;src:#buildingCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double" building-canvas></a-plane></a-entity>
<a-entity mindar-image-target="targetIndex:1" park-events><a-plane width="1.75" height="1.17" position="0 0.03 0.03" material="shader:flat;src:#parkCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double" park-canvas></a-plane></a-entity>
<a-entity mindar-image-target="targetIndex:2" market-events><a-plane width="1.75" height="1.17" position="0 0.03 0.03" material="shader:flat;src:#marketCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double" market-canvas></a-plane></a-entity>
</a-scene></body></html>
