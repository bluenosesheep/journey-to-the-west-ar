<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Journey to the West AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}canvas.a-canvas{background:transparent!important}.off{display:none}#hint{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;max-width:88vw;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font:14px system-ui;text-align:center}#holdHitLayer{position:fixed;inset:0;z-index:40;pointer-events:none}.hold-hit{position:fixed;display:none;border:0;background:transparent;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}</style>
<script>
AFRAME.registerComponent("building-events",{init:function(){const h=document.getElementById("hint");this.el.addEventListener("targetFound",()=>h.textContent="CITY · 建筑出现啦！🏙️");this.el.addEventListener("targetLost",()=>h.textContent="选择一个城市场景或 MAGIC 卡吧！")}});
AFRAME.registerComponent("park-events",{init:function(){const h=document.getElementById("hint");this.el.addEventListener("targetFound",()=>h.textContent="CITY · 公园出现啦！🌳⛲");this.el.addEventListener("targetLost",()=>h.textContent="选择一个城市场景或 MAGIC 卡吧！")}});
AFRAME.registerComponent("market-events",{init:function(){const h=document.getElementById("hint");this.el.addEventListener("targetFound",()=>h.textContent="MARKET · 点一个食物放进篮筐吧！🧺");this.el.addEventListener("targetLost",()=>h.textContent="Market 还会停留 15 秒，可以继续选择 🧺");}});

function makeUpdater(canvasId,sources,drawFn){return{init:function(){this.c=document.getElementById(canvasId);this.ctx=this.c.getContext("2d");this.img={};this.loaded=0;this.start=performance.now();Object.entries(sources).forEach(([k,s])=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>{this.img[k]=i;this.loaded++};i.src=s})},tick:function(){if(this.loaded<Object.keys(sources).length)return;const w=this.c.width,h=this.c.height,t=(performance.now()-this.start)/1000;this.ctx.clearRect(0,0,w,h);drawFn(this.ctx,this.img,w,h,t);const m=this.el.getObject3D("mesh");if(m&&m.material&&m.material.map)m.material.map.needsUpdate=true;}}}
const dc=(ctx,img,x,y,w,h,r=0,a=1)=>{ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(r);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore()};
AFRAME.registerComponent("building-canvas",makeUpdater("buildingCanvas",{building:"./assets/city/building_scene.png"},(ctx,I,w,h,t)=>{dc(ctx,I.building,w*.50,h*.50,w*.98,h*.66,0,1)}));
AFRAME.registerComponent("park-canvas",makeUpdater("parkCanvas",{park:"./assets/city/park_scene.png"},(ctx,I,w,h,t)=>{dc(ctx,I.park,w*.50,h*.50,w*.98,h*.66,0,1)}));

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

AFRAME.registerComponent("market-canvas",{
  init:function(){
    this.c=document.getElementById("marketCanvas");
    this.ctx=this.c.getContext("2d");
    this.items={
      peach:{emoji:"🍑",x:250,y:135,tx:348,ty:320,selected:false,start:0},
      cabbage:{emoji:"🥬",x:384,y:118,tx:384,ty:312,selected:false,start:0},
      egg:{emoji:"🥚",x:518,y:135,tx:420,ty:320,selected:false,start:0}
    };
  },
  pick:function(kind){
    const item=this.items[kind];
    if(!item||item.selected)return;
    item.selected=true;item.start=performance.now();
    document.getElementById("hint").textContent="放进篮筐里！";
  },
  reset:function(){
    Object.values(this.items).forEach(item=>{item.selected=false;item.start=0;});
    document.getElementById("hint").textContent="MARKET · 点一个食物放进篮筐吧！🧺";
  },
  tick:function(){
    const ctx=this.ctx,c=this.c,w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h);
    ctx.textAlign="center";ctx.textBaseline="middle";

    Object.values(this.items).forEach(item=>{
      let x=item.x,y=item.y,s=1;
      if(item.selected){
        const p=Math.min(1,(performance.now()-item.start)/650);
        const e=1-Math.pow(1-p,3);
        const arc=Math.sin(Math.PI*p)*75;
        x=item.x+(item.tx-item.x)*e;
        y=item.y+(item.ty-item.y)*e-arc;
        s=1-.50*e;
      }
      ctx.save();ctx.translate(x,y);ctx.scale(s,s);
      ctx.font='96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(item.emoji,0,0);ctx.restore();
    });

    const basketCx=w/2,basketTop=330,basketW=220,basketH=105;
    ctx.save();ctx.lineWidth=18;ctx.lineCap="round";ctx.strokeStyle="#c88435";
    ctx.beginPath();ctx.arc(basketCx,basketTop-8,58,Math.PI,0);ctx.stroke();
    const left=basketCx-basketW/2,right=basketCx+basketW/2,bottom=basketTop+basketH;
    ctx.beginPath();ctx.moveTo(left+18,basketTop);ctx.lineTo(right-18,basketTop);ctx.lineTo(right-38,bottom);ctx.quadraticCurveTo(basketCx,bottom+14,left+38,bottom);ctx.closePath();
    ctx.fillStyle="#d9a45a";ctx.fill();ctx.lineWidth=5;ctx.strokeStyle="#a96f2b";ctx.stroke();
    ctx.fillStyle="#e7b66d";roundRect(ctx,left,basketTop-14,basketW,28,14);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle="#b7772e";ctx.stroke();
    ctx.save();ctx.beginPath();ctx.rect(left+20,basketTop+10,basketW-40,basketH-24);ctx.clip();ctx.strokeStyle="rgba(150,92,35,.55)";ctx.lineWidth=4;
    for(let x=left-40;x<right+40;x+=32){ctx.beginPath();ctx.moveTo(x,basketTop+10);ctx.lineTo(x+90,bottom);ctx.stroke();ctx.beginPath();ctx.moveTo(x+90,basketTop+10);ctx.lineTo(x,bottom);ctx.stroke();}
    ctx.restore();ctx.restore();

    const bx=w/2-86,by=458,bw=172,bh=40,br=20;
    ctx.save();roundRect(ctx,bx,by,bw,bh,br);ctx.fillStyle="rgba(255,248,220,.96)";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#6f8e42";ctx.stroke();
    ctx.fillStyle="#8f2f2a";ctx.font='700 20px system-ui,sans-serif';ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("RESET",w/2,by+bh/2+1);ctx.restore();

    const mesh=this.el.getObject3D("mesh");
    if(mesh&&mesh.material&&mesh.material.map)mesh.material.map.needsUpdate=true;
  }
});

AFRAME.registerComponent("pick-item",{schema:{kind:{type:"string"}},init:function(){this.el.addEventListener("click",()=>{const d=document.getElementById("marketDisplay");const c=d&&d.components["market-canvas"];if(c)c.pick(this.data.kind);});}});
AFRAME.registerComponent("reset-market",{init:function(){this.el.addEventListener("click",()=>{const d=document.getElementById("marketDisplay");const c=d&&d.components["market-canvas"];if(c)c.reset();});}});

AFRAME.registerComponent("market-persist",{
  schema:{seconds:{type:"number",default:15},world:{type:"selector"}},
  init:function(){
    this.world=this.data.world;this.tracking=false;this.holding=false;this.timer=null;this.holdStart=0;
    this.lastMatrix=new THREE.Matrix4();this.basePos=new THREE.Vector3();this.baseQuat=new THREE.Quaternion();this.baseScale=new THREE.Vector3(1,1,1);
    this.poseHistory=[];this.maxPoseHistory=24;
    this.hits={peach:document.getElementById("holdPeach"),cabbage:document.getElementById("holdCabbage"),egg:document.getElementById("holdEgg"),reset:document.getElementById("holdReset")};
    this.localPoints={peach:new THREE.Vector3(-.38,.35,.10),cabbage:new THREE.Vector3(0,.38,.10),egg:new THREE.Vector3(.38,.35,.10),reset:new THREE.Vector3(0,-.62,.14)};
    this.localSizes={peach:[.58,.58],cabbage:[.58,.58],egg:[.58,.58],reset:[.74,.30]};
    const comp=()=>document.getElementById("marketDisplay")?.components?.["market-canvas"];
    this.hits.peach.addEventListener("click",()=>comp()?.pick("peach"));
    this.hits.cabbage.addEventListener("click",()=>comp()?.pick("cabbage"));
    this.hits.egg.addEventListener("click",()=>comp()?.pick("egg"));
    this.hits.reset.addEventListener("click",()=>comp()?.reset());
    if(this.world)this.world.object3D.visible=false;

    this.el.addEventListener("targetFound",()=>{this.tracking=true;this.holding=false;this.poseHistory=[];this.hideHoldHits();if(this.timer){clearTimeout(this.timer);this.timer=null;}if(this.world)this.world.object3D.visible=true;});
    this.el.addEventListener("targetLost",()=>{
      this.tracking=false;this.holding=true;this.holdStart=performance.now();
      if(this.world){
        const obj=this.world.object3D;let stable=null,now=performance.now();
        for(let i=this.poseHistory.length-1;i>=0;i--){if(now-this.poseHistory[i].time>=280){stable=this.poseHistory[i];break;}}
        if(!stable&&this.poseHistory.length)stable=this.poseHistory[0];
        if(stable){this.basePos.copy(stable.pos);this.baseQuat.copy(stable.quat);this.baseScale.copy(stable.scale);obj.position.copy(this.basePos);obj.quaternion.copy(this.baseQuat);obj.scale.copy(this.baseScale);obj.updateMatrixWorld(true);}
        else{this.basePos.copy(obj.position);this.baseQuat.copy(obj.quaternion);this.baseScale.copy(obj.scale);}
        obj.visible=true;
      }
      this.updateHoldHits();this.showHoldHits();
      if(this.timer)clearTimeout(this.timer);
      this.timer=setTimeout(()=>{if(this.world)this.world.object3D.visible=false;this.holding=false;this.hideHoldHits();this.timer=null;},this.data.seconds*1000);
    });
  },
  getCamera:function(){if(!this.camera){const e=document.querySelector("a-camera");this.camera=e&&e.getObject3D("camera");}return this.camera;},
  projectWorld:function(v){const cam=this.getCamera();if(!cam)return null;const p=v.clone().project(cam);return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight};},
  updateHoldHits:function(){
    if(!this.world)return;const obj=this.world.object3D;obj.updateMatrixWorld(true);
    const cw=new THREE.Vector3(0,0,0).applyMatrix4(obj.matrixWorld),rw=new THREE.Vector3(.5,0,0).applyMatrix4(obj.matrixWorld),uw=new THREE.Vector3(0,.5,0).applyMatrix4(obj.matrixWorld);
    const c=this.projectWorld(cw),r=this.projectWorld(rw),u=this.projectWorld(uw);if(!c||!r||!u)return;
    const px=Math.max(1,Math.abs(r.x-c.x)*2),py=Math.max(1,Math.abs(u.y-c.y)*2);
    Object.entries(this.localPoints).forEach(([k,l])=>{const s=this.projectWorld(l.clone().applyMatrix4(obj.matrixWorld));if(!s)return;const [wu,hu]=this.localSizes[k],bw=Math.max(k==="reset"?80:54,wu*px),bh=Math.max(k==="reset"?42:54,hu*py),b=this.hits[k];b.style.left=(s.x-bw/2)+"px";b.style.top=(s.y-bh/2)+"px";b.style.width=bw+"px";b.style.height=bh+"px";});
  },
  showHoldHits:function(){Object.values(this.hits).forEach(b=>b.style.display="block");},
  hideHoldHits:function(){Object.values(this.hits).forEach(b=>b.style.display="none");},
  tick:function(){
    if(!this.world)return;const obj=this.world.object3D;
    if(this.tracking){
      this.el.object3D.updateMatrixWorld(true);this.lastMatrix.copy(this.el.object3D.matrixWorld);
      const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();this.lastMatrix.decompose(p,q,s);
      this.poseHistory.push({pos:p.clone(),quat:q.clone(),scale:s.clone(),time:performance.now()});if(this.poseHistory.length>this.maxPoseHistory)this.poseHistory.shift();
      obj.position.copy(p);obj.quaternion.copy(q);obj.scale.copy(s);obj.updateMatrixWorld(true);return;
    }
    if(this.holding){
      const t=(performance.now()-this.holdStart)/1000,bob=Math.sin(t*1.45)*.022,sway=Math.sin(t*1.05)*.014,roll=Math.sin(t*1.18)*THREE.MathUtils.degToRad(1.4);
      obj.position.copy(this.basePos);obj.position.x+=sway;obj.position.y+=bob;
      const qr=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),roll);obj.quaternion.copy(this.baseQuat).multiply(qr);obj.scale.copy(this.baseScale);obj.updateMatrixWorld(true);this.updateHoldHits();
    }
  }
});
</script></head><body>
<div id="hint">选择一个城市场景吧！</div>
<div id="holdHitLayer">
<button id="holdPeach" class="hold-hit"></button><button id="holdCabbage" class="hold-hit"></button><button id="holdEgg" class="hold-hit"></button><button id="holdReset" class="hold-hit"></button>
</div>
<canvas id="buildingCanvas" class="off" width="768" height="512"></canvas>
<canvas id="parkCanvas" class="off" width="768" height="512"></canvas>
<canvas id="marketCanvas" class="off" width="768" height="512"></canvas>

<a-scene mindar-image="imageTargetSrc: ./targets/city_world.mind; autoStart: true; maxTrack: 3;" color-space="sRGB" renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false" cursor="fuse:false; rayOrigin:mouse" raycaster="objects:.clickable; far:10000"></a-camera>

<a-entity mindar-image-target="targetIndex:0" building-events><a-plane width="1.15" height="1.73" position="0 0.03 0.03" material="shader:flat;src:#buildingCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double" building-canvas></a-plane></a-entity>
<a-entity mindar-image-target="targetIndex:1" park-events><a-plane width="1.75" height="1.17" position="0 0.03 0.03" material="shader:flat;src:#parkCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double" park-canvas></a-plane></a-entity>

<!-- Market target only tracks pose -->
<a-entity mindar-image-target="targetIndex:2" market-events market-persist="seconds:15; world:#marketWorld"></a-entity>

<!-- Actual visible/clickable Market UI lives outside MindAR target -->
<a-entity id="marketWorld" visible="false">
<a-plane id="marketDisplay" width="2.15" height="1.43" position="0 0.03 0.02" material="shader:flat;src:#marketCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double" market-canvas></a-plane>
<a-plane class="clickable" pick-item="kind:peach" position="-0.38 0.35 0.10" width="0.58" height="0.58" material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"></a-plane>
<a-plane class="clickable" pick-item="kind:cabbage" position="0 0.38 0.10" width="0.58" height="0.58" material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"></a-plane>
<a-plane class="clickable" pick-item="kind:egg" position="0.38 0.35 0.10" width="0.58" height="0.58" material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"></a-plane>
<a-plane class="clickable" reset-market position="0 -0.62 0.14" width="0.74" height="0.30" material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"></a-plane>
</a-entity>
</a-scene>
</body></html>
