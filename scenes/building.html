<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Building · City World</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:system-ui}
video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}
canvas.a-canvas{background:transparent!important}
#hint{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;max-width:88vw;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font:700 14px/1.4 system-ui;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.16)}
#modeSwitch{position:fixed;right:18px;top:18px;z-index:90;display:none;gap:7px;padding:6px;border-radius:999px;background:rgba(255,255,255,.90);box-shadow:0 5px 18px rgba(0,0,0,.16)}
#modeSwitch button{border:0;border-radius:999px;padding:9px 13px;background:transparent;color:#555;font:800 12px/1 system-ui;cursor:pointer}
#modeSwitch button.active{background:rgba(255,240,180,.96);color:#4e6537}
#cameraOrientationControl{position:fixed;left:18px;top:18px;z-index:90;display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.90);color:#444;box-shadow:0 5px 18px rgba(0,0,0,.16);font:800 11px/1 system-ui}
#cameraOrientationControl select{border:0;outline:0;border-radius:999px;padding:5px 8px;background:rgba(255,240,180,.92);color:#333;font:800 12px system-ui}
.city-hit{position:fixed;display:none;z-index:60;border:0;background:transparent;pointer-events:auto;cursor:pointer}
.mindar-ui-scanning,.mindar-ui-scanning .scanning,.mindar-ui-scanning .scanning-line,.mindar-ui-scanning .inner,.mindar-ui-scanning .scanline{display:none!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important}
</style>
<script>
AFRAME.registerComponent("building-city-controller",{
  init(){
    this.world=document.getElementById("cityWorld");
    this.building=document.getElementById("cityBuilding");
    this.park=document.getElementById("cityPark");
    this.market=document.getElementById("cityMarket");
    this.hitPark=document.getElementById("hitPark");
    this.hitMarket=document.getElementById("hitMarket");
    this.tracking=false;
    this.mode="story";
    this.lastMatrix=new THREE.Matrix4();
    this.basePos=new THREE.Vector3();
    this.baseScale=new THREE.Vector3(1,1,1);

    if(this.world)this.world.object3D.visible=false;

    this.el.addEventListener("targetFound",()=>{
      this.tracking=true;
      if(this.world)this.world.object3D.visible=true;
      document.getElementById("modeSwitch").style.display="flex";
      this.enterStory();
    });

    this.el.addEventListener("targetLost",()=>{
      this.tracking=false;

      // Freeze the last pose captured while tracking. Do not sample the
      // targetLost frame itself because it can be skewed while the card exits.
      if(this.world){
        // Keep whichever narrative layout is currently active (FAR or WALK-IN).
        this.world.object3D.visible=true;
        this.world.object3D.updateMatrixWorld(true);
      }

      this.refreshHits();
    });
  },

  clearAnimations(el){
    ["animation__pos","animation__scale","animation__opacity"].forEach(a=>el?.removeAttribute(a));
  },

  setPanel(el,pos,scale,opacity=1){
    if(!el)return;
    this.clearAnimations(el);
    el.object3D.visible=opacity>0;
    el.setAttribute("position",pos);
    el.setAttribute("scale",scale);
    el.setAttribute("material","opacity",opacity);
  },

  animatePanel(el,pos,scale,opacity=1){
    if(!el)return;
    this.clearAnimations(el);
    el.object3D.visible=true;
    el.setAttribute("animation__pos",`property:position;to:${pos};dur:650;easing:easeInOutCubic`);
    el.setAttribute("animation__scale",`property:scale;to:${scale};dur:650;easing:easeInOutCubic`);
    el.setAttribute("animation__opacity",`property:material.opacity;to:${opacity};dur:420;easing:easeInOutCubic`);
    if(opacity===0)setTimeout(()=>{el.object3D.visible=false},470);
  },

  enterStory(){
    this.mode="story";
    if(this.world){
      this.world.removeAttribute("animation__walkpos");
      this.world.removeAttribute("animation__walkscale");
    }
    document.getElementById("storyModeBtn").classList.add("active");
    document.getElementById("interactModeBtn").classList.remove("active");

    // FAR / STORY: City is a small distant composition in the upper-left.
    // There is deliberately NO Park/Market interaction in this state.
    this.setPanel(this.building,"0 0.34 0.02","1 1 1",1);
    this.setPanel(this.park,"-0.72 -0.42 0.03",".78 .78 .78",1);
    this.setPanel(this.market,"0.72 -0.42 0.03",".78 .78 .78",1);

    this.world.setAttribute("position","-0.92 0.62 -1.85");
    this.world.setAttribute("scale",".44 .44 .44");

    this.hideHits();
    document.getElementById("hint").textContent="CITY · 🌆 远处 · 用玩偶讲故事";
  },

  enterInteract(){
    this.mode="interact";
    document.getElementById("storyModeBtn").classList.remove("active");
    document.getElementById("interactModeBtn").classList.add("active");

    // WALK IN: pull the entire City from the small upper-left story view
    // toward the viewer and center it before enabling Park/Market clicks.
    this.setPanel(this.building,"0 0.34 0.02","1 1 1",1);
    this.setPanel(this.park,"-0.72 -0.42 0.03",".78 .78 .78",1);
    this.setPanel(this.market,"0.72 -0.42 0.03",".78 .78 .78",1);

    this.world.removeAttribute("animation__walkpos");
    this.world.removeAttribute("animation__walkscale");
    this.world.setAttribute("animation__walkpos","property:position;to:0 0 0.02;dur:760;easing:easeInOutCubic");
    this.world.setAttribute("animation__walkscale","property:scale;to:1 1 1;dur:760;easing:easeInOutCubic");

    this.hideHits();
    setTimeout(()=>{
      if(this.mode!=="interact")return;
      this.showHits();
      this.refreshHits();
    },780);

    document.getElementById("hint").textContent="CITY · 🚶 走进城市…";
    setTimeout(()=>{
      if(this.mode==="interact")document.getElementById("hint").textContent="CITY · 点击 PARK 或 MARKET";
    },780);
  },

  focusPark(){
    if(this.mode!=="interact")return;
    this.animatePanel(this.park,"0 0.08 0.03","1.95 1.95 1.95",1);
    this.animatePanel(this.building,"0 0.38 0.01",".8 .8 .8",0);
    this.animatePanel(this.market,"0.72 -0.42 0.01",".7 .7 .7",0);
    this.hideHits();
    document.getElementById("hint").textContent="PARK 已放大";
  },

  focusMarket(){
    if(this.mode!=="interact")return;
    [this.market,this.park,this.building].forEach(el=>{if(el){this.clearAnimations(el);el.object3D.visible=true}});
    this.animatePanel(this.market,"0 0 0.03","1.28 1.28 1.28",1);
    this.animatePanel(this.building,"0 0.38 0.01",".8 .8 .8",0);
    this.animatePanel(this.park,"-0.72 -0.42 0.01",".7 .7 .7",0);
    this.hideHits();
    document.getElementById("hint").textContent="MARKET 已放大";
  },

  showHits(){this.hitPark.style.display="block";this.hitMarket.style.display="block"},
  hideHits(){this.hitPark.style.display="none";this.hitMarket.style.display="none"},

  project(v){
    const cam=document.querySelector("a-camera")?.getObject3D("camera");
    if(!cam)return null;
    const p=v.clone().project(cam);
    return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight};
  },

  positionHit(el,image){
    if(!el||!image||!image.object3D.visible)return;
    image.object3D.updateMatrixWorld(true);
    const m=image.object3D.matrixWorld;
    const c=this.project(new THREE.Vector3(0,0,0).applyMatrix4(m));
    const r=this.project(new THREE.Vector3(.5,0,0).applyMatrix4(m));
    const u=this.project(new THREE.Vector3(0,.5,0).applyMatrix4(m));
    if(!c||!r||!u)return;
    const w=Math.max(80,Math.abs(r.x-c.x)*2*1.55);
    const h=Math.max(70,Math.abs(u.y-c.y)*2*1.04);
    el.style.left=(c.x-w/2)+"px";el.style.top=(c.y-h/2)+"px";el.style.width=w+"px";el.style.height=h+"px";
  },

  refreshHits(){
    if(this.mode!=="interact")return;
    this.positionHit(this.hitPark,this.park);
    this.positionHit(this.hitMarket,this.market);
  },

  tick(){
    if(!this.world)return;

    // While the Building card is visible, continuously copy the tracked target
    // pose to cityWorld. This is what makes the City visible DURING recognition.
    if(this.tracking){
      this.el.object3D.updateMatrixWorld(true);
      this.lastMatrix.copy(this.el.object3D.matrixWorld);

      const p=new THREE.Vector3();
      const q=new THREE.Quaternion();
      const s=new THREE.Vector3();
      this.lastMatrix.decompose(p,q,s);

      this.basePos.copy(p);
      this.baseScale.copy(s);

      // cityWorld uses the designed FAR / WALK-IN screen layout.
      // Recognition keeps the world visible and saves pose data, but does not
      // overwrite the narrative layout transform every frame.
      this.world.object3D.visible=true;
    }

    // Only hit projection is throttled; no MediaPipe exists in this page.
    if(this.mode==="interact"){
      const now=performance.now();
      if(!this._lastHit||now-this._lastHit>=100){
        this._lastHit=now;
        this.refreshHits();
      }
    }
  }
});
</script>
</head>
<body>
<div id="cameraOrientationControl"><span>📷 CAMERA</span><select id="cameraOrientationSelect"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div>
<div id="modeSwitch"><button id="storyModeBtn" class="active">🌆 远处</button><button id="interactModeBtn">🚶 走进</button></div>
<div id="hint">请把镜头对准 Building 识别图 · 首次识别后默认「远处」</div>
<button id="hitPark" class="city-hit" aria-label="Park"></button>
<button id="hitMarket" class="city-hit" aria-label="Market"></button>

<a-scene mindar-image="imageTargetSrc: ../targets/building.mind; autoStart: true; maxTrack: 1;"
 color-space="sRGB" renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true;antialias:true"
 vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
 <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
 <a-entity mindar-image-target="targetIndex:0" building-city-controller></a-entity>

 <a-entity id="cityWorld" visible="false">
   <a-image id="cityBuilding" src="../assets/city/building_scene.png" width="1.25" height="1.88" position="0 0.34 0.02" material="transparent:true;opacity:1;depthWrite:false"></a-image>
   <a-image id="cityPark" src="../assets/city/park_scene.png" width="1.55" height="1.04" position="-0.72 -0.42 0.03" scale=".78 .78 .78" material="transparent:true;opacity:1;depthWrite:false"></a-image>
   <a-image id="cityMarket" src="../assets/city/market_scene.png" width="1.55" height="1.04" position="0.72 -0.42 0.03" scale=".78 .78 .78" material="transparent:true;opacity:1;depthWrite:false"></a-image>
 </a-entity>
</a-scene>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const target=document.querySelector('[building-city-controller]');
  const getComp=()=>target?.components?.["building-city-controller"];

  document.getElementById("storyModeBtn").onclick=()=>getComp()?.enterStory();
  document.getElementById("interactModeBtn").onclick=()=>getComp()?.enterInteract();
  document.getElementById("hitPark").onclick=()=>getComp()?.focusPark();
  document.getElementById("hitMarket").onclick=()=>getComp()?.focusMarket();

  const select=document.getElementById("cameraOrientationSelect");
  let angle=Number(localStorage.getItem("buildingCameraAngle")||0);
  select.value=String(angle);
  const apply=()=>{
    const v=document.querySelector("video");
    if(!v){setTimeout(apply,120);return}
    v.style.transformOrigin="50% 50%";
    v.style.transform=`rotate(${angle}deg)`;
    if(angle===90||angle===270){
      const sc=Math.max(innerWidth/innerHeight,innerHeight/innerWidth);
      v.style.transform=`rotate(${angle}deg) scale(${sc})`;
    }
  };
  select.onchange=()=>{angle=Number(select.value)||0;localStorage.setItem("buildingCameraAngle",String(angle));apply()};
  apply();
});
</script>
</body>
</html>
