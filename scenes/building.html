<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Building · City Story</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:system-ui}
video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}
canvas.a-canvas{background:transparent!important}
#storyCityMini{position:fixed;left:5vw;top:10vh;width:min(27vw,330px);height:min(34vh,280px);z-index:45;pointer-events:none;opacity:0;transform:scale(.86);transform-origin:left top;transition:left .65s ease,top .65s ease,width .65s ease,height .65s ease,opacity .3s ease,transform .65s ease}
#storyCityMini.show{opacity:1;transform:scale(1)}
#storyCityMini.near{
  left:50%;
  top:50%;
  width:min(82vw,900px);
  height:min(82vh,700px);
  transform:translate(-50%,-50%) scale(1);
  transform-origin:center center;
}
#storyCityMini.to-center{left:50%;top:50%;transform:translate(-50%,-50%) scale(2.1);opacity:0;transition:left .76s,top .76s,transform .76s,opacity .68s}
#storyCityMini img{position:absolute;object-fit:contain;filter:drop-shadow(0 5px 9px rgba(0,0,0,.18))}
#storyCityMini .mini-building{width:42%;height:72%;left:29%;top:0}
#storyCityMini .mini-park{width:48%;height:40%;left:0;bottom:0}
#storyCityMini .mini-market{width:48%;height:40%;right:0;bottom:0}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.92);font:700 14px system-ui;box-shadow:0 6px 24px rgba(0,0,0,.16)}
#modeSwitch{
  position:fixed;right:18px;top:18px;z-index:90;display:none;gap:7px;padding:6px;
  border-radius:999px;background:rgba(255,255,255,.90);box-shadow:0 5px 18px rgba(0,0,0,.16)
}
#modeSwitch button{
  border:0;border-radius:999px;padding:9px 13px;background:transparent;color:#555;
  font:800 12px/1 system-ui;cursor:pointer
}
#modeSwitch button.active{background:rgba(255,240,180,.96);color:#4e6537}
#cameraOrientationControl{position:fixed;left:18px;top:18px;z-index:90;display:flex;gap:7px;align-items:center;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.9);font:800 11px system-ui}
#cameraOrientationControl select{border:0;border-radius:999px;padding:5px 8px;background:rgba(255,240,180,.92);font:800 12px system-ui}
.mindar-ui-scanning,.mindar-ui-scanning .scanning,.mindar-ui-scanning .scanning-line,.mindar-ui-scanning .inner,.mindar-ui-scanning .scanline{display:none!important;opacity:0!important;visibility:hidden!important}
</style>
<script>
window.cityAssetsReady=Promise.all([
  "../assets/city/building_scene.png","../assets/city/park_scene.png","../assets/city/market_scene.png"
].map(src=>new Promise(resolve=>{
  const i=new Image();i.onload=()=>resolve();i.onerror=()=>resolve();i.src=src;
})));

AFRAME.registerComponent("standalone-city",{
  init(){
    this.world=document.getElementById("cityWorld");
    this.building=document.getElementById("cityBuilding");
    this.park=document.getElementById("cityPark");
    this.market=document.getElementById("cityMarket");
    this.lastMatrix=new THREE.Matrix4();
    this.mode="far";
    this.tracking=false;
    this.world.object3D.visible=false;

    this.el.addEventListener("targetFound",()=>{
      this.tracking=true;
      this.el.object3D.updateMatrixWorld(true);
      this.lastMatrix.copy(this.el.object3D.matrixWorld);
      document.getElementById("modeSwitch").style.display="flex";
      document.getElementById("hint").textContent="CITY WORLD · 正在加载场景…";
      window.cityAssetsReady.then(()=>this.enterFar());
    });
    this.el.addEventListener("targetLost",()=>{this.tracking=false});
  },

  enterFar(){
    this.mode="far";
    this.world.object3D.visible=false;

    const mini=document.getElementById("storyCityMini");
    mini.hidden=false;
    mini.style.display="block";
    mini.style.opacity="";
    mini.classList.add("show");
    mini.classList.remove("near");

    document.getElementById("farBtn")?.classList.add("active");
    document.getElementById("nearBtn")?.classList.remove("active");
    document.getElementById("hint").textContent="CITY · 🌆 远景 · 用玩偶讲故事";
  },

  enterNear(){
    this.mode="near";
    this.world.object3D.visible=false;

    const mini=document.getElementById("storyCityMini");
    mini.hidden=false;
    mini.style.display="block";
    mini.style.opacity="";
    mini.classList.add("show");
    requestAnimationFrame(()=>mini.classList.add("near"));

    document.getElementById("farBtn")?.classList.remove("active");
    document.getElementById("nearBtn")?.classList.add("active");
    document.getElementById("hint").textContent="CITY · 🔎 近景 · 城市来到眼前";
  },

  tick(){
    if(this.tracking){
      this.el.object3D.updateMatrixWorld(true);
      this.lastMatrix.copy(this.el.object3D.matrixWorld);
    }
  }
});
</script>
</head>
<body>
<div id="storyCityMini" hidden style="display:none;opacity:0">
 <img class="mini-building" src="../assets/city/building_scene.png">
 <img class="mini-park" src="../assets/city/park_scene.png">
 <img class="mini-market" src="../assets/city/market_scene.png">
</div>
<div id="cameraOrientationControl"><span>📷 CAMERA</span><select id="cameraOrientationSelect"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div>
<div id="modeSwitch">
  <button id="farBtn" class="active">🌆 远景</button>
  <button id="nearBtn">🔎 近景</button>
</div>
<div id="hint">请把镜头对准 Building 识别图</div>

<a-scene mindar-image="imageTargetSrc: ../targets/building.mind;autoStart:true;maxTrack:1;" color-space="sRGB" renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true;antialias:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
 <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
 <a-entity mindar-image-target="targetIndex:0" standalone-city></a-entity>
 <a-entity id="cityWorld" visible="false">
  <a-image id="cityBuilding" src="../assets/city/building_scene.png" width="1.25" height="1.88" position="0 0.34 0.02" material="transparent:true;opacity:1;depthWrite:false"></a-image>
  <a-image id="cityPark" src="../assets/city/park_scene.png" width="1.55" height="1.04" position="-0.72 -0.42 0.03" scale=".78 .78 .78" material="transparent:true;opacity:1;depthWrite:false"></a-image>
  <a-image id="cityMarket" src="../assets/city/market_scene.png" width="1.55" height="1.04" position="0.72 -0.42 0.03" scale=".78 .78 .78" material="transparent:true;opacity:1;depthWrite:false"></a-image>
 </a-entity>
</a-scene>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const t=document.querySelector("[standalone-city]");
 const c=()=>t?.components?.["standalone-city"];
 document.getElementById("farBtn")?.addEventListener("click",()=>c()?.enterFar());
 document.getElementById("nearBtn")?.addEventListener("click",()=>c()?.enterNear());

 const sel=document.getElementById("cameraOrientationSelect");let a=Number(localStorage.getItem("buildingCameraAngle")||0);sel.value=String(a);
 const apply=()=>{const v=document.querySelector("video");if(!v){setTimeout(apply,120);return}v.style.transformOrigin="50% 50%";v.style.transform=`rotate(${a}deg)`;if(a===90||a===270){const sc=Math.max(innerWidth/innerHeight,innerHeight/innerWidth);v.style.transform=`rotate(${a}deg) scale(${sc})`}};
 sel.onchange=()=>{a=Number(sel.value)||0;localStorage.setItem("buildingCameraAngle",String(a));apply()};apply();
});
</script>
</body></html>
