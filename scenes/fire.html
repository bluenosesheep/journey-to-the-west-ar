<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAGIC 02 · 三昧真火</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent!important;
}
video{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
  object-fit:cover!important;
  z-index:0!important;
}
a-scene{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
  z-index:1!important;
  background:transparent!important;
}
canvas.a-canvas{
  background:transparent!important;
}
#hint{
  position:fixed;
  left:50%;
  bottom:max(20px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:20;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.92);
  color:#222;
  font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  white-space:nowrap;
  box-shadow:0 6px 24px rgba(0,0,0,.16);
}
#fxCanvas{
  display:none;
}
</style>

<script>
AFRAME.registerComponent("story-target-events",{
  init:function(){
    const hint=document.getElementById("hint");
    this.el.addEventListener("targetFound",()=>{
      hint.textContent="三昧真火出现啦！看看发生了什么 🔥";
    });
    this.el.addEventListener("targetLost",()=>{
      hint.textContent="请把镜头对准「三昧真火」故事卡";
    });
  }
});

AFRAME.registerComponent("canvas-texture-updater",{
  init:function(){
    this.canvas=document.getElementById("fxCanvas");
    this.ctx=this.canvas.getContext("2d");
    this.images={};
    this.loaded=0;
    this.startTime=performance.now();

    const sources={
      fire:"../assets/fire/fire_main.png",
      sparks:"../assets/fire/fire_sparks.png",
      smoke:"../assets/fire/smoke.png",
      heat:"../assets/fire/heat_wave.png"
    };

    Object.entries(sources).forEach(([key,src])=>{
      const img=new Image();
      img.crossOrigin="anonymous";
      img.onload=()=>{
        this.images[key]=img;
        this.loaded++;
      };
      img.src=src;
    });
  },

  tick:function(){
    if(this.loaded<4)return;

    const c=this.canvas;
    const ctx=this.ctx;
    const w=c.width;
    const h=c.height;
    const t=(performance.now()-this.startTime)/1000;

    ctx.clearRect(0,0,w,h);

    const drawCentered=(img,cx,cy,width,height,rotation=0,alpha=1)=>{
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.translate(cx,cy);
      ctx.rotate(rotation);
      ctx.drawImage(img,-width/2,-height/2,width,height);
      ctx.restore();
    };

    // Heat wave
    const heatScale=0.94+0.10*(0.5+0.5*Math.sin(t*1.6));
    const heatRot=4*Math.sin(t*0.9)*Math.PI/180;
    drawCentered(
      this.images.heat,
      w*0.50,
      h*0.61,
      w*0.78*heatScale,
      h*0.48*heatScale,
      heatRot,
      0.58
    );

    // Smoke
    const smokeX=w*(0.50+0.035*Math.sin(t*1.2));
    const smokeY=h*(0.42-0.035*Math.sin(t*1.0));
    const smokeScale=0.92+0.10*(0.5+0.5*Math.sin(t*1.4));
    drawCentered(
      this.images.smoke,
      smokeX,
      smokeY,
      w*0.62*smokeScale,
      h*0.42*smokeScale,
      2.5*Math.sin(t*1.1)*Math.PI/180,
      0.48
    );

    // Main fire
    const fireY=h*(0.54-0.06*Math.sin(t*2.2));
    const fireScale=0.88+0.18*(0.5+0.5*Math.sin(t*2.6));
    const fireRot=3.5*Math.sin(t*1.8)*Math.PI/180;
    drawCentered(
      this.images.fire,
      w*0.47,
      fireY,
      w*0.52*fireScale,
      h*0.42*fireScale,
      fireRot,
      1.0
    );

    // Sparse sparks
    const sparkY=h*(0.42-0.08*Math.sin(t*1.7));
    const sparkScale=0.88+0.22*(0.5+0.5*Math.sin(t*4.0));
    const sparkAlpha=0.55+0.40*(0.5+0.5*Math.sin(t*5.2));
    drawCentered(
      this.images.sparks,
      w*0.53,
      sparkY,
      w*0.66*sparkScale,
      h*0.44*sparkScale,
      0,
      sparkAlpha
    );

    const mesh=this.el.getObject3D("mesh");
    if(mesh && mesh.material && mesh.material.map){
      mesh.material.map.needsUpdate=true;
    }
  }
});
</script>
</head>

<body>
<div id="hint">请把镜头对准「三昧真火」故事卡</div>
<canvas id="fxCanvas" width="1024" height="1024"></canvas>

<a-scene
  mindar-image="imageTargetSrc: ../targets/fire.mind; autoStart: true;"
  color-space="sRGB"
  renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex:0" story-target-events>
    <a-plane
      width="1.65"
      height="1.65"
      position="0 0 0.03"
      material="shader:flat; src:#fxCanvas; transparent:true; alphaTest:0.01; depthWrite:false; side:double"
      canvas-texture-updater>
    </a-plane>
  </a-entity>
</a-scene>
</body>
</html>
