<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spider Story Interactive · Standalone</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="../../js/input-router.js"></script>

<link rel="stylesheet" href="./spider-style.css">

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:system-ui,sans-serif}
video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important;transform:scaleX(-1);transform-origin:50% 50%}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}
canvas.a-canvas{background:transparent!important;transform:scaleX(-1)!important;transform-origin:50% 50%!important}
.off{display:none!important}
#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;max-width:88vw;padding:11px 17px;border-radius:999px;background:rgba(255,255,255,.94);color:#27322b;text-align:center;font:700 15px/1.35 system-ui;box-shadow:0 6px 22px rgba(0,0,0,.16)}
.mindar-ui-scanning,.mindar-ui-scanning .scanning,.mindar-ui-scanning .scanning-line,.mindar-ui-scanning .inner,.mindar-ui-scanning .scanline{display:none!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important}
#handCursor.pinching{width:80px;height:80px;margin:-40px 0 0 -40px;background:rgba(255,238,165,.96)}

/* Standalone explicit UI */
#spiderFightBtn{z-index:160!important}
#spiderRetryBtn,#spiderLeaveBtn,#spiderProgress{z-index:160!important}
#handBtn{
  position:fixed;right:18px;top:18px;z-index:160;display:none;border:0;border-radius:999px;
  padding:10px 14px;background:rgba(255,248,220,.96);color:#56713b;
  font:800 13px/1 system-ui;box-shadow:0 5px 18px rgba(0,0,0,.16);cursor:pointer
}
#handStatus{
  position:fixed;right:18px;top:62px;z-index:160;display:none;padding:8px 12px;border-radius:999px;
  background:rgba(255,255,255,.90);color:#333;font:700 12px/1.2 system-ui;
  box-shadow:0 4px 16px rgba(0,0,0,.16)
}
#handCursor{
  position:fixed;z-index:170;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;
  display:none;place-items:center;pointer-events:none;font-size:34px;background:rgba(255,255,255,.90);
  box-shadow:0 6px 26px rgba(0,0,0,.26)
}

</style>

<script src="./spider-scene.js"></script>
<script type="module" src="../../js/hand-tracking-performance.js"></script>
</head>

<body>
<div id="hint">请把镜头对准 SPIDER 卡</div>

<!-- Spider UI is explicit in standalone so the Story button always exists. -->
<button id="spiderFightBtn" type="button">⚔️ 消灭它</button>
<button id="spiderRetryBtn" type="button">↻ 再试一次</button>
<button id="spiderLeaveBtn" type="button">✅ 离开</button>
<div id="spiderProgress">🕷️ 0 / 4</div>
<canvas id="spiderCanvas" class="off" width="768" height="512"></canvas>

<button id="handBtn" type="button">✨ INTERACT · OFF</button>
<div id="handStatus">手势：已关闭</div>
<div id="handCursor">✨</div>

<a-scene
  mindar-image="imageTargetSrc: ../../targets/spider.mind; autoStart: true; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true;antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
</a-scene>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const scene=document.querySelector("a-scene");
  const installSpider=()=>{
    SpiderSceneModule.install({
      integrated:false,
      targetIndex:0,
      assetBase:"../../assets/spider/",
      mirrorAR:true,
      mirrorHand:true,
      handFps:15,
      sleepMs:3000
    });
  };
  if(scene?.hasLoaded)installSpider();
  else scene?.addEventListener("loaded",installSpider,{once:true});
});
</script>
</body>
</html>
