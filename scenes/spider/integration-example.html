<!-- Spider module integration example for classroom_diy_story.html -->

<!-- in <head> -->
<link rel="stylesheet" href="./scenes/spider/spider-style.css">
<script src="./scenes/spider/spider-scene.js"></script>

<!-- Keep ONE shared <a-scene> using citywithmagic.mind.
     Do NOT manually add a separate Spider target/world if using install(). -->

<script>
document.addEventListener("DOMContentLoaded",()=>{
  SpiderSceneModule.install({
    integrated:true,
    targetIndex:7,
    assetBase:"./assets/spider/",
    mirrorAR:true,
    mirrorHand:true,
    handFps:15,
    sleepMs:3000,

    onActivate(){
      DIYSceneManager.activate("spider");
    },

    onLeave(){
      DIYSceneManager.leaveCurrent();
    }
  });
});
</script>
