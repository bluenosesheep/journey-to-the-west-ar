<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cloud Magic</title>
<style>
html,body{
  margin:0;width:100%;height:100%;
  background:#f4ecd9;color:#594a37;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
main{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  box-sizing:border-box;
}
.card{width:min(88vw,360px)}
.spinner{
  width:34px;height:34px;margin:0 auto 16px;
  border:3px solid rgba(89,74,55,.18);
  border-top-color:#8f2f2a;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
h1{font-size:20px;margin:0 0 8px}
p{font-size:14px;line-height:1.5;margin:0 0 18px;opacity:.78}
button{
  width:100%;
  border:0;
  border-radius:999px;
  padding:14px 20px;
  background:#8f2f2a;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  opacity:.45;
}
button.ready{opacity:1}
#status{font-size:12px;opacity:.62;margin-top:12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
  <div class="card">
    <div id="spinner" class="spinner"></div>
    <h1>筋斗云魔法</h1>
    <p>Cloud Magic</p>
    <button id="enterBtn" disabled>正在准备 AR…</button>
    <div id="status">正在加载识别数据…</div>
  </div>
</main>

<script>
(async()=>{
  const btn=document.getElementById("enterBtn");
  const status=document.getElementById("status");
  const spinner=document.getElementById("spinner");

  try{
    const res=await fetch("../targets/cloud.mind",{cache:"force-cache"});
    if(!res.ok) throw new Error("cloud.mind preload failed");
    await res.arrayBuffer();
    status.textContent="识别数据已准备好";
  }catch(e){
    console.warn(e);
    status.textContent="可以继续进入 AR";
  }

  // Keep the page here until the user taps START.
  // This gives mobile Safari/Chrome a fresh user gesture for camera startup.
  spinner.style.display="none";
  btn.disabled=false;
  btn.classList.add("ready");
  btn.textContent="开启 AR · START";

  btn.addEventListener("click",()=>{
    btn.disabled=true;
    btn.textContent="正在打开相机…";
    location.href="./cloud_ar.html";
  },{once:true});
})();
</script>
</body>
</html>
