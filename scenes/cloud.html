<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cloud Magic</title>
<link rel="preload" href="../targets/cloud.mind" as="fetch" crossorigin="anonymous">
<link rel="preload" href="../assets/cloud/cloud.png" as="image">
<link rel="preload" href="../assets/cloud/wind_01.png" as="image">
<link rel="preload" href="../assets/cloud/wind_02.png" as="image">
<link rel="preload" href="../assets/cloud/sparkles.png" as="image">
<style>
html,body{margin:0;width:100%;height:100%;background:#f4ecd9;color:#594a37;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.card{width:min(88vw,380px)}
.spinner{width:34px;height:34px;margin:0 auto 16px;border:3px solid rgba(89,74,55,.18);border-top-color:#8f2f2a;border-radius:50%;animation:spin .8s linear infinite}
h1{font-size:20px;margin:0 0 8px}p{font-size:14px;line-height:1.5;margin:0 0 18px;opacity:.78}
button{width:100%;border:0;border-radius:999px;padding:14px 20px;background:#8f2f2a;color:white;font-size:16px;font-weight:700;cursor:pointer;opacity:.42}
button.ready{opacity:1}button:disabled{cursor:default}
#status{margin-top:12px;font-size:12px;line-height:1.45;opacity:.68}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main><div class="card">
<div id="spinner" class="spinner"></div>
<h1>筋斗云魔法</h1>
<p>Cloud Magic</p>
<button id="enterBtn" disabled>AR 加载中…</button>
<div id="status">正在准备识别数据和动画素材…</div>
</div></main>
<script>
(async()=>{
  const btn=document.getElementById("enterBtn");
  const status=document.getElementById("status");
  const spinner=document.getElementById("spinner");

  const localResources=[
    "../targets/cloud.mind",
    "../assets/cloud/cloud.png",
    "../assets/cloud/wind_01.png",
    "../assets/cloud/wind_02.png",
    "../assets/cloud/sparkles.png"
  ];

  async function preloadFetch(url){
    const res=await fetch(url,{cache:"force-cache"});
    if(!res.ok) throw new Error(url+" failed: "+res.status);
    await res.arrayBuffer();
  }

  function preloadScript(url){
    return new Promise((resolve,reject)=>{
      const s=document.createElement("script");
      s.src=url;
      s.async=true;
      s.onload=resolve;
      s.onerror=()=>reject(new Error(url+" script load failed"));
      document.head.appendChild(s);
    });
  }

  try{
    status.textContent="正在下载 Cloud 识别数据和动画素材…";
    await Promise.all(localResources.map(preloadFetch));

    status.textContent="正在准备 AR 引擎…";
    await preloadScript("https://aframe.io/releases/1.5.0/aframe.min.js");
    await preloadScript("https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js");

    spinner.style.display="none";
    btn.disabled=false;
    btn.classList.add("ready");
    btn.textContent="开启 AR · START";
    status.textContent="AR 已准备好，可以开启摄像头";
  }catch(err){
    console.warn(err);
    spinner.style.display="none";
    btn.disabled=false;
    btn.classList.add("ready");
    btn.textContent="开启 AR · START";
    status.textContent="部分资源未预载完成，仍可继续";
  }

  btn.addEventListener("click",()=>{
    btn.disabled=true;
    btn.textContent="正在打开相机…";
    location.href="./cloud_ar.html";
  },{once:true});
})();
</script>
</body>
</html>
