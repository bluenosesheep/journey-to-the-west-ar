<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rain Magic AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

html,body{background:transparent!important}
video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}
canvas.a-canvas{background:transparent!important}
.off{display:none}
#hint{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;max-width:88vw;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font:14px/1.4 system-ui;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.16)}
</style>

<script>
function dc(ctx,img,cx,cy,w,h,r=0,a=1){ctx.save();ctx.globalAlpha=a;ctx.translate(cx,cy);ctx.rotate(r);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();}
AFRAME.registerComponent("rain-events",{init:function(){const h=document.getElementById("hint");this.el.addEventListener("targetFound",()=>h.textContent="MAGIC 03 · RAIN 🌧️");this.el.addEventListener("targetLost",()=>h.textContent="雨之魔法还会停留 10 秒 🌧️");}});
AFRAME.registerComponent("freeze-on-lost",{schema:{seconds:{type:"number",default:10},ghost:{type:"selector"}},init:function(){this.tracking=false;this.hideTimer=null;this.lastPos=new THREE.Vector3();this.lastQuat=new THREE.Quaternion();this.lastScale=new THREE.Vector3(1,1,1);this.sourcePlane=this.el.querySelector("a-plane");this.ghost=this.data.ghost;if(this.ghost)this.ghost.object3D.visible=false;this.el.addEventListener("targetFound",()=>{this.tracking=true;if(this.hideTimer){clearTimeout(this.hideTimer);this.hideTimer=null;}if(this.ghost)this.ghost.object3D.visible=false;});this.el.addEventListener("targetLost",()=>{this.tracking=false;if(!this.ghost||!this.sourcePlane)return;const src=this.sourcePlane.object3D;src.getWorldPosition(this.lastPos);src.getWorldQuaternion(this.lastQuat);src.getWorldScale(this.lastScale);const g=this.ghost.object3D;g.position.copy(this.lastPos);g.quaternion.copy(this.lastQuat);g.scale.copy(this.lastScale);g.visible=true;if(this.hideTimer)clearTimeout(this.hideTimer);this.hideTimer=setTimeout(()=>{g.visible=false;this.hideTimer=null;},this.data.seconds*1000);});},tick:function(){if(this.tracking&&this.sourcePlane){const src=this.sourcePlane.object3D;src.getWorldPosition(this.lastPos);src.getWorldQuaternion(this.lastQuat);src.getWorldScale(this.lastScale);}}});
window.addEventListener("DOMContentLoaded",()=>{
 const c=document.getElementById("rainCanvas"),ctx=c.getContext("2d");
 const sources={cloud:"../assets/rain/rain_cloud.png",drops:"../assets/rain/rain_drops.png",splash:"../assets/rain/rain_splash.png"};
 const images={};let loaded=0,loadingStarted=false,targetSeen=false,animationStarted=false,animStart=0;const total=3;
 function loadRainAssets(){if(loadingStarted)return;loadingStarted=true;Object.entries(sources).forEach(([k,src])=>{const img=new Image();img.onload=()=>{images[k]=img;loaded++;maybeStart();};img.src=src;});}
 function refresh(){["#rainTrackedPlane","#rainGhost"].forEach(sel=>{const el=document.querySelector(sel);const mesh=el&&el.getObject3D&&el.getObject3D("mesh");if(mesh&&mesh.material&&mesh.material.map)mesh.material.map.needsUpdate=true;});}
 function maybeStart(){if(targetSeen&&loaded===total&&!animationStarted){animationStarted=true;animStart=performance.now();render();}}
 function render(){if(!animationStarted)return;requestAnimationFrame(render);const w=c.width,h=c.height,t=(performance.now()-animStart)/1000;ctx.clearRect(0,0,w,h);
 const cloudCycle=2.4,cloudPhase=(t%cloudCycle)/cloudCycle,cloudWave=Math.sin(cloudPhase*Math.PI*2);
 const cloudY=h*.25+cloudWave*6,cloudX=w*.50+Math.sin(cloudPhase*Math.PI*2)*2;
 const rainCycle=.90,rainPhase=(t%rainCycle)/rainCycle,dropDrift=rainPhase*58,dropX=Math.sin(rainPhase*Math.PI*2)*1.2;
 const impactCenter=.84,impactWidth=.14,impact=Math.max(0,1-Math.abs(rainPhase-impactCenter)/impactWidth),splashPulse=.95+.10*impact,splashAlpha=.38+.58*impact;
 dc(ctx,images.drops,w*.50+dropX,h*.515+dropDrift,w*.88,h*.50,0,.76);dc(ctx,images.cloud,cloudX,cloudY,w*.70,h*.45,0,1);dc(ctx,images.splash,w*.50,h*.81,w*.86*splashPulse,h*.27*splashPulse,0,splashAlpha);refresh();}
 const scene=document.querySelector("a-scene"),target=document.querySelector("[mindar-image-target]");
 scene.addEventListener("arReady",()=>loadRainAssets());
 target.addEventListener("targetFound",()=>{targetSeen=true;maybeStart();});
});
</script>

</head><body>
<div id="hint">请把镜头对准 RAIN 卡</div>
<canvas id="rainCanvas" class="off" width="768" height="768"></canvas>
<a-scene mindar-image="imageTargetSrc: ../targets/rain.mind; autoStart: true;" color-space="sRGB" renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity mindar-image-target="targetIndex:0" rain-events freeze-on-lost="seconds:10; ghost:#rainGhost">
<a-plane id="rainTrackedPlane" width="2.1" height="2.1" position="0 0.03 0.03" material="shader:flat;src:#rainCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"></a-plane>
</a-entity>
<a-plane id="rainGhost" width="2.1" height="2.1" position="0 0 -999" visible="false" material="shader:flat;src:#rainCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"></a-plane>
</a-scene></body></html>
