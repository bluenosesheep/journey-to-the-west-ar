<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preparing Grow Magic</title>
<style>
html,body{
  margin:0;width:100%;height:100%;
  background:#f4ecd9;color:#594a37;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
main{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  box-sizing:border-box;
}
.card{max-width:360px}
.spinner{
  width:34px;height:34px;margin:0 auto 16px;
  border:3px solid rgba(89,74,55,.18);
  border-top-color:#8f2f2a;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
h1{font-size:20px;margin:0 0 8px}
p{font-size:14px;line-height:1.5;margin:0;opacity:.78}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="spinner"></div>
    <h1>正在准备仙藤魔法…</h1>
    <p>Preparing Grow Magic</p>
  </div>
</main>

<script>
(async()=>{
  const target="./../targets/grow.mind";

  try{
    // Warm the browser cache before entering the real AR page.
    const res=await fetch(target,{cache:"force-cache"});
    if(!res.ok) throw new Error("grow.mind preload failed");
    await res.arrayBuffer();
  }catch(e){
    // Do not trap the user on the launcher if preload fails.
    console.warn(e);
  }

  // replace() prevents Back from bouncing between launcher and AR page.
  location.replace("./grow_ar.html");
})();
</script>
</body>
</html>
