<script>
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

AFRAME.registerComponent("building-events",{
  init:function(){
    const h=document.getElementById("hint");
    this.el.addEventListener("targetFound",()=>h.textContent="CITY · 拖动建筑搭街区，轻点建筑可以点亮它 ✨");
    this.el.addEventListener("targetLost",()=>h.textContent="City 还会停留 15 秒，可以继续搭建 🏙️");
  }
});

AFRAME.registerComponent("building-canvas",{
  init:function(){
    this.c=document.getElementById("buildingCanvas");
    this.ctx=this.c.getContext("2d");

    this.initial={
      house:{x:215,y:120},
      tower:{x:330,y:120},
      school:{x:445,y:120},
      shop:{x:555,y:120}
    };

    this.items={
      house:{emoji:"🏠",x:215,y:120,scale:.82,lit:false},
      tower:{emoji:"🏢",x:330,y:120,scale:1.35,lit:false},
      school:{emoji:"🏫",x:445,y:120,scale:1.00,lit:false},
      shop:{emoji:"🏪",x:555,y:120,scale:.88,lit:false}
    };
  },

  setPosition:function(kind,x,y){
    const item=this.items[kind];
    if(!item)return;
    item.x=Math.max(90,Math.min(678,x));
    item.y=Math.max(80,Math.min(430,y));
  },

  toggleLight:function(kind){
    const item=this.items[kind];
    if(!item)return;
    item.lit=!item.lit;
    document.getElementById("hint").textContent=item.lit?"建筑点亮啦！✨":"灯关掉了";
  },

  reset:function(){
    Object.entries(this.initial).forEach(([k,p])=>{
      this.items[k].x=p.x;
      this.items[k].y=p.y;
      this.items[k].lit=false;
    });
    document.getElementById("hint").textContent="CITY · 拖动建筑搭街区，轻点建筑可以点亮它 ✨";
  },

  tick:function(){
    const now=performance.now();
    const active=!!window.BuildingDragController?.dragState;
    const frameMs=active?33:67;
    if(this._lastDraw&&now-this._lastDraw<frameMs)return;
    this._lastDraw=now;

    const ctx=this.ctx,c=this.c,w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h);
    ctx.textAlign="center";ctx.textBaseline="middle";

    // Clear street hierarchy: sidewalk above, roadway below.
    ctx.save();

    // Sidewalk strip
    ctx.fillStyle="rgba(232,222,198,.62)";
    roundRect(ctx,120,300,528,58,20);
    ctx.fill();

    // sidewalk edge / curb
    ctx.strokeStyle="rgba(165,145,115,.55)";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(135,355);
    ctx.lineTo(633,355);
    ctx.stroke();

    // Roadway placed distinctly below the sidewalk
    ctx.fillStyle="rgba(92,96,102,.48)";
    roundRect(ctx,105,365,558,88,24);
    ctx.fill();

    // center lane dashes
    ctx.strokeStyle="rgba(255,246,185,.82)";
    ctx.lineWidth=5;
    ctx.setLineDash([30,22]);
    ctx.beginPath();
    ctx.moveTo(135,410);
    ctx.lineTo(635,410);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw real street lamps with Canvas instead of the light-bulb emoji.
    function drawStreetLamp(x,y){
      ctx.save();

      // pole
      ctx.strokeStyle="rgba(72,76,78,.82)";
      ctx.lineWidth=5;
      ctx.lineCap="round";
      ctx.beginPath();
      ctx.moveTo(x,y+26);
      ctx.lineTo(x,y-18);
      ctx.stroke();

      // curved lamp arm
      ctx.beginPath();
      ctx.moveTo(x,y-18);
      ctx.quadraticCurveTo(x+2,y-34,x+18,y-34);
      ctx.stroke();

      // lamp shade
      ctx.fillStyle="rgba(70,74,76,.88)";
      ctx.beginPath();
      ctx.moveTo(x+10,y-35);
      ctx.lineTo(x+27,y-35);
      ctx.lineTo(x+23,y-26);
      ctx.lineTo(x+14,y-26);
      ctx.closePath();
      ctx.fill();

      // warm light
      ctx.fillStyle="rgba(255,221,112,.90)";
      ctx.beginPath();
      ctx.arc(x+18.5,y-25,5,0,Math.PI*2);
      ctx.fill();

      // base
      ctx.fillStyle="rgba(72,76,78,.82)";
      roundRect(ctx,x-8,y+24,16,5,2);
      ctx.fill();

      ctx.restore();
    }

    drawStreetLamp(155,326);
    drawStreetLamp(615,326);

    ctx.restore();

    // Night mode appears when at least one building is lit.
    const anyLit=Object.values(this.items).some(item=>item.lit);
    if(anyLit){
      ctx.save();

      // Irregular curved night-sky shape instead of a hard rectangle.
      ctx.fillStyle="rgba(8,14,28,.74)";
      ctx.beginPath();
      ctx.moveTo(72,72);
      ctx.bezierCurveTo(165,20,285,48,370,30);
      ctx.bezierCurveTo(470,8,620,42,696,104);
      ctx.bezierCurveTo(742,150,725,245,706,300);
      ctx.bezierCurveTo(688,348,718,405,662,448);
      ctx.bezierCurveTo(600,492,485,462,395,476);
      ctx.bezierCurveTo(300,492,175,470,110,432);
      ctx.bezierCurveTo(52,398,66,320,54,260);
      ctx.bezierCurveTo(42,194,24,116,72,72);
      ctx.closePath();
      ctx.fill();

      // A few tiny stars, kept subtle.
      ctx.fillStyle="rgba(255,242,180,.78)";
      [[150,110],[245,78],[505,92],[612,135],[565,205]].forEach(([sx,sy])=>{
        ctx.beginPath();
        ctx.arc(sx,sy,2.6,0,Math.PI*2);
        ctx.fill();
      });

      // Redraw road lightly on top so the city still reads at night.
      ctx.fillStyle="rgba(58,63,72,.60)";
      roundRect(ctx,105,365,558,88,24);
      ctx.fill();

      ctx.strokeStyle="rgba(255,233,140,.82)";
      ctx.lineWidth=5;
      ctx.setLineDash([30,22]);
      ctx.beginPath();
      ctx.moveTo(135,410);
      ctx.lineTo(635,410);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.restore();
    }

    // draw draggable buildings
    Object.entries(this.items).forEach(([kind,item])=>{
      ctx.save();
      ctx.translate(item.x,item.y);

      if(item.lit){
        // warm halo + little glowing windows, independent of platform emoji design
        const glow=ctx.createRadialGradient(0,0,10,0,0,62*(item.scale||1));
        glow.addColorStop(0,"rgba(255,220,92,.46)");
        glow.addColorStop(1,"rgba(255,220,92,0)");
        ctx.fillStyle=glow;
        ctx.beginPath();
        ctx.arc(0,0,66*(item.scale||1),0,Math.PI*2);
        ctx.fill();
      }

      ctx.scale(item.scale||1,item.scale||1);
      ctx.font='92px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(item.emoji,0,0);

      if(item.lit){
        // Do not paint fake windows on top of system emoji:
        // iPhone/Android/desktop building emoji have different window layouts.
        // Use a warm architectural glow instead, which stays aligned on every device.
        ctx.save();
        ctx.globalCompositeOperation="screen";

        const glow=ctx.createRadialGradient(0,8,8,0,8,56);
        glow.addColorStop(0,"rgba(255,218,92,.50)");
        glow.addColorStop(.55,"rgba(255,184,70,.22)");
        glow.addColorStop(1,"rgba(255,160,50,0)");
        ctx.fillStyle=glow;
        ctx.beginPath();
        ctx.arc(0,8,58,0,Math.PI*2);
        ctx.fill();

        // small pool of warm light at the base
        ctx.fillStyle="rgba(255,210,100,.20)";
        ctx.beginPath();
        ctx.ellipse(0,40,34,10,0,0,Math.PI*2);
        ctx.fill();

        ctx.restore();
      }

      ctx.restore();
    });

    // simple moving car for life
    const t=performance.now()/1000;
    const carX=150+((t*70)%470);
    ctx.save();
    ctx.globalAlpha=.88;
    ctx.font='34px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText("🚗",carX,414);
    ctx.restore();

    // RESET UI is provided by the DOM button #dragReset.

    const mesh=this.el.getObject3D("mesh");
    if(mesh&&mesh.material&&mesh.material.map)mesh.material.map.needsUpdate=true;
  }
});

AFRAME.registerComponent("building-drag-controller",{
  schema:{seconds:{type:"number",default:15},world:{type:"selector"}},

  init:function(){
    window.BuildingDragController=this;
    this.world=this.data.world;this.tracking=false;this.holding=false;this.timer=null;this.holdStart=0;
    this.lastMatrix=new THREE.Matrix4();this.basePos=new THREE.Vector3();this.baseQuat=new THREE.Quaternion();this.baseScale=new THREE.Vector3(1,1,1);
    this.poseHistory=[];this.maxPoseHistory=24;

    this.planeWidth=2.15;this.planeHeight=1.43;this.canvasW=768;this.canvasH=512;

    this.hits={
      house:document.getElementById("dragHouse"),
      tower:document.getElementById("dragTower"),
      school:document.getElementById("dragSchool"),
      shop:document.getElementById("dragShop"),
      reset:document.getElementById("dragReset")
    };

    this.dragState=null;

    this.hits.reset.textContent="再试一次";

    window.CityInput.register("building-standalone",{
      down:(input)=>this.handleDown(input),
      move:(input)=>this.handleMove(input),
      up:(input)=>this.handleUp(input),
      cancel:(input)=>this.handleUp(input)
    });

    if(this.world)this.world.object3D.visible=false;

    this.el.addEventListener("targetFound",()=>{
      this.tracking=true;this.holding=false;this.poseHistory=[];
      if(this.timer){clearTimeout(this.timer);this.timer=null;}
      if(this.world)this.world.object3D.visible=true;
      this.showHits();
    });

    this.el.addEventListener("targetLost",()=>{
      this.tracking=false;this.holding=true;this.holdStart=performance.now();

      if(this.world){
        const obj=this.world.object3D;let stable=null,now=performance.now();
        for(let i=this.poseHistory.length-1;i>=0;i--){if(now-this.poseHistory[i].time>=280){stable=this.poseHistory[i];break;}}
        if(!stable&&this.poseHistory.length)stable=this.poseHistory[0];

        if(stable){
          this.basePos.copy(stable.pos);this.baseQuat.copy(stable.quat);this.baseScale.copy(stable.scale);
          obj.position.copy(this.basePos);obj.quaternion.copy(this.baseQuat);obj.scale.copy(this.baseScale);obj.updateMatrixWorld(true);
        }else{
          this.basePos.copy(obj.position);this.baseQuat.copy(obj.quaternion);this.baseScale.copy(obj.scale);
        }
        obj.visible=true;
      }

      this.showHits();this.updateHitPositions();

      if(this.timer){clearTimeout(this.timer);this.timer=null;}
      // Standalone mode: keep Building interaction visible until page close/reload.
    });
  },

  getCanvasComp:function(){
    return document.getElementById("buildingDisplay")?.components?.["building-canvas"];
  },

  getCamera:function(){
    if(!this.camera){const e=document.querySelector("a-camera");this.camera=e&&e.getObject3D("camera");}
    return this.camera;
  },

  projectWorld:function(v){
    const cam=this.getCamera();if(!cam)return null;
    const p=v.clone().project(cam);
    return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight};
  },

  canvasToLocal:function(x,y){
    return new THREE.Vector3(
      (x/this.canvasW-.5)*this.planeWidth,
      (.5-y/this.canvasH)*this.planeHeight,
      .10
    );
  },

  getScreenScale:function(){
    if(!this.world)return null;
    const obj=this.world.object3D;obj.updateMatrixWorld(true);

    const c=this.projectWorld(new THREE.Vector3(0,0,0).applyMatrix4(obj.matrixWorld));
    const r=this.projectWorld(new THREE.Vector3(.5,0,0).applyMatrix4(obj.matrixWorld));
    const u=this.projectWorld(new THREE.Vector3(0,.5,0).applyMatrix4(obj.matrixWorld));
    if(!c||!r||!u)return null;

    return{
      pxPerUnitX:Math.max(1,Math.abs(r.x-c.x)*2),
      pxPerUnitY:Math.max(1,Math.abs(u.y-c.y)*2)
    };
  },

  hitKindAt:function(x,y,source){
    for(const kind of ["reset","house","tower","school","shop"]){
      const b=this.hits[kind];
      if(!b||b.style.display==="none")continue;
      const r=b.getBoundingClientRect();
      const pad=source==="hand"?8:0;
      if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad)return kind;
    }
    return null;
  },

  handleDown:function(input){
    const kind=this.hitKindAt(input.x,input.y,input.source);
    if(!kind)return;

    if(input.nativeEvent)input.nativeEvent.preventDefault();

    if(kind==="reset"){
      this.getCanvasComp()?.reset();
      return;
    }

    const comp=this.getCanvasComp();
    const scale=this.getScreenScale();
    if(!comp||!scale)return;

    const item=comp.items[kind];
    this.dragState={
      pointerId:input.pointerId,
      kind,
      startScreenX:input.x,
      startScreenY:input.y,
      startCanvasX:item.x,
      startCanvasY:item.y,
      pxPerUnitX:scale.pxPerUnitX,
      pxPerUnitY:scale.pxPerUnitY,
      moved:false
    };

    document.getElementById("hint").textContent="拖到街道旁边吧！";
  },

  handleMove:function(input){
    if(!this.dragState||input.pointerId!==this.dragState.pointerId)return;
    if(input.nativeEvent)input.nativeEvent.preventDefault();

    const comp=this.getCanvasComp();
    if(!comp)return;

    const dx=input.x-this.dragState.startScreenX;
    const dy=input.y-this.dragState.startScreenY;
    if(Math.hypot(dx,dy)>8)this.dragState.moved=true;

    const screenPxPerCanvasX=(this.dragState.pxPerUnitX*this.planeWidth)/this.canvasW;
    const screenPxPerCanvasY=(this.dragState.pxPerUnitY*this.planeHeight)/this.canvasH;

    comp.setPosition(
      this.dragState.kind,
      this.dragState.startCanvasX+dx/Math.max(.001,screenPxPerCanvasX),
      this.dragState.startCanvasY+dy/Math.max(.001,screenPxPerCanvasY)
    );

    this.updateHitPositions();
  },

  handleUp:function(input){
    if(!this.dragState||input.pointerId!==this.dragState.pointerId)return;

    const state=this.dragState;
    this.dragState=null;

    if(!state.moved){
      this.getCanvasComp()?.toggleLight(state.kind);
    }else{
      document.getElementById("hint").textContent="CITY · 拖动建筑，轻点建筑可以点亮它 ✨";
    }
  },

  showHits:function(){Object.values(this.hits).forEach(b=>b.style.display="block");},
  hideHits:function(){Object.values(this.hits).forEach(b=>b.style.display="none");},

  updateHitPositions:function(){
    if(!this.world)return;

    const comp=this.getCanvasComp();if(!comp)return;
    const obj=this.world.object3D;obj.updateMatrixWorld(true);
    const scale=this.getScreenScale();if(!scale)return;

    const baseSizePx=Math.max(52,.46*scale.pxPerUnitX);

    Object.entries(comp.items).forEach(([kind,item])=>{
      const local=this.canvasToLocal(item.x,item.y);
      const world=local.applyMatrix4(obj.matrixWorld);
      const s=this.projectWorld(world);if(!s)return;

      const visualScale=item.scale||1;
      const sizePx=baseSizePx*Math.max(.85,visualScale);

      const b=this.hits[kind];
      b.style.left=(s.x-sizePx/2)+"px";
      b.style.top=(s.y-sizePx/2)+"px";
      b.style.width=sizePx+"px";
      b.style.height=sizePx+"px";
    });

    const resetLocal=this.canvasToLocal(this.canvasW/2,478);
    const resetWorld=resetLocal.applyMatrix4(obj.matrixWorld);
    const rs=this.projectWorld(resetWorld);

    if(rs){
      const bw=Math.max(96,.46*scale.pxPerUnitX);
      const bh=Math.max(26,.095*scale.pxPerUnitY);
      this.hits.reset.style.left=(rs.x-bw/2)+"px";
      this.hits.reset.style.top=(rs.y-bh/2)+"px";
      this.hits.reset.style.width=bw+"px";
      this.hits.reset.style.height=bh+"px";
    }
  },

  tick:function(){
    if(!this.world)return;

    const now=performance.now();
    const active=this.tracking||!!this.dragState;
    const frameMs=active?33:67;
    if(this._lastControllerTick&&now-this._lastControllerTick<frameMs)return;
    this._lastControllerTick=now;

    const obj=this.world.object3D;

    if(this.tracking){
      this.el.object3D.updateMatrixWorld(true);
      this.lastMatrix.copy(this.el.object3D.matrixWorld);

      const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();
      this.lastMatrix.decompose(p,q,s);

      this.poseHistory.push({pos:p.clone(),quat:q.clone(),scale:s.clone(),time:performance.now()});
      if(this.poseHistory.length>this.maxPoseHistory)this.poseHistory.shift();

      obj.position.copy(p);obj.quaternion.copy(q);obj.scale.copy(s);obj.updateMatrixWorld(true);
      this.updateHitPositions();
      return;
    }

    if(this.holding){
      const t=(performance.now()-this.holdStart)/1000;
      const bob=Math.sin(t*1.35)*.014;
      const sway=Math.sin(t*.95)*.008;
      const roll=Math.sin(t*1.05)*THREE.MathUtils.degToRad(.8);

      obj.position.copy(this.basePos);
      obj.position.x+=sway;
      obj.position.y+=bob;

      const qr=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),roll);
      obj.quaternion.copy(this.baseQuat).multiply(qr);
      obj.scale.copy(this.baseScale);
      obj.updateMatrixWorld(true);

      this.updateHitPositions();
    }
  }
});
</script>
<script>
window.ClassroomCameraOrientation={
  angle:0,
  init(){
    const select=document.getElementById("cameraOrientationSelect");
    this.angle=Number(localStorage.getItem("buildingCameraAngle")||0);
    if(select){
      select.value=String(this.angle);
      select.addEventListener("change",()=>{
        this.angle=Number(select.value)||0;
        localStorage.setItem("buildingCameraAngle",String(this.angle));
        this.apply();
      });
    }
    this.apply();
  },
  apply(){
    const video=document.querySelector("video");
    if(!video){setTimeout(()=>this.apply(),120);return}
    const a=this.angle;
    video.style.transformOrigin="50% 50%";
    video.style.transform=`rotate(${a}deg)`;
    if(a===90||a===270){
      const scale=Math.max(innerWidth/innerHeight,innerHeight/innerWidth);
      video.style.transform=`rotate(${a}deg) scale(${scale})`;
    }
  },
  mapPoint(x,y,width,height){
    const a=this.angle;
    if(a===90)return{x:width-(y/height)*width,y:(x/width)*height};
    if(a===180)return{x:width-x,y:height-y};
    if(a===270)return{x:(y/height)*width,y:height-(x/width)*height};
    return{x,y};
  }
};

window.StandaloneBuildingHandMode={
  running:false,
  sleeping:false,
  timer:null,
  sleepMs:5000,

  clearTimer(){
    if(this.timer){clearTimeout(this.timer);this.timer=null}
  },

  noteInteraction(){
    if(!this.running)return;
    this.clearTimer();
    this.timer=setTimeout(()=>this.sleep(),this.sleepMs);
  },

  async start(){
    if(this.running)return;

    const status=document.getElementById("handStatus");
    const cursor=document.getElementById("handCursor");
    const video=document.querySelector("video");

    if(!video||!window.ClassroomHandTracking)return;

    if(status){
      status.style.display="block";
      status.textContent="手势：启动中…";
    }

    await window.ClassroomHandTracking.start({
      video,
      cursor,
      mirror:false,
      maxFps:18,
      smoothing:.38,
      pinchDownRatio:.34,
      pinchUpRatio:.44,
      reuseExistingVideo:true,
      viewport:()=>({width:innerWidth,height:innerHeight}),
      onStatus:(msg)=>{if(status)status.textContent="手势："+msg},
      onArmedChange:(armed)=>{if(status)status.textContent=armed?"手势：BUILDING":"放下识别卡，张开手 ✋"},
      onMetrics:(data)=>{
        if(!status)return;
        if(!data.handVisible)status.textContent="手势：请伸出一只手";
        else if(data.armed===false)status.textContent="放下识别卡，张开手 ✋";
        else if(data.pinching)status.textContent="手势：抓住";
        else status.textContent="手势：BUILDING";
      }
    });

    this.running=true;
    this.sleeping=false;
    this.noteInteraction();
    window.ClassroomHandTracking.requireReleaseToArm(300);

    const btn=document.getElementById("handBtn");
    if(btn)btn.textContent="✨ INTERACT · ON";
  },

  sleep(){
    if(!this.running)return;
    this.clearTimer();
    window.ClassroomHandTracking?.stop({keepVideo:true,keepModel:true});
    this.running=false;
    this.sleeping=true;

    const cursor=document.getElementById("handCursor");
    const status=document.getElementById("handStatus");
    const btn=document.getElementById("handBtn");

    if(cursor)cursor.style.display="none";
    if(status){
      status.style.display="block";
      status.textContent="手势：已关闭 · 再点 INTERACT 唤醒";
    }
    if(btn)btn.textContent="✨ INTERACT · OFF";
  },

  toggle(){
    this.running?this.sleep():this.start();
  }
};

document.addEventListener("DOMContentLoaded",()=>{
  window.ClassroomCameraOrientation.init();

  document.getElementById("handBtn")
    ?.addEventListener("click",()=>window.StandaloneBuildingHandMode.toggle());

  window.CityInput.register("building-hand-auto-sleep",{
    down:(input)=>{if(input.source==="hand")window.StandaloneBuildingHandMode.noteInteraction()},
    up:(input)=>{if(input.source==="hand")window.StandaloneBuildingHandMode.noteInteraction()}
  });
});
</script>

<script type="module" src="../js/hand-tracking-performance.js"></script>
</head>

<body>
<div id="cameraOrientationControl">
  <span>📷 CAMERA</span>
  <select id="cameraOrientationSelect" aria-label="Camera orientation">
    <option value="0">0°</option>
    <option value="90">90°</option>
    <option value="180">180°</option>
    <option value="270">270°</option>
  </select>
</div>
<button id="handBtn" type="button">✨ INTERACT · OFF</button>
<div id="handStatus">手势：已关闭</div>
<div id="handCursor">✨</div>
<div id="hint">请把镜头对准 Building 识别图</div>

<div id="dragLayer">
  <button id="dragHouse" class="drag-hit" aria-label="House"></button>
  <button id="dragTower" class="drag-hit" aria-label="Tower"></button>
  <button id="dragSchool" class="drag-hit" aria-label="School"></button>
  <button id="dragShop" class="drag-hit" aria-label="Shop"></button>
  <button id="dragReset" class="drag-hit" aria-label="Reset">再试一次</button>
</div>

<canvas id="buildingCanvas" class="off" width="768" height="512"></canvas>

<a-scene
  mindar-image="imageTargetSrc: ../targets/building.mind; autoStart: true; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity
    mindar-image-target="targetIndex:0"
    building-events
    building-drag-controller="seconds:15; world:#buildingWorld">
  </a-entity>

  <a-entity id="buildingWorld" visible="false">
    <a-plane
      id="buildingDisplay"
      width="2.15"
      height="1.43"
      position="0 0.03 0.02"
      material="shader:flat;src:#buildingCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      building-canvas>
    </a-plane>
  </a-entity>

</a-scene>
</body>
</html>
