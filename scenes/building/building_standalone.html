<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Building · City Story · Module</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<link rel="stylesheet" href="./building-style.css">

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:system-ui}
video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}
canvas.a-canvas{background:transparent!important;transform:scaleX(-1)!important;transform-origin:50% 50%!important}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.92);font:700 14px system-ui;box-shadow:0 6px 24px rgba(0,0,0,.16)}
#cameraOrientationControl{position:fixed;left:18px;top:18px;z-index:90;display:flex;gap:7px;align-items:center;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.9);font:800 11px system-ui}
#cameraOrientationControl select{border:0;border-radius:999px;padding:5px 8px;background:rgba(255,240,180,.92);font:800 12px system-ui}
.mindar-ui-scanning,.mindar-ui-scanning .scanning,.mindar-ui-scanning .scanning-line,.mindar-ui-scanning .inner,.mindar-ui-scanning .scanline{display:none!important;opacity:0!important;visibility:hidden!important}
</style>

<script src="./building-scene.js"></script>
</head>

<body>
<div id="cameraOrientationControl">
  <span>📷 CAMERA</span>
  <select id="cameraOrientationSelect">
    <option value="0">0°</option>
    <option value="90">90°</option>
    <option value="180">180°</option>
    <option value="270">270°</option>
  </select>
</div>

<div id="hint">请把镜头对准 Building 识别图</div>

<script>
BuildingSceneModule.install({
  assetBase:"../../assets/city/"
});
</script>

<a-scene
  mindar-image="imageTargetSrc: ../../targets/building.mind; autoStart:true; maxTrack:1;"
  color-space="sRGB"
  renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true;antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity
    mindar-image-target="targetIndex:0"
    standalone-city>
  </a-entity>

  <a-entity id="cityWorld" visible="false">
    <a-image id="cityBuilding" src="../../assets/city/building_scene.png"
      width="1.25" height="1.88" position="0 0.34 0.02"
      material="transparent:true;opacity:1;depthWrite:false">
    </a-image>

    <a-image id="cityPark" src="../../assets/city/park_scene.png"
      width="1.55" height="1.04" position="-0.72 -0.42 0.03"
      scale=".78 .78 .78"
      material="transparent:true;opacity:1;depthWrite:false">
    </a-image>

    <a-image id="cityMarket" src="../../assets/city/market_scene.png"
      width="1.55" height="1.04" position="0.72 -0.42 0.03"
      scale=".78 .78 .78"
      material="transparent:true;opacity:1;depthWrite:false">
    </a-image>
  </a-entity>
</a-scene>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const sel=document.getElementById("cameraOrientationSelect");
  let a=Number(localStorage.getItem("buildingCameraAngle")||0);
  sel.value=String(a);

  const apply=()=>{
    const v=document.querySelector("video");
    if(!v){setTimeout(apply,120);return}
    v.style.transformOrigin="50% 50%";
    v.style.transform=`rotate(${a}deg) scaleX(-1)`;
    if(a===90||a===270){
      const sc=Math.max(innerWidth/innerHeight,innerHeight/innerWidth);
      v.style.transform=`rotate(${a}deg) scale(${sc}) scaleX(-1)`;
    }
  };

  sel.onchange=()=>{
    a=Number(sel.value)||0;
    localStorage.setItem("buildingCameraAngle",String(a));
    apply();
  };

  apply();
});
</script>
</body>
</html>
