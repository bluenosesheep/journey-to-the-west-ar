<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Scene AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent!important;
}
video{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
  object-fit:cover!important;
  z-index:0!important;
}
a-scene{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
  z-index:1!important;
  background:transparent!important;
}
canvas.a-canvas{background:transparent!important}
.off{display:none}
#hint{
  position:fixed;
  left:50%;
  bottom:max(20px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:20;
  max-width:88vw;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.92);
  color:#222;
  font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.16);
}

#cameraOrientationControl{position:fixed;left:18px;top:18px;z-index:90;display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.90);color:#444;box-shadow:0 5px 18px rgba(0,0,0,.16);font:800 11px/1 system-ui}
#cameraOrientationControl select{border:0;outline:0;border-radius:999px;padding:5px 8px;background:rgba(255,240,180,.92);color:#333;font:800 12px system-ui}
.mindar-ui-scanning,.mindar-ui-scanning .scanning,.mindar-ui-scanning .scanning-line,.mindar-ui-scanning .inner,.mindar-ui-scanning .scanline{display:none!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important}
</style>

<script>
AFRAME.registerComponent("market-events",{
  init:function(){
    const hint=document.getElementById("hint");
    const world=document.getElementById("marketWorld");

    this.lastMatrix=new THREE.Matrix4();

    this.el.addEventListener("targetFound",()=>{
      if(world)world.object3D.visible=true;
      hint.textContent="热闹的市场出现啦！🧺🥕";
    });

    this.el.addEventListener("targetLost",()=>{
      // Standalone story mode: keep Market at the last tracked pose
      // after the recognition card is removed.
      if(world){
        this.el.object3D.updateMatrixWorld(true);
        this.lastMatrix.copy(this.el.object3D.matrixWorld);

        const p=new THREE.Vector3();
        const q=new THREE.Quaternion();
        const sc=new THREE.Vector3();
        this.lastMatrix.decompose(p,q,sc);

        const obj=world.object3D;
        obj.position.copy(p);
        obj.quaternion.identity();
        obj.scale.copy(sc);
        obj.visible=true;
        obj.updateMatrixWorld(true);
      }
      hint.textContent="MARKET · 继续讲你的故事吧 🧺";
    });
  },

  tick:function(){
    const world=document.getElementById("marketWorld");
    if(!world || !this.el.object3D.visible)return;

    this.el.object3D.updateMatrixWorld(true);
    this.lastMatrix.copy(this.el.object3D.matrixWorld);

    const p=new THREE.Vector3();
    const q=new THREE.Quaternion();
    const sc=new THREE.Vector3();
    this.lastMatrix.decompose(p,q,sc);

    const obj=world.object3D;
    obj.position.copy(p);
    obj.quaternion.identity();
    obj.scale.copy(sc);
    obj.updateMatrixWorld(true);
  }
});

function dc(ctx,img,cx,cy,w,h,r=0,a=1){
  ctx.save();
  ctx.globalAlpha=a;
  ctx.translate(cx,cy);
  ctx.rotate(r);
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();
}

function makeUpdater(canvasId,sources,drawFn){
  return {
    init:function(){
      this.c=document.getElementById(canvasId);
      this.ctx=this.c.getContext("2d");
      this.images={};
      this.loaded=0;

      const entries=Object.entries(sources);
      entries.forEach(([k,src])=>{
        const img=new Image();
        img.onload=()=>{
          this.images[k]=img;
          this.loaded++;
          if(this.loaded===this.total)this.draw();
        };
        img.src=src;
      });
      this.total=entries.length;
    },

    draw:function(){
      if(this.loaded<this.total)return;
      const c=this.c,ctx=this.ctx,w=c.width,h=c.height;
      ctx.clearRect(0,0,w,h);drawFn(ctx,this.images,w,h);
      const mesh=this.el.getObject3D("mesh");
      if(mesh&&mesh.material&&mesh.material.map)mesh.material.map.needsUpdate=true;
    }
  };
}

AFRAME.registerComponent(
  "market-canvas",
  makeUpdater(
    "marketCanvas",
    {market:"../assets/city/market_scene.png"},
    (ctx,I,w,h)=>{
      dc(ctx,I.market,w*.50,h*.50,w*.98,h*.66,0,1);
    }
  )
);
</script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const select=document.getElementById("cameraOrientationSelect");
 let angle=Number(localStorage.getItem("marketCameraAngle")||0);select.value=String(angle);
 const apply=()=>{const v=document.querySelector("video");if(!v){setTimeout(apply,120);return}v.style.transformOrigin="50% 50%";v.style.transform=`rotate(${angle}deg)`;if(angle===90||angle===270){const sc=Math.max(innerWidth/innerHeight,innerHeight/innerWidth);v.style.transform=`rotate(${angle}deg) scale(${sc})`}};
 select.addEventListener("change",()=>{angle=Number(select.value)||0;localStorage.setItem("marketCameraAngle",String(angle));apply()});apply();
});
</script></head>

<body>
<div id="cameraOrientationControl"><span>📷 CAMERA</span><select id="cameraOrientationSelect"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div>
<div id="hint">请把镜头对准 Market 识别图</div>

<canvas id="marketCanvas" class="off" width="768" height="512"></canvas>

<a-scene
  mindar-image="imageTargetSrc: ../targets/market.mind; autoStart: true; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex:0" market-events></a-entity>

  <a-entity id="marketWorld" visible="false">
    <a-plane
      width="2.35"
      height="1.57"
      position="0 0.03 0.03"
      material="shader:flat;src:#marketCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      market-canvas>
    </a-plane>
  </a-entity>

</a-scene>
</body>
</html>
