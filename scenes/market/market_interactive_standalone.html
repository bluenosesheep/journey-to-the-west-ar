<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Story + Interactive AR · Module</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="../../js/input-router.js"></script>

<link rel="stylesheet" href="./market-style.css">
<script src="./market-scene.js"></script>
<script type="module" src="../../js/hand-tracking-performance.js"></script>
</head>

<body>
<!-- Market owns its UI. Mount it before A-Frame initializes market-persist. -->
<script>
MarketSceneModule.install({
  integrated:false,
  assetBase:"../../assets/market/",
  storyImage:"../../assets/city/market_scene.png"
});
</script>

<a-scene
  mindar-image="imageTargetSrc: ../../targets/market.mind; autoStart: true; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true;antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera
    position="0 0 0"
    look-controls="enabled:false"
    cursor="fuse:false; rayOrigin:mouse"
    raycaster="objects:.clickable; far:10000">
  </a-camera>

  <!-- market.mind contains only Market, so standalone targetIndex = 0 -->
  <a-entity
    mindar-image-target="targetIndex:0"
    market-events
    market-persist="seconds:15; world:#marketWorld">
  </a-entity>

  <a-entity id="marketWorld" visible="false">
    <a-plane
      id="marketDisplay"
      width="2.15"
      height="1.43"
      position="0 0.03 0.02"
      material="shader:flat;src:#marketCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      market-canvas>
    </a-plane>

    <a-plane class="clickable" pick-item="kind:peach"
      position="-0.38 0.35 0.10" width="0.58" height="0.58"
      material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double">
    </a-plane>

    <a-plane class="clickable" pick-item="kind:cabbage"
      position="0 0.38 0.10" width="0.58" height="0.58"
      material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double">
    </a-plane>

    <a-plane class="clickable" pick-item="kind:egg"
      position="0.38 0.35 0.10" width="0.58" height="0.58"
      material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double">
    </a-plane>

    <a-plane class="clickable"
      position="0 -0.62 0.14"
      width="0.74"
      height="0.30"
      material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"
      reset-market>
    </a-plane>
  </a-entity>
</a-scene>
</body>
</html>
