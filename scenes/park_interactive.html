<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Park Drag & Drop AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}
canvas.a-canvas{background:transparent!important}.off{display:none}

#hint{
  position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:20;max-width:88vw;padding:10px 14px;
  border-radius:999px;background:rgba(255,255,255,.92);color:#222;
  font:14px/1.4 system-ui;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.16)
}

#dragLayer{position:fixed;inset:0;z-index:40;pointer-events:none}
.drag-hit{
  position:fixed;display:none;border:0;background:transparent;
  pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;
}
</style>

<script>
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

AFRAME.registerComponent("park-events",{
  init:function(){
    const h=document.getElementById("hint");
    this.el.addEventListener("targetFound",()=>{
      h.textContent="PARK · 拖动这些东西来布置公园吧！🌳";
    });
    this.el.addEventListener("targetLost",()=>{
      h.textContent="Park 还会停留 15 秒，可以继续拖动 🌿";
    });
  }
});

AFRAME.registerComponent("park-canvas",{
  init:function(){
    this.c=document.getElementById("parkCanvas");
    this.ctx=this.c.getContext("2d");

    this.initial={
      tree:{x:245,y:120},
      flower:{x:335,y:120},
      bench:{x:435,y:120},
      fountain:{x:530,y:120}
    };

    this.items={
      tree:{emoji:"🌳",x:245,y:120},
      flower:{emoji:"🌷",x:335,y:120},
      bench:{emoji:"🪑",x:435,y:120},
      fountain:{emoji:"⛲",x:530,y:120}
    };
  },

  setPosition:function(kind,x,y){
    const item=this.items[kind];
    if(!item)return;

    // Keep objects inside the usable park area.
    item.x=Math.max(90,Math.min(678,x));
    item.y=Math.max(85,Math.min(430,y));
  },

  reset:function(){
    Object.entries(this.initial).forEach(([k,p])=>{
      this.items[k].x=p.x;
      this.items[k].y=p.y;
    });
    document.getElementById("hint").textContent="PARK · 拖动这些东西来布置公园吧！🌳";
  },

  tick:function(){
    const ctx=this.ctx,c=this.c,w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h);
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    // Light park environment, while keeping the camera visible behind it.
    // 1) soft grass island
    ctx.save();
    ctx.fillStyle="rgba(126,181,92,.24)";
    ctx.beginPath();
    ctx.ellipse(w/2,390,245,74,0,0,Math.PI*2);
    ctx.fill();

    // 2) a subtle curved walking path
    ctx.strokeStyle="rgba(210,180,125,.46)";
    ctx.lineWidth=30;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(205,425);
    ctx.bezierCurveTo(290,350,455,455,565,370);
    ctx.stroke();

    // soft highlight inside the path
    ctx.strokeStyle="rgba(255,244,211,.34)";
    ctx.lineWidth=12;
    ctx.beginPath();
    ctx.moveTo(205,425);
    ctx.bezierCurveTo(290,350,455,455,565,370);
    ctx.stroke();

    // 3) tiny grass tufts
    ctx.font='30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.globalAlpha=.72;
    ctx.fillText("🌱",175,385);
    ctx.fillText("🌱",585,410);
    ctx.fillText("🌱",305,430);
    ctx.restore();

    // 4) one gently drifting butterfly, decorative only
    const bt=performance.now()/1000;
    const butterflyX=540+Math.sin(bt*.85)*24;
    const butterflyY=245+Math.sin(bt*1.35)*12;
    ctx.save();
    ctx.globalAlpha=.82;
    ctx.font='38px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText("🦋",butterflyX,butterflyY);
    ctx.restore();

    // Draw movable items.
    Object.values(this.items).forEach(item=>{
      ctx.save();
      ctx.translate(item.x,item.y);
      ctx.font='92px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(item.emoji,0,0);
      ctx.restore();
    });

    // RESET button.
    const bx=w/2-86,by=458,bw=172,bh=40,br=20;
    ctx.save();
    roundRect(ctx,bx,by,bw,bh,br);
    ctx.fillStyle="rgba(255,248,220,.96)";
    ctx.fill();
    ctx.lineWidth=3;
    ctx.strokeStyle="#6f8e42";
    ctx.stroke();
    ctx.fillStyle="#56713b";
    ctx.font='700 20px system-ui,sans-serif';
    ctx.fillText("RESET",w/2,by+bh/2+1);
    ctx.restore();

    const mesh=this.el.getObject3D("mesh");
    if(mesh&&mesh.material&&mesh.material.map){
      mesh.material.map.needsUpdate=true;
    }
  }
});

AFRAME.registerComponent("park-drag-controller",{
  schema:{
    seconds:{type:"number",default:15},
    world:{type:"selector"}
  },

  init:function(){
    this.world=this.data.world;
    this.tracking=false;
    this.holding=false;
    this.timer=null;
    this.holdStart=0;

    this.lastMatrix=new THREE.Matrix4();
    this.basePos=new THREE.Vector3();
    this.baseQuat=new THREE.Quaternion();
    this.baseScale=new THREE.Vector3(1,1,1);
    this.poseHistory=[];
    this.maxPoseHistory=24;

    this.planeWidth=2.15;
    this.planeHeight=1.43;
    this.canvasW=768;
    this.canvasH=512;

    this.hits={
      tree:document.getElementById("dragTree"),
      flower:document.getElementById("dragFlower"),
      bench:document.getElementById("dragBench"),
      fountain:document.getElementById("dragFountain"),
      reset:document.getElementById("dragReset")
    };

    this.dragState=null;

    Object.entries(this.hits).forEach(([kind,el])=>{
      if(kind==="reset"){
        el.addEventListener("pointerdown",(e)=>{
          e.preventDefault();
          const comp=this.getCanvasComp();
          if(comp)comp.reset();
        });
      }else{
        el.addEventListener("pointerdown",(e)=>this.startDrag(e,kind));
      }
    });

    window.addEventListener("pointermove",(e)=>this.moveDrag(e),{passive:false});
    window.addEventListener("pointerup",(e)=>this.endDrag(e));
    window.addEventListener("pointercancel",(e)=>this.endDrag(e));

    if(this.world)this.world.object3D.visible=false;

    this.el.addEventListener("targetFound",()=>{
      this.tracking=true;
      this.holding=false;
      this.poseHistory=[];

      if(this.timer){
        clearTimeout(this.timer);
        this.timer=null;
      }

      if(this.world)this.world.object3D.visible=true;
      this.showHits();
    });

    this.el.addEventListener("targetLost",()=>{
      this.tracking=false;
      this.holding=true;
      this.holdStart=performance.now();

      if(this.world){
        const obj=this.world.object3D;
        let stable=null;
        const now=performance.now();

        for(let i=this.poseHistory.length-1;i>=0;i--){
          if(now-this.poseHistory[i].time>=280){
            stable=this.poseHistory[i];
            break;
          }
        }

        if(!stable&&this.poseHistory.length){
          stable=this.poseHistory[0];
        }

        if(stable){
          this.basePos.copy(stable.pos);
          this.baseQuat.copy(stable.quat);
          this.baseScale.copy(stable.scale);

          obj.position.copy(this.basePos);
          obj.quaternion.copy(this.baseQuat);
          obj.scale.copy(this.baseScale);
          obj.updateMatrixWorld(true);
        }else{
          this.basePos.copy(obj.position);
          this.baseQuat.copy(obj.quaternion);
          this.baseScale.copy(obj.scale);
        }

        obj.visible=true;
      }

      this.showHits();
      this.updateHitPositions();

      if(this.timer)clearTimeout(this.timer);
      this.timer=setTimeout(()=>{
        if(this.world)this.world.object3D.visible=false;
        this.holding=false;
        this.hideHits();
        this.timer=null;
      },this.data.seconds*1000);
    });
  },

  getCanvasComp:function(){
    return document.getElementById("parkDisplay")?.components?.["park-canvas"];
  },

  getCamera:function(){
    if(!this.camera){
      const e=document.querySelector("a-camera");
      this.camera=e&&e.getObject3D("camera");
    }
    return this.camera;
  },

  projectWorld:function(v){
    const cam=this.getCamera();
    if(!cam)return null;
    const p=v.clone().project(cam);
    return{
      x:(p.x*.5+.5)*innerWidth,
      y:(-p.y*.5+.5)*innerHeight
    };
  },

  canvasToLocal:function(x,y){
    return new THREE.Vector3(
      (x/this.canvasW-.5)*this.planeWidth,
      (.5-y/this.canvasH)*this.planeHeight,
      .10
    );
  },

  getScreenScale:function(){
    if(!this.world)return null;
    const obj=this.world.object3D;
    obj.updateMatrixWorld(true);

    const c=this.projectWorld(new THREE.Vector3(0,0,0).applyMatrix4(obj.matrixWorld));
    const r=this.projectWorld(new THREE.Vector3(.5,0,0).applyMatrix4(obj.matrixWorld));
    const u=this.projectWorld(new THREE.Vector3(0,.5,0).applyMatrix4(obj.matrixWorld));

    if(!c||!r||!u)return null;

    return{
      pxPerUnitX:Math.max(1,Math.abs(r.x-c.x)*2),
      pxPerUnitY:Math.max(1,Math.abs(u.y-c.y)*2)
    };
  },

  startDrag:function(e,kind){
    const comp=this.getCanvasComp();
    const scale=this.getScreenScale();
    if(!comp||!scale)return;

    e.preventDefault();

    const item=comp.items[kind];

    this.dragState={
      pointerId:e.pointerId,
      kind,
      startScreenX:e.clientX,
      startScreenY:e.clientY,
      startCanvasX:item.x,
      startCanvasY:item.y,
      pxPerUnitX:scale.pxPerUnitX,
      pxPerUnitY:scale.pxPerUnitY
    };

    document.getElementById("hint").textContent="拖到你喜欢的位置！";
  },

  moveDrag:function(e){
    if(!this.dragState||e.pointerId!==this.dragState.pointerId)return;

    e.preventDefault();

    const comp=this.getCanvasComp();
    if(!comp)return;

    const dx=e.clientX-this.dragState.startScreenX;
    const dy=e.clientY-this.dragState.startScreenY;

    const screenPxPerCanvasX=(this.dragState.pxPerUnitX*this.planeWidth)/this.canvasW;
    const screenPxPerCanvasY=(this.dragState.pxPerUnitY*this.planeHeight)/this.canvasH;

    const canvasDx=dx/Math.max(.001,screenPxPerCanvasX);
    const canvasDy=dy/Math.max(.001,screenPxPerCanvasY);

    comp.setPosition(
      this.dragState.kind,
      this.dragState.startCanvasX+canvasDx,
      this.dragState.startCanvasY+canvasDy
    );

    this.updateHitPositions();
  },

  endDrag:function(e){
    if(!this.dragState||e.pointerId!==this.dragState.pointerId)return;
    this.dragState=null;
    document.getElementById("hint").textContent="PARK · 继续拖动来布置公园吧！🌳";
  },

  showHits:function(){
    Object.values(this.hits).forEach(b=>b.style.display="block");
  },

  hideHits:function(){
    Object.values(this.hits).forEach(b=>b.style.display="none");
  },

  updateHitPositions:function(){
    if(!this.world)return;

    const comp=this.getCanvasComp();
    if(!comp)return;

    const obj=this.world.object3D;
    obj.updateMatrixWorld(true);

    const scale=this.getScreenScale();
    if(!scale)return;

    const sizePx=Math.max(52,.46*scale.pxPerUnitX);

    Object.entries(comp.items).forEach(([kind,item])=>{
      const local=this.canvasToLocal(item.x,item.y);
      const world=local.applyMatrix4(obj.matrixWorld);
      const s=this.projectWorld(world);
      if(!s)return;

      const b=this.hits[kind];
      b.style.left=(s.x-sizePx/2)+"px";
      b.style.top=(s.y-sizePx/2)+"px";
      b.style.width=sizePx+"px";
      b.style.height=sizePx+"px";
    });

    const resetLocal=this.canvasToLocal(this.canvasW/2,478);
    const resetWorld=resetLocal.applyMatrix4(obj.matrixWorld);
    const rs=this.projectWorld(resetWorld);

    if(rs){
      const bw=Math.max(90,.74*scale.pxPerUnitX);
      const bh=Math.max(44,.30*scale.pxPerUnitY);
      this.hits.reset.style.left=(rs.x-bw/2)+"px";
      this.hits.reset.style.top=(rs.y-bh/2)+"px";
      this.hits.reset.style.width=bw+"px";
      this.hits.reset.style.height=bh+"px";
    }
  },

  tick:function(){
    if(!this.world)return;

    const obj=this.world.object3D;

    if(this.tracking){
      this.el.object3D.updateMatrixWorld(true);
      this.lastMatrix.copy(this.el.object3D.matrixWorld);

      const p=new THREE.Vector3();
      const q=new THREE.Quaternion();
      const s=new THREE.Vector3();
      this.lastMatrix.decompose(p,q,s);

      this.poseHistory.push({
        pos:p.clone(),
        quat:q.clone(),
        scale:s.clone(),
        time:performance.now()
      });

      if(this.poseHistory.length>this.maxPoseHistory){
        this.poseHistory.shift();
      }

      obj.position.copy(p);
      obj.quaternion.copy(q);
      obj.scale.copy(s);
      obj.updateMatrixWorld(true);

      this.updateHitPositions();
      return;
    }

    if(this.holding){
      const t=(performance.now()-this.holdStart)/1000;

      const bob=Math.sin(t*1.35)*.014;
      const sway=Math.sin(t*.95)*.008;
      const roll=Math.sin(t*1.05)*THREE.MathUtils.degToRad(.8);

      obj.position.copy(this.basePos);
      obj.position.x+=sway;
      obj.position.y+=bob;

      const qr=new THREE.Quaternion()
        .setFromAxisAngle(new THREE.Vector3(0,0,1),roll);

      obj.quaternion.copy(this.baseQuat).multiply(qr);
      obj.scale.copy(this.baseScale);
      obj.updateMatrixWorld(true);

      this.updateHitPositions();
    }
  }
});
</script>
</head>

<body>
<div id="hint">请把镜头对准 Park 识别图</div>

<div id="dragLayer">
  <button id="dragTree" class="drag-hit" aria-label="Tree"></button>
  <button id="dragFlower" class="drag-hit" aria-label="Flower"></button>
  <button id="dragBench" class="drag-hit" aria-label="Bench"></button>
  <button id="dragFountain" class="drag-hit" aria-label="Fountain"></button>
  <button id="dragReset" class="drag-hit" aria-label="Reset"></button>
</div>

<canvas id="parkCanvas" class="off" width="768" height="512"></canvas>

<a-scene
  mindar-image="imageTargetSrc: ../targets/park.mind; autoStart: true;"
  color-space="sRGB"
  renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity
    mindar-image-target="targetIndex:0"
    park-events
    park-drag-controller="seconds:15; world:#parkWorld">
  </a-entity>

  <a-entity id="parkWorld" visible="false">
    <a-plane
      id="parkDisplay"
      width="2.15"
      height="1.43"
      position="0 0.03 0.02"
      material="shader:flat;src:#parkCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      park-canvas>
    </a-plane>
  </a-entity>

</a-scene>
</body>
</html>
