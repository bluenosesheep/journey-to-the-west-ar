<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Interactive AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}
canvas.a-canvas{background:transparent!important}.off{display:none}
#hint{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;max-width:88vw;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font:14px/1.4 system-ui;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.16)}
</style>
<script>
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

AFRAME.registerComponent("market-events",{init:function(){
  const h=document.getElementById("hint");
  this.el.addEventListener("targetFound",()=>h.textContent="MARKET · 点一个食物放进篮筐吧！🧺");
  this.el.addEventListener("targetLost",()=>h.textContent="请把镜头对准 Market 识别图");
}});

AFRAME.registerComponent("market-canvas",{
  init:function(){
    this.c=document.getElementById("marketCanvas");
    this.ctx=this.c.getContext("2d");
    this.items={
      peach:{emoji:"🍑",x:250,y:135,tx:348,ty:320,selected:false,start:0},
      cabbage:{emoji:"🥬",x:384,y:118,tx:384,ty:312,selected:false,start:0},
      egg:{emoji:"🥚",x:518,y:135,tx:420,ty:320,selected:false,start:0}
    };
  },
  pick:function(kind){
    const item=this.items[kind];
    if(!item||item.selected)return;
    item.selected=true;
    item.start=performance.now();
    document.getElementById("hint").textContent="放进篮筐里！";
  },

  reset:function(){
    Object.values(this.items).forEach(item=>{
      item.selected=false;
      item.start=0;
    });
    document.getElementById("hint").textContent="MARKET · 点一个食物放进篮筐吧！🧺";
  },
  tick:function(){
    const ctx=this.ctx,c=this.c,w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h); // fully transparent canvas

    ctx.textAlign="center";ctx.textBaseline="middle";

    Object.values(this.items).forEach(item=>{
      let x=item.x,y=item.y,s=1;
      if(item.selected){
        const p=Math.min(1,(performance.now()-item.start)/650);
        const e=1-Math.pow(1-p,3);
        const arc=Math.sin(Math.PI*p)*75;
        x=item.x+(item.tx-item.x)*e;
        y=item.y+(item.ty-item.y)*e-arc;
        s=1-.50*e;
      }
      ctx.save();ctx.translate(x,y);ctx.scale(s,s);
      ctx.font='96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(item.emoji,0,0);ctx.restore();
    });

    // Draw a consistent basket ourselves instead of using the system 🧺 emoji.
    // This keeps the basket shape identical on iPhone, Android and desktop.
    const basketCx=w/2;
    const basketTop=330;
    const basketW=220;
    const basketH=105;

    // handle
    ctx.save();
    ctx.lineWidth=18;
    ctx.lineCap="round";
    ctx.strokeStyle="#c88435";
    ctx.beginPath();
    ctx.arc(basketCx, basketTop-8, 58, Math.PI, 0);
    ctx.stroke();

    // basket body
    const left=basketCx-basketW/2;
    const right=basketCx+basketW/2;
    const bottom=basketTop+basketH;
    ctx.beginPath();
    ctx.moveTo(left+18,basketTop);
    ctx.lineTo(right-18,basketTop);
    ctx.lineTo(right-38,bottom);
    ctx.quadraticCurveTo(basketCx,bottom+14,left+38,bottom);
    ctx.closePath();
    ctx.fillStyle="#d9a45a";
    ctx.fill();
    ctx.lineWidth=5;
    ctx.strokeStyle="#a96f2b";
    ctx.stroke();

    // rim
    ctx.fillStyle="#e7b66d";
    roundRect(ctx,left,basketTop-14,basketW,28,14);
    ctx.fill();
    ctx.lineWidth=4;
    ctx.strokeStyle="#b7772e";
    ctx.stroke();

    // woven lines
    ctx.save();
    ctx.beginPath();
    ctx.rect(left+20,basketTop+10,basketW-40,basketH-24);
    ctx.clip();
    ctx.strokeStyle="rgba(150,92,35,.55)";
    ctx.lineWidth=4;
    for(let x=left-40;x<right+40;x+=32){
      ctx.beginPath();ctx.moveTo(x,basketTop+10);ctx.lineTo(x+90,bottom);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+90,basketTop+10);ctx.lineTo(x,bottom);ctx.stroke();
    }
    ctx.restore();
    ctx.restore();

    // Friendly rounded RESET button with more space below the basket.
    const bx=w/2-86, by=458, bw=172, bh=40, br=20;
    ctx.save();
    roundRect(ctx,bx,by,bw,bh,br);
    ctx.fillStyle="rgba(255,248,220,.96)";
    ctx.fill();
    ctx.lineWidth=3;
    ctx.strokeStyle="#6f8e42";
    ctx.stroke();

    ctx.fillStyle="#8f2f2a";
    ctx.font='700 20px system-ui, sans-serif';
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("RESET",w/2,by+bh/2+1);
    ctx.restore();

    const mesh=this.el.getObject3D("mesh");
    if(mesh&&mesh.material&&mesh.material.map)mesh.material.map.needsUpdate=true;
  }
});

AFRAME.registerComponent("pick-item",{
  schema:{kind:{type:"string"}},
  init:function(){
    this.el.addEventListener("click",()=>{console.log("market click",this.data.kind);
      const anchor=this.el.parentElement;
      const display=anchor.querySelector("#marketDisplay");
      const comp=display&&display.components["market-canvas"];
      if(comp)comp.pick(this.data.kind);
    });
  }
});

AFRAME.registerComponent("reset-market",{
  init:function(){
    this.el.addEventListener("click",()=>{
      const anchor=this.el.parentElement;
      const display=anchor.querySelector("#marketDisplay");
      const comp=display&&display.components["market-canvas"];
      if(comp)comp.reset();
    });
  }
});
</script>
</head>
<body>
<div id="hint">请把镜头对准 Market 识别图</div>
<canvas id="marketCanvas" class="off" width="768" height="512"></canvas>

<a-scene mindar-image="imageTargetSrc: ../targets/market.mind; autoStart: true;"
 color-space="sRGB"
 renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true"
 vr-mode-ui="enabled:false"
 device-orientation-permission-ui="enabled:false">

<a-camera position="0 0 0" look-controls="enabled:false" cursor="fuse:false; rayOrigin:mouse" raycaster="objects:.clickable; far:10000"></a-camera>

<a-entity mindar-image-target="targetIndex:0" market-events>
  <a-plane id="marketDisplay"
    width="2.15" height="1.43" position="0 0.03 0.02"
    material="shader:flat;src:#marketCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
    market-canvas></a-plane>

  <!-- Larger, almost invisible hit areas placed IN FRONT of display canvas -->
  <a-plane class="clickable" pick-item="kind:peach"
    position="-0.38 0.35 0.10" width="0.58" height="0.58"
    material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"></a-plane>

  <a-plane class="clickable" pick-item="kind:cabbage"
    position="0 0.38 0.10" width="0.58" height="0.58"
    material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"></a-plane>

  <a-plane class="clickable" pick-item="kind:egg"
    position="0.38 0.35 0.10" width="0.58" height="0.58"
    material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"></a-plane>

  <!-- Invisible reset hit area aligned with the canvas-rendered RESET button -->
  <a-plane class="clickable"
    position="0 -0.70 0.11"
    width="0.82" height="0.26"
    material="color:#fff;opacity:0.01;transparent:true;depthWrite:false;side:double"
    reset-market></a-plane>
</a-entity>
</a-scene>
</body></html>
