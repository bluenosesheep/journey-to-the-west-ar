<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Park Story + Interactive AR · Module</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="../../js/input-router.js"></script>

<link rel="stylesheet" href="./park-style.css">
<script src="./park-scene.js"></script>
<script type="module" src="../../js/hand-tracking-performance.js"></script>
</head>

<body>
<!-- Park owns its own DOM. Mount it BEFORE A-Frame parses the Park controller. -->
<script>
ParkSceneModule.mountUI({
  assetBase:"../../assets/park/",
  storyImage:"../../assets/city/park_scene.png"
});
</script>

<a-scene
  mindar-image="imageTargetSrc: ../../targets/park.mind; autoStart: true; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true;antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity
    mindar-image-target="targetIndex:0"
    park-drag-controller="world:#parkWorld">
  </a-entity>

  <a-entity id="parkWorld" visible="false">
    <a-plane
      id="parkDisplay"
      width="2.15"
      height="1.43"
      position="0 0.03 0.02"
      material="shader:flat;src:#parkCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      park-canvas>
    </a-plane>
  </a-entity>
</a-scene>
</body>
</html>
