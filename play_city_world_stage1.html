<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Journey to the West AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}canvas.a-canvas{background:transparent!important}.off{display:none}#hint{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;max-width:88vw;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font:14px system-ui;text-align:center}#holdHitLayer{position:fixed;inset:0;z-index:40;pointer-events:none}.hold-hit{position:fixed;display:none;border:0;background:transparent;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#parkDragLayer{position:fixed;inset:0;z-index:41;pointer-events:none}.park-drag-hit{position:fixed;display:none;border:0;background:transparent;pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent}#cityHitLayer{position:fixed;inset:0;z-index:40;pointer-events:none}.city-hit{position:fixed;display:none;border:0;background:transparent;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}</style>
<script>
window.cityAssetsReady = new Promise((resolve)=>{
  const urls=[
    "./assets/city/building_scene.png",
    "./assets/city/park_scene.png",
    "./assets/city/market_scene.png"
  ];
  let done=0;
  urls.forEach(src=>{
    const img=new Image();
    img.onload=img.onerror=()=>{
      done++;
      if(done===urls.length)resolve();
    };
    img.src=src;
  });
});

AFRAME.registerComponent("city-world-controller",{
  init:function(){
    this.world=document.getElementById("cityWorld");
    this.building=document.getElementById("cityBuilding");
    this.park=document.getElementById("cityPark");
    this.market=document.getElementById("cityMarket");
    this.hint=document.getElementById("hint");
    this.hitPark=document.getElementById("hitCityPark");
    this.hitMarket=document.getElementById("hitCityMarket");
    this.camera=null;

    this.hitPark.addEventListener("click",()=>this.focusPark());
    this.hitMarket.addEventListener("click",()=>this.focusMarket());

    this.tracking=false;
    this.lastMatrix=new THREE.Matrix4();

    this.world.object3D.visible=false;

    this.el.addEventListener("targetFound",()=>{
      this.tracking=true;

      // First cold load: do not reveal white a-image planes before PNG textures are ready.
      this.world.object3D.visible=false;
      this.hint.textContent="CITY WORLD · 正在加载场景…";

      window.cityAssetsReady.then(()=>{
        if(!this.world)return;
        this.showWorld();
        this.world.object3D.visible=true;
        this.updateHitPositions();
        this.hint.textContent="CITY WORLD · 点击 PARK 或 MARKET 进入场景";
      });
    });

    this.el.addEventListener("targetLost",()=>{
      // City World stays at the last tracked pose once it has actually been loaded.
      this.tracking=false;
    });
  },

  getCamera:function(){
    if(!this.camera){
      const camEl=document.querySelector("a-camera");
      this.camera=camEl&&camEl.getObject3D("camera");
    }
    return this.camera;
  },

  projectWorld:function(v){
    const cam=this.getCamera();
    if(!cam)return null;
    const p=v.clone().project(cam);
    return{
      x:(p.x*.5+.5)*window.innerWidth,
      y:(-p.y*.5+.5)*window.innerHeight
    };
  },

  updateHitPositions:function(){
    if(!this.world || this.hitPark.style.display==="none")return;

    const obj=this.world.object3D;
    obj.updateMatrixWorld(true);

    const placeHit=(el,local,wUnit,hUnit)=>{
      const p=local.clone().applyMatrix4(obj.matrixWorld);
      const s=this.projectWorld(p);
      if(!s)return;

      const c=this.projectWorld(new THREE.Vector3(0,0,0).applyMatrix4(obj.matrixWorld));
      const r=this.projectWorld(new THREE.Vector3(.5,0,0).applyMatrix4(obj.matrixWorld));
      const u=this.projectWorld(new THREE.Vector3(0,.5,0).applyMatrix4(obj.matrixWorld));
      if(!c||!r||!u)return;

      const px=Math.max(1,Math.abs(r.x-c.x)*2);
      const py=Math.max(1,Math.abs(u.y-c.y)*2);
      const bw=Math.max(90,wUnit*px);
      const bh=Math.max(70,hUnit*py);

      el.style.left=(s.x-bw/2)+"px";
      el.style.top=(s.y-bh/2)+"px";
      el.style.width=bw+"px";
      el.style.height=bh+"px";
    };

    placeHit(this.hitPark,new THREE.Vector3(-.72,-.42,.03),1.20,.82);
    placeHit(this.hitMarket,new THREE.Vector3(.72,-.42,.03),1.20,.82);
  },

  tick:function(){
    if(this.tracking && this.world){
      this.el.object3D.updateMatrixWorld(true);
      this.lastMatrix.copy(this.el.object3D.matrixWorld);

      const p=new THREE.Vector3();
      const q=new THREE.Quaternion();
      const s=new THREE.Vector3();
      this.lastMatrix.decompose(p,q,s);

      const obj=this.world.object3D;
      obj.position.copy(p);
      obj.quaternion.copy(q);
      obj.scale.copy(s);
      obj.updateMatrixWorld(true);
    }

    this.updateHitPositions();
  },
  showWorld:function(){
    this.setPanel(this.building,"0 0.34 0.02","1 1 1",1);
    this.setPanel(this.park,"-0.72 -0.42 0.03",".78 .78 .78",1);
    this.setPanel(this.market,"0.72 -0.42 0.03",".78 .78 .78",1);
    this.hitPark.style.display="block";
    this.hitMarket.style.display="block";
    this.updateHitPositions();
  },
  setPanel:function(el,pos,scale,opacity){
    el.object3D.visible=true;
    el.setAttribute("position",pos);
    el.setAttribute("scale",scale);
    el.setAttribute("material","opacity",opacity);
  },
  animatePanel:function(el,pos,scale,opacity){
    el.object3D.visible=true;
    el.setAttribute("animation__pos","property: position; to: "+pos+"; dur: 650; easing: easeInOutCubic");
    el.setAttribute("animation__scale","property: scale; to: "+scale+"; dur: 650; easing: easeInOutCubic");
    el.setAttribute("animation__opacity","property: material.opacity; to: "+opacity+"; dur: 450; easing: easeInOutCubic");
    if(opacity===0)setTimeout(()=>{el.object3D.visible=false;},520);
  },
  focusPark:function(){
    this.animatePanel(this.park,"0 0 0.03","1.28 1.28 1.28",1);
    this.animatePanel(this.building,"0 0.38 0.01",".8 .8 .8",0);
    this.animatePanel(this.market,"0.72 -0.42 0.01",".7 .7 .7",0);
    this.hitPark.style.display="none";
    this.hitMarket.style.display="none";
    this.hint.textContent="PARK 已放大 · 现在扫描 PARK 识别图";
  },
  focusMarket:function(){
    this.animatePanel(this.market,"0 0 0.03","1.28 1.28 1.28",1);
    this.animatePanel(this.building,"0 0.38 0.01",".8 .8 .8",0);
    this.animatePanel(this.park,"-0.72 -0.42 0.01",".7 .7 .7",0);
    this.hitPark.style.display="none";
    this.hitMarket.style.display="none";
    this.hint.textContent="MARKET 已放大 · 现在扫描 MARKET 识别图";
  }
});

AFRAME.registerComponent("city-panel-click",{
  schema:{kind:{type:"string"}},
  init:function(){
    this.el.addEventListener("click",()=>{
      const anchor=document.querySelector('[mindar-image-target="targetIndex:0"]');
      const c=anchor&&anchor.components["city-world-controller"];
      if(!c)return;
      if(this.data.kind==="park")c.focusPark();
      if(this.data.kind==="market")c.focusMarket();
    });
  }
});

AFRAME.registerComponent("park-target-events",{init:function(){
  const h=document.getElementById("hint");
  this.el.addEventListener("targetFound",()=>h.textContent="PARK 识别成功 · 下一步接入 Park 互动");
}});

AFRAME.registerComponent("market-target-events",{init:function(){
  const h=document.getElementById("hint");
  this.el.addEventListener("targetFound",()=>h.textContent="MARKET 识别成功 · 下一步接入 Market 互动");
}});
</script></head><body>
<div id="hint">请先扫描 Building 识别图打开 City World</div>
<div id="cityHitLayer">
  <button id="hitCityPark" class="city-hit" aria-label="Park"></button>
  <button id="hitCityMarket" class="city-hit" aria-label="Market"></button>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets/city_world.mind; autoStart: true; maxTrack: 3;"
  color-space="sRGB"
  renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"
    cursor="fuse:false; rayOrigin:mouse"
    raycaster="objects:.clickable; far:10000"></a-camera>

  <a-entity mindar-image-target="targetIndex:0" city-world-controller></a-entity>
  <a-entity mindar-image-target="targetIndex:1" park-target-events></a-entity>
  <a-entity mindar-image-target="targetIndex:2" market-target-events></a-entity>

  <a-entity id="cityWorld" visible="false">

    <a-image id="cityBuilding"
      src="./assets/city/building_scene.png"
      width="1.25" height="1.88"
      position="0 0.34 0.02"
      material="transparent:true;opacity:1;depthWrite:false"></a-image>

    <a-image id="cityPark"
      src="./assets/city/park_scene.png"
      width="1.55" height="1.04"
      position="-0.72 -0.42 0.03"
      scale=".78 .78 .78"
      material="transparent:true;opacity:1;depthWrite:false"></a-image>

    <a-image id="cityMarket"
      src="./assets/city/market_scene.png"
      width="1.55" height="1.04"
      position="0.72 -0.42 0.03"
      scale=".78 .78 .78"
      material="transparent:true;opacity:1;depthWrite:false"></a-image>

  </a-entity>
</a-scene>
</body></html>
