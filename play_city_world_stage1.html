<script>function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}


window.cityAssetsReady = new Promise((resolve)=>{
  const urls=[
    "./assets/city/building_scene.png",
    "./assets/city/park_scene.png",
    "./assets/city/market_scene.png"
  ];
  let done=0;
  urls.forEach(src=>{
    const img=new Image();
    img.onload=img.onerror=()=>{
      done++;
      if(done===urls.length)resolve();
    };
    img.src=src;
  });
});

AFRAME.registerComponent("city-world-controller",{
  init:function(){
    this.world=document.getElementById("cityWorld");
    this.building=document.getElementById("cityBuilding");
    this.park=document.getElementById("cityPark");
    this.market=document.getElementById("cityMarket");
    this.hint=document.getElementById("hint");
    this.backBtn=document.getElementById("sceneBackBtn");
    this.backBtn.addEventListener("click",()=>this.exitToCity());
    window.citySelectedScene=null;
    this.parkInteraction=document.getElementById("parkInteractionWorld");
    this.marketInteraction=document.getElementById("marketInteractionWorld");
    this.hitPark=document.getElementById("hitCityPark");
    this.hitMarket=document.getElementById("hitCityMarket");
    this.camera=null;

    this.hitPark.addEventListener("click",()=>this.focusPark());
    this.hitMarket.addEventListener("click",()=>this.focusMarket());

    this.tracking=false;
    this.lastMatrix=new THREE.Matrix4();

    this.world.object3D.visible=false;

    this.el.addEventListener("targetFound",()=>{
      this.tracking=true;

      // First cold load: do not reveal white a-image planes before PNG textures are ready.
      this.world.object3D.visible=false;
      this.hint.textContent="CITY WORLD · 正在加载场景…";

      window.cityAssetsReady.then(()=>{
        if(!this.world)return;
        this.showWorld();
        this.world.object3D.visible=true;
        this.updateHitPositions();
        this.hint.textContent="CITY WORLD · 点击 PARK 或 MARKET 进入场景";
      });
    });

    this.el.addEventListener("targetLost",()=>{
      // City World stays at the last tracked pose once it has actually been loaded.
      this.tracking=false;
    });
  },

  getCamera:function(){
    if(!this.camera){
      const camEl=document.querySelector("a-camera");
      this.camera=camEl&&camEl.getObject3D("camera");
    }
    return this.camera;
  },

  projectWorld:function(v){
    const cam=this.getCamera();
    if(!cam)return null;
    const p=v.clone().project(cam);
    return{
      x:(p.x*.5+.5)*window.innerWidth,
      y:(-p.y*.5+.5)*window.innerHeight
    };
  },

  updateHitPositions:function(){
    if(!this.world || this.hitPark.style.display==="none")return;

    const obj=this.world.object3D;
    obj.updateMatrixWorld(true);

    const placeHit=(el,local,wUnit,hUnit)=>{
      const p=local.clone().applyMatrix4(obj.matrixWorld);
      const s=this.projectWorld(p);
      if(!s)return;

      const c=this.projectWorld(new THREE.Vector3(0,0,0).applyMatrix4(obj.matrixWorld));
      const r=this.projectWorld(new THREE.Vector3(.5,0,0).applyMatrix4(obj.matrixWorld));
      const u=this.projectWorld(new THREE.Vector3(0,.5,0).applyMatrix4(obj.matrixWorld));
      if(!c||!r||!u)return;

      const px=Math.max(1,Math.abs(r.x-c.x)*2);
      const py=Math.max(1,Math.abs(u.y-c.y)*2);
      const bw=Math.max(90,wUnit*px);
      const bh=Math.max(70,hUnit*py);

      el.style.left=(s.x-bw/2)+"px";
      el.style.top=(s.y-bh/2)+"px";
      el.style.width=bw+"px";
      el.style.height=bh+"px";
    };

    placeHit(this.hitPark,new THREE.Vector3(-.72,-.42,.03),1.20,.82);
    placeHit(this.hitMarket,new THREE.Vector3(.72,-.42,.03),1.20,.82);
  },

  tick:function(){
    if(this.tracking && this.world){
      this.el.object3D.updateMatrixWorld(true);
      this.lastMatrix.copy(this.el.object3D.matrixWorld);

      const p=new THREE.Vector3();
      const q=new THREE.Quaternion();
      const s=new THREE.Vector3();
      this.lastMatrix.decompose(p,q,s);

      const obj=this.world.object3D;
      obj.position.copy(p);
      obj.quaternion.identity();
      obj.scale.copy(s);
      obj.updateMatrixWorld(true);
    }

    this.updateHitPositions();
  },
  exitToCity:function(){
    // Stop Park interaction/hold completely.
    const parkTarget=document.querySelector('[mindar-image-target="targetIndex:1"]');
    const parkComp=parkTarget&&parkTarget.components&&parkTarget.components["park-drag-controller"];
    if(parkComp){
      parkComp.tracking=false;
      parkComp.holding=false;
      if(parkComp.timer){clearTimeout(parkComp.timer);parkComp.timer=null;}
      if(parkComp.dragState)parkComp.dragState=null;
      if(parkComp.hideHits)parkComp.hideHits();
    }

    // Stop Market interaction/hold completely.
    const marketTarget=document.querySelector('[mindar-image-target="targetIndex:2"]');
    const marketComp=marketTarget&&marketTarget.components&&marketTarget.components["market-persist"];
    if(marketComp){
      marketComp.tracking=false;
      marketComp.holding=false;
      if(marketComp.timer){clearTimeout(marketComp.timer);marketComp.timer=null;}
      if(marketComp.hideHoldHits)marketComp.hideHoldHits();
    }

    if(this.parkInteraction)this.parkInteraction.object3D.visible=false;
    if(this.marketInteraction)this.marketInteraction.object3D.visible=false;

    const parkBg=document.getElementById("parkDynamicBackground");
    const marketBg=document.getElementById("marketDynamicBackground");
    if(parkBg)parkBg.object3D.visible=false;
    if(marketBg)marketBg.object3D.visible=false;

    const parkLayer=document.getElementById("parkDragLayer");
    const marketLayer=document.getElementById("marketHoldLayer");
    if(parkLayer)parkLayer.style.display="none";
    if(marketLayer)marketLayer.style.display="none";

    this.showWorld();
    this.hint.textContent="CITY WORLD · 点击 PARK 或 MARKET 进入场景";
  },

  showWorld:function(){
    window.citySelectedScene=null;
    if(this.backBtn)this.backBtn.style.display="none";
    this.setPanel(this.building,"0 0.34 0.02","1 1 1",1);
    this.setPanel(this.park,"-0.72 -0.42 0.03",".78 .78 .78",1);
    this.setPanel(this.market,"0.72 -0.42 0.03",".78 .78 .78",1);
    this.hitPark.style.display="block";
    this.hitMarket.style.display="block";
    if(this.parkInteraction)this.parkInteraction.object3D.visible=false;
    if(this.marketInteraction)this.marketInteraction.object3D.visible=false;

    const parkBg=document.getElementById("parkDynamicBackground");
    const marketBg=document.getElementById("marketDynamicBackground");
    if(parkBg)parkBg.object3D.visible=false;
    if(marketBg)marketBg.object3D.visible=false;
    document.getElementById("parkDragLayer").style.display="none";
    document.getElementById("marketHoldLayer").style.display="none";
    this.updateHitPositions();
  },
  setPanel:function(el,pos,scale,opacity){
    el.object3D.visible=true;

    // Clear old animation components first.
    // Otherwise after returning to Building, the previous Park/Market zoom
    // animation can keep controlling transform/material and the second click
    // appears to do nothing.
    el.removeAttribute("animation__pos");
    el.removeAttribute("animation__scale");
    el.removeAttribute("animation__opacity");

    el.setAttribute("position",pos);
    el.setAttribute("scale",scale);
    el.setAttribute("material","opacity",opacity);
  },
  animatePanel:function(el,pos,scale,opacity){
    el.object3D.visible=true;

    el.removeAttribute("animation__pos");
    el.removeAttribute("animation__scale");
    el.removeAttribute("animation__opacity");

    // Force A-Frame to commit the current transform before creating
    // a fresh animation component for this new transition.
    void el.object3D.position.x;

    el.setAttribute("animation__pos","property: position; to: "+pos+"; dur: 760; easing: easeInOutCubic");
    el.setAttribute("animation__scale","property: scale; to: "+scale+"; dur: 760; easing: easeInOutCubic");
    el.setAttribute("animation__opacity","property: material.opacity; to: "+opacity+"; dur: 450; easing: easeInOutCubic");
    if(opacity===0)setTimeout(()=>{el.object3D.visible=false;},520);
  },
  focusPark:function(){
    window.citySelectedScene="park";
    if(this.backBtn)this.backBtn.style.display="block";
    this.animatePanel(this.park,"0 0.08 0.03","1.95 1.95 1.95",1);
    this.animatePanel(this.building,"0 0.38 0.01",".8 .8 .8",0);
    this.animatePanel(this.market,"0.72 -0.42 0.01",".7 .7 .7",0);
    this.hitPark.style.display="none";
    this.hitMarket.style.display="none";
    this.hint.textContent="PARK 已放大 · 现在扫描 PARK 识别图";
  },
  activateParkInteraction:function(){
    if(this.backBtn)this.backBtn.style.display="block";
    if(!this.parkInteraction)return;

    // Once the Park target is scanned, stop using the CityWorld-fixed Park image.
    // A new Park background is driven by the REAL Park target pose instead.
    this.park.object3D.visible=false;

    this.parkInteraction.object3D.visible=true;
    this.parkInteraction.setAttribute("position","0.22 -0.24 0.24");
    this.parkInteraction.setAttribute("scale",".74 .74 .74");
    this.marketInteraction.object3D.visible=false;
    document.getElementById("parkDragLayer").style.display="block";
    document.getElementById("marketHoldLayer").style.display="none";
  },

  activateMarketInteraction:function(){
    if(this.backBtn)this.backBtn.style.display="block";
    if(!this.marketInteraction)return;

    // Once the Market target is scanned, stop using the CityWorld-fixed Market image.
    // A new Market background is driven by the REAL Market target pose instead.
    this.market.object3D.visible=false;

    this.marketInteraction.object3D.visible=true;
    this.marketInteraction.setAttribute("position","0.24 -0.22 0.22");
    this.marketInteraction.setAttribute("scale",".72 .72 .72");
    this.parkInteraction.object3D.visible=false;
    document.getElementById("marketHoldLayer").style.display="block";
    document.getElementById("parkDragLayer").style.display="none";
  },

  focusMarket:function(){
    window.citySelectedScene="market";
    if(this.backBtn)this.backBtn.style.display="block";
    this.animatePanel(this.market,"0 0 0.03","1.28 1.28 1.28",1);
    this.animatePanel(this.building,"0 0.38 0.01",".8 .8 .8",0);
    this.animatePanel(this.park,"-0.72 -0.42 0.01",".7 .7 .7",0);
    this.hitPark.style.display="none";
    this.hitMarket.style.display="none";
    this.hint.textContent="MARKET 已放大 · 现在扫描 MARKET 识别图";
  }
});

AFRAME.registerComponent("city-panel-click",{
  schema:{kind:{type:"string"}},
  init:function(){
    this.el.addEventListener("click",()=>{
      const anchor=document.querySelector('[mindar-image-target="targetIndex:0"]');
      const c=anchor&&anchor.components["city-world-controller"];
      if(!c)return;
      if(this.data.kind==="park")c.focusPark();
      if(this.data.kind==="market")c.focusMarket();
    });
  }
});


AFRAME.registerComponent("scene-background-follow",{
  schema:{
    world:{type:"selector"}
  },

  init:function(){
    this.world=this.data.world;
    this.tracking=false;

    if(this.world){
      this.world.object3D.visible=false;
    }

    this.el.addEventListener("targetFound",()=>{
      const idx=this.el.components["mindar-image-target"]?.data?.targetIndex;

      if(idx===1 && window.citySelectedScene!=="park"){
        this.tracking=false;
        if(this.world)this.world.object3D.visible=false;
        return;
      }

      if(idx===2 && window.citySelectedScene!=="market"){
        this.tracking=false;
        if(this.world)this.world.object3D.visible=false;
        return;
      }

      this.tracking=true;
      if(this.world)this.world.object3D.visible=true;
    });

    this.el.addEventListener("targetLost",()=>{
      // Freeze at the last tracked pose. The interaction controller has
      // its own hold logic; keeping the background at the last pose makes
      // the two remain spatially related instead of jumping elsewhere.
      this.tracking=false;
    });
  },

  tick:function(){
    if(!this.tracking || !this.world)return;

    this.el.object3D.updateMatrixWorld(true);

    const p=new THREE.Vector3();
    const q=new THREE.Quaternion();
    const s=new THREE.Vector3();

    this.el.object3D.matrixWorld.decompose(p,q,s);

    const obj=this.world.object3D;
    obj.position.copy(p);
    obj.quaternion.identity();
    obj.scale.copy(s);
    obj.updateMatrixWorld(true);
  }
});


function clearOtherInteractiveScene(active){
  const parkWorld=document.getElementById("parkInteractionWorld");
  const parkBg=document.getElementById("parkDynamicBackground");
  const marketWorld=document.getElementById("marketInteractionWorld");
  const marketBg=document.getElementById("marketDynamicBackground");

  if(active!=="park"){
    if(parkWorld)parkWorld.object3D.visible=false;
    if(parkBg)parkBg.object3D.visible=false;

    const parkTarget=document.querySelector('[mindar-image-target="targetIndex:1"]');
    const parkComp=parkTarget && parkTarget.components && parkTarget.components["park-drag-controller"];
    if(parkComp){
      parkComp.tracking=false;
      parkComp.holding=false;
      if(parkComp.timer){clearTimeout(parkComp.timer);parkComp.timer=null;}
      if(parkComp.dragState)parkComp.dragState=null;
      if(parkComp.hideHits)parkComp.hideHits();
    }
  }

  if(active!=="market"){
    if(marketWorld)marketWorld.object3D.visible=false;
    if(marketBg)marketBg.object3D.visible=false;

    const marketTarget=document.querySelector('[mindar-image-target="targetIndex:2"]');
    const marketComp=marketTarget && marketTarget.components && marketTarget.components["market-persist"];
    if(marketComp){
      marketComp.tracking=false;
      marketComp.holding=false;
      if(marketComp.timer){clearTimeout(marketComp.timer);marketComp.timer=null;}
      if(marketComp.hideHoldHits)marketComp.hideHoldHits();
    }
  }
}

AFRAME.registerComponent("park-canvas",{
  init:function(){
    this.c=document.getElementById("parkInteractiveCanvas");
    this.ctx=this.c.getContext("2d");

    this.initial={
      tree:{x:245,y:120},
      flower:{x:335,y:120},
      bench:{x:435,y:120},
      fountain:{x:530,y:120}
    };

    this.items={
      tree:{emoji:"🌳",x:245,y:120,scale:1.55},
      flower:{emoji:"🌷",x:335,y:120,scale:.58},
      bench:{emoji:"🪑",x:435,y:120,scale:.72},
      fountain:{emoji:"⛲",x:530,y:120,scale:1.08}
    };
  },

  setPosition:function(kind,x,y){
    const item=this.items[kind];
    if(!item)return;

    // Keep objects inside the usable park area.
    item.x=Math.max(90,Math.min(678,x));
    item.y=Math.max(85,Math.min(430,y));
  },

  reset:function(){
    Object.entries(this.initial).forEach(([k,p])=>{
      this.items[k].x=p.x;
      this.items[k].y=p.y;
    });
    document.getElementById("hint").textContent="PARK · 拖动这些东西来布置公园吧！🌳";
  },

  tick:function(){
    const ctx=this.ctx,c=this.c,w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h);
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    // Light park environment, while keeping the camera visible behind it.
    // 1) soft grass island
    ctx.save();
    ctx.fillStyle="rgba(126,181,92,.24)";
    ctx.beginPath();
    ctx.ellipse(w/2,390,245,74,0,0,Math.PI*2);
    ctx.fill();

    // 2) a subtle curved walking path
    ctx.strokeStyle="rgba(210,180,125,.46)";
    ctx.lineWidth=30;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(205,425);
    ctx.bezierCurveTo(290,350,455,455,565,370);
    ctx.stroke();

    // soft highlight inside the path
    ctx.strokeStyle="rgba(255,244,211,.34)";
    ctx.lineWidth=12;
    ctx.beginPath();
    ctx.moveTo(205,425);
    ctx.bezierCurveTo(290,350,455,455,565,370);
    ctx.stroke();

    // 3) tiny grass tufts
    ctx.font='30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.globalAlpha=.72;
    ctx.fillText("🌱",175,385);
    ctx.fillText("🌱",585,410);
    ctx.fillText("🌱",305,430);
    ctx.restore();

    // 4) butterfly flies clearly back and forth across the park.
    const bt=performance.now()/1000;
    const travel=(Math.sin(bt*.72)+1)/2; // 0 -> 1 -> 0
    const butterflyX=185+travel*395;
    const butterflyY=245+Math.sin(bt*1.55)*16;
    const butterflyScale=.86+.10*Math.sin(bt*3.1);

    ctx.save();
    ctx.globalAlpha=.86;
    ctx.translate(butterflyX,butterflyY);
    ctx.scale(butterflyScale,butterflyScale);
    ctx.font='38px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText("🦋",0,0);
    ctx.restore();

    // Draw movable items.
    Object.values(this.items).forEach(item=>{
      ctx.save();
      ctx.translate(item.x,item.y);
      ctx.scale(item.scale||1,item.scale||1);
      ctx.font='92px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(item.emoji,0,0);
      ctx.restore();
    });

    // RESET button.
    const bx=w/2-86,by=458,bw=172,bh=40,br=20;
    ctx.save();
    roundRect(ctx,bx,by,bw,bh,br);
    ctx.fillStyle="rgba(255,248,220,.96)";
    ctx.fill();
    ctx.lineWidth=3;
    ctx.strokeStyle="#6f8e42";
    ctx.stroke();
    ctx.fillStyle="#56713b";
    ctx.font='700 20px system-ui,sans-serif';
    ctx.fillText("RESET",w/2,by+bh/2+1);
    ctx.restore();

    const mesh=this.el.getObject3D("mesh");
    if(mesh&&mesh.material&&mesh.material.map){
      mesh.material.map.needsUpdate=true;
    }
  }
});

AFRAME.registerComponent("park-drag-controller",{
  schema:{
    seconds:{type:"number",default:15},
    world:{type:"selector"}
  },

  init:function(){
    this.world=this.data.world;
    this.tracking=false;
    this.holding=false;
    this.timer=null;
    this.holdStart=0;

    this.lastMatrix=new THREE.Matrix4();
    this.basePos=new THREE.Vector3();
    this.baseQuat=new THREE.Quaternion();
    this.baseScale=new THREE.Vector3(1,1,1);
    this.poseHistory=[];
    this.maxPoseHistory=24;

    this.planeWidth=2.15;
    this.planeHeight=1.43;
    this.canvasW=768;
    this.canvasH=512;

    this.hits={
      tree:document.getElementById("parkDragTree"),
      flower:document.getElementById("parkDragFlower"),
      bench:document.getElementById("parkDragBench"),
      fountain:document.getElementById("parkDragFountain"),
      reset:document.getElementById("parkDragReset")
    };

    this.dragState=null;

    Object.entries(this.hits).forEach(([kind,el])=>{
      if(kind==="reset"){
        el.addEventListener("pointerdown",(e)=>{
          e.preventDefault();
          const comp=this.getCanvasComp();
          if(comp)comp.reset();
        });
      }else{
        el.addEventListener("pointerdown",(e)=>this.startDrag(e,kind));
      }
    });

    window.addEventListener("pointermove",(e)=>this.moveDrag(e),{passive:false});
    window.addEventListener("pointerup",(e)=>this.endDrag(e));
    window.addEventListener("pointercancel",(e)=>this.endDrag(e));

    if(this.world)this.world.object3D.visible=false;

    this.el.addEventListener("targetFound",()=>{
      if(window.citySelectedScene!=="park"){
        this.tracking=false;
        this.holding=false;
        if(this.world)this.world.object3D.visible=false;
        this.hideHits();
        return;
      }

      this.tracking=true;
      this.holding=false;
      this.poseHistory=[];

      if(this.timer){
        clearTimeout(this.timer);
        this.timer=null;
      }

      if(this.world)this.world.object3D.visible=true;
      this.showHits();
    });

    this.el.addEventListener("targetLost",()=>{
      if(window.citySelectedScene!=="park")return;

      this.tracking=false;
      this.holding=true;
      this.holdStart=performance.now();

      if(this.world){
        const obj=this.world.object3D;
        let stable=null;
        const now=performance.now();

        for(let i=this.poseHistory.length-1;i>=0;i--){
          if(now-this.poseHistory[i].time>=280){
            stable=this.poseHistory[i];
            break;
          }
        }

        if(!stable&&this.poseHistory.length){
          stable=this.poseHistory[0];
        }

        if(stable){
          this.basePos.copy(stable.pos);
          this.baseQuat.copy(stable.quat);
          this.baseScale.copy(stable.scale);

          obj.position.copy(this.basePos);
          obj.quaternion.identity();
          obj.scale.copy(this.baseScale);
          obj.updateMatrixWorld(true);
        }else{
          this.basePos.copy(obj.position);
          this.baseQuat.copy(obj.quaternion);
          this.baseScale.copy(obj.scale);
        }

        obj.visible=true;
      }

      this.showHits();
      this.updateHitPositions();

      if(this.timer){clearTimeout(this.timer);this.timer=null;}
      // Manual-exit mode: keep Park interaction visible until RETURN CITY is tapped.
    });
  },

  getCanvasComp:function(){
    return document.getElementById("parkInteractiveDisplay")?.components?.["park-canvas"];
  },

  getCamera:function(){
    if(!this.camera){
      const e=document.querySelector("a-camera");
      this.camera=e&&e.getObject3D("camera");
    }
    return this.camera;
  },

  projectWorld:function(v){
    const cam=this.getCamera();
    if(!cam)return null;
    const p=v.clone().project(cam);
    return{
      x:(p.x*.5+.5)*innerWidth,
      y:(-p.y*.5+.5)*innerHeight
    };
  },

  canvasToLocal:function(x,y){
    return new THREE.Vector3(
      (x/this.canvasW-.5)*this.planeWidth,
      (.5-y/this.canvasH)*this.planeHeight,
      .10
    );
  },

  getScreenScale:function(){
    if(!this.world)return null;
    const obj=this.world.object3D;
    obj.updateMatrixWorld(true);

    const c=this.projectWorld(new THREE.Vector3(0,0,0).applyMatrix4(obj.matrixWorld));
    const r=this.projectWorld(new THREE.Vector3(.5,0,0).applyMatrix4(obj.matrixWorld));
    const u=this.projectWorld(new THREE.Vector3(0,.5,0).applyMatrix4(obj.matrixWorld));

    if(!c||!r||!u)return null;

    return{
      pxPerUnitX:Math.max(1,Math.abs(r.x-c.x)*2),
      pxPerUnitY:Math.max(1,Math.abs(u.y-c.y)*2)
    };
  },

  startDrag:function(e,kind){
    const comp=this.getCanvasComp();
    const scale=this.getScreenScale();
    if(!comp||!scale)return;

    e.preventDefault();

    const item=comp.items[kind];

    this.dragState={
      pointerId:e.pointerId,
      kind,
      startScreenX:e.clientX,
      startScreenY:e.clientY,
      startCanvasX:item.x,
      startCanvasY:item.y,
      pxPerUnitX:scale.pxPerUnitX,
      pxPerUnitY:scale.pxPerUnitY
    };

    document.getElementById("hint").textContent="拖到你喜欢的位置！";
  },

  moveDrag:function(e){
    if(!this.dragState||e.pointerId!==this.dragState.pointerId)return;

    e.preventDefault();

    const comp=this.getCanvasComp();
    if(!comp)return;

    const dx=e.clientX-this.dragState.startScreenX;
    const dy=e.clientY-this.dragState.startScreenY;

    const screenPxPerCanvasX=(this.dragState.pxPerUnitX*this.planeWidth)/this.canvasW;
    const screenPxPerCanvasY=(this.dragState.pxPerUnitY*this.planeHeight)/this.canvasH;

    const canvasDx=dx/Math.max(.001,screenPxPerCanvasX);
    const canvasDy=dy/Math.max(.001,screenPxPerCanvasY);

    comp.setPosition(
      this.dragState.kind,
      this.dragState.startCanvasX+canvasDx,
      this.dragState.startCanvasY+canvasDy
    );

    this.updateHitPositions();
  },

  endDrag:function(e){
    if(!this.dragState||e.pointerId!==this.dragState.pointerId)return;
    this.dragState=null;
    document.getElementById("hint").textContent="PARK · 继续拖动来布置公园吧！🌳";
  },

  showHits:function(){
    Object.values(this.hits).forEach(b=>b.style.display="block");
  },

  hideHits:function(){
    Object.values(this.hits).forEach(b=>b.style.display="none");
  },

  updateHitPositions:function(){
    if(!this.world)return;

    const comp=this.getCanvasComp();
    if(!comp)return;

    const obj=this.world.object3D;
    obj.updateMatrixWorld(true);

    const scale=this.getScreenScale();
    if(!scale)return;

    const baseSizePx=Math.max(52,.46*scale.pxPerUnitX);

    Object.entries(comp.items).forEach(([kind,item])=>{
      const local=this.canvasToLocal(item.x,item.y);
      const world=local.applyMatrix4(obj.matrixWorld);
      const s=this.projectWorld(world);
      if(!s)return;

      const b=this.hits[kind];
      const visualScale=item.scale||1;
      const sizePx=baseSizePx*Math.max(.85,visualScale);
      b.style.left=(s.x-sizePx/2)+"px";
      b.style.top=(s.y-sizePx/2)+"px";
      b.style.width=sizePx+"px";
      b.style.height=sizePx+"px";
    });

    const resetLocal=this.canvasToLocal(this.canvasW/2,478);
    const resetWorld=resetLocal.applyMatrix4(obj.matrixWorld);
    const rs=this.projectWorld(resetWorld);

    if(rs){
      const bw=Math.max(90,.74*scale.pxPerUnitX);
      const bh=Math.max(44,.30*scale.pxPerUnitY);
      this.hits.reset.style.left=(rs.x-bw/2)+"px";
      this.hits.reset.style.top=(rs.y-bh/2)+"px";
      this.hits.reset.style.width=bw+"px";
      this.hits.reset.style.height=bh+"px";
    }
  },

  tick:function(){
    if(!this.world)return;

    const obj=this.world.object3D;

    if(this.tracking){
      this.el.object3D.updateMatrixWorld(true);
      this.lastMatrix.copy(this.el.object3D.matrixWorld);

      const p=new THREE.Vector3();
      const q=new THREE.Quaternion();
      const s=new THREE.Vector3();
      this.lastMatrix.decompose(p,q,s);

      this.poseHistory.push({
        pos:p.clone(),
        quat:q.clone(),
        scale:s.clone(),
        time:performance.now()
      });

      if(this.poseHistory.length>this.maxPoseHistory){
        this.poseHistory.shift();
      }

      obj.position.copy(p);
      obj.quaternion.identity();
      obj.scale.copy(s);
      obj.updateMatrixWorld(true);

      this.updateHitPositions();
      return;
    }

    if(this.holding){
      const t=(performance.now()-this.holdStart)/1000;

      const bob=Math.sin(t*1.35)*.014;
      const sway=Math.sin(t*.95)*.008;
      const roll=Math.sin(t*1.05)*THREE.MathUtils.degToRad(.8);

      obj.position.copy(this.basePos);
      obj.position.x+=sway;
      obj.position.y+=bob;

      const qr=new THREE.Quaternion()
        .setFromAxisAngle(new THREE.Vector3(0,0,1),roll);

      obj.quaternion.identity().multiply(qr);
      obj.scale.copy(this.baseScale);
      obj.updateMatrixWorld(true);

      this.updateHitPositions();
    }
  }
});






AFRAME.registerComponent("market-canvas",{
  init:function(){
    this.c=document.getElementById("marketInteractiveCanvas");
    this.ctx=this.c.getContext("2d");
    this.items={
      peach:{emoji:"🍑",x:250,y:135,tx:348,ty:320,selected:false,start:0},
      cabbage:{emoji:"🥬",x:384,y:118,tx:384,ty:312,selected:false,start:0},
      egg:{emoji:"🥚",x:518,y:135,tx:420,ty:320,selected:false,start:0}
    };
  },
  pick:function(kind){
    const item=this.items[kind];
    if(!item||item.selected)return;
    item.selected=true;
    item.start=performance.now();
    document.getElementById("hint").textContent="放进篮筐里！";
  },

  reset:function(){
    Object.values(this.items).forEach(item=>{
      item.selected=false;
      item.start=0;
    });
    document.getElementById("hint").textContent="MARKET · 点一个食物放进篮筐吧！🧺";
  },
  tick:function(){
    const ctx=this.ctx,c=this.c,w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h); // fully transparent canvas

    ctx.textAlign="center";ctx.textBaseline="middle";

    Object.values(this.items).forEach(item=>{
      let x=item.x,y=item.y,s=1;
      if(item.selected){
        const p=Math.min(1,(performance.now()-item.start)/650);
        const e=1-Math.pow(1-p,3);
        const arc=Math.sin(Math.PI*p)*75;
        x=item.x+(item.tx-item.x)*e;
        y=item.y+(item.ty-item.y)*e-arc;
        s=1-.50*e;
      }
      ctx.save();ctx.translate(x,y);ctx.scale(s,s);
      ctx.font='96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(item.emoji,0,0);ctx.restore();
    });

    // Draw a consistent basket ourselves instead of using the system 🧺 emoji.
    // This keeps the basket shape identical on iPhone, Android and desktop.
    const basketCx=w/2;
    const basketTop=330;
    const basketW=220;
    const basketH=105;

    // handle
    ctx.save();
    ctx.lineWidth=18;
    ctx.lineCap="round";
    ctx.strokeStyle="#c88435";
    ctx.beginPath();
    ctx.arc(basketCx, basketTop-8, 58, Math.PI, 0);
    ctx.stroke();

    // basket body
    const left=basketCx-basketW/2;
    const right=basketCx+basketW/2;
    const bottom=basketTop+basketH;
    ctx.beginPath();
    ctx.moveTo(left+18,basketTop);
    ctx.lineTo(right-18,basketTop);
    ctx.lineTo(right-38,bottom);
    ctx.quadraticCurveTo(basketCx,bottom+14,left+38,bottom);
    ctx.closePath();
    ctx.fillStyle="#d9a45a";
    ctx.fill();
    ctx.lineWidth=5;
    ctx.strokeStyle="#a96f2b";
    ctx.stroke();

    // rim
    ctx.fillStyle="#e7b66d";
    roundRect(ctx,left,basketTop-14,basketW,28,14);
    ctx.fill();
    ctx.lineWidth=4;
    ctx.strokeStyle="#b7772e";
    ctx.stroke();

    // woven lines
    ctx.save();
    ctx.beginPath();
    ctx.rect(left+20,basketTop+10,basketW-40,basketH-24);
    ctx.clip();
    ctx.strokeStyle="rgba(150,92,35,.55)";
    ctx.lineWidth=4;
    for(let x=left-40;x<right+40;x+=32){
      ctx.beginPath();ctx.moveTo(x,basketTop+10);ctx.lineTo(x+90,bottom);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+90,basketTop+10);ctx.lineTo(x,bottom);ctx.stroke();
    }
    ctx.restore();
    ctx.restore();

    // Friendly rounded RESET button with more space below the basket.
    const bx=w/2-86, by=458, bw=172, bh=40, br=20;
    ctx.save();
    roundRect(ctx,bx,by,bw,bh,br);
    ctx.fillStyle="rgba(255,248,220,.96)";
    ctx.fill();
    ctx.lineWidth=3;
    ctx.strokeStyle="#6f8e42";
    ctx.stroke();

    ctx.fillStyle="#8f2f2a";
    ctx.font='700 20px system-ui, sans-serif';
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("RESET",w/2,by+bh/2+1);
    ctx.restore();

    const mesh=this.el.getObject3D("mesh");
    if(mesh&&mesh.material&&mesh.material.map)mesh.material.map.needsUpdate=true;
  }
});


AFRAME.registerComponent("market-persist",{
  schema:{
    seconds:{type:"number",default:15},
    world:{type:"selector"}
  },

  init:function(){
    this.world=this.data.world;
    this.tracking=false;
    this.timer=null;
    this.camera=null;

    this.lastMatrix=new THREE.Matrix4();
    this.holding=false;
    this.holdStart=0;
    this.basePos=new THREE.Vector3();
    this.baseQuat=new THREE.Quaternion();
    this.baseScale=new THREE.Vector3(1,1,1);

    // Keep a short history of stable tracked poses.
    // When the card is moved away, MindAR can briefly report a distorted pose.
    // We freeze from an earlier stable sample instead of the very last frame.
    this.poseHistory=[];
    this.maxPoseHistory=24;

    this.hits={
      peach:document.getElementById("marketHoldPeach"),
      cabbage:document.getElementById("marketHoldCabbage"),
      egg:document.getElementById("marketHoldEgg"),
      reset:document.getElementById("marketHoldReset")
    };

    this.localPoints={
      peach:new THREE.Vector3(-0.38,0.35,0.10),
      cabbage:new THREE.Vector3(0,0.38,0.10),
      egg:new THREE.Vector3(0.38,0.35,0.10),
      reset:new THREE.Vector3(0,-0.62,0.14)
    };

    this.localSizes={
      peach:[0.58,0.58],
      cabbage:[0.58,0.58],
      egg:[0.58,0.58],
      reset:[0.74,0.30]
    };

    const comp=()=>document.getElementById("marketInteractiveDisplay")?.components?.["market-canvas"];

    this.hits.peach.addEventListener("click",()=>comp()?.pick("peach"));
    this.hits.cabbage.addEventListener("click",()=>comp()?.pick("cabbage"));
    this.hits.egg.addEventListener("click",()=>comp()?.pick("egg"));
    this.hits.reset.addEventListener("click",()=>comp()?.reset());

    if(this.world){
      this.world.object3D.visible=false;
    }

    this.el.addEventListener("targetFound",()=>{
      if(window.citySelectedScene!=="market"){
        this.tracking=false;
        this.holding=false;
        if(this.world)this.world.object3D.visible=false;
        this.hideHoldHits();
        return;
      }

      this.tracking=true;
      this.holding=false;
      this.poseHistory=[];
      this.hideHoldHits();

      if(this.timer){
        clearTimeout(this.timer);
        this.timer=null;
      }

      if(this.world){
        this.world.object3D.visible=true;
      }
    });

    this.el.addEventListener("targetLost",()=>{
      if(window.citySelectedScene!=="market")return;

      this.tracking=false;
      this.holding=true;
      this.holdStart=performance.now();

      if(this.world){
        const obj=this.world.object3D;

        // Use a pose from roughly 250-350ms BEFORE targetLost.
        // That avoids freezing the bad skew/tilt that often happens while the card is being pulled away.
        let stablePose=null;
        const now=performance.now();
        for(let i=this.poseHistory.length-1;i>=0;i--){
          const age=now-this.poseHistory[i].time;
          if(age>=280){
            stablePose=this.poseHistory[i];
            break;
          }
        }

        // Fallback to the oldest available recent pose, then finally current pose.
        if(!stablePose && this.poseHistory.length){
          stablePose=this.poseHistory[0];
        }

        if(stablePose){
          this.basePos.copy(stablePose.pos);
          this.baseQuat.copy(stablePose.quat);
          this.baseScale.copy(stablePose.scale);

          obj.position.copy(this.basePos);
          obj.quaternion.identity();
          obj.scale.copy(this.baseScale);
          obj.updateMatrixWorld(true);
        }else{
          this.basePos.copy(obj.position);
          this.baseQuat.copy(obj.quaternion);
          this.baseScale.copy(obj.scale);
        }

        obj.visible=true;
      }

      // A-Frame raycaster is unreliable after targetLost on some mobile browsers.
      // Switch interaction to DOM hit zones and keep them synced to the idle motion.
      this.updateHoldHits();
      this.showHoldHits();

      if(this.timer){clearTimeout(this.timer);this.timer=null;}
      // Manual-exit mode: keep Market interaction visible until RETURN CITY is tapped.
    });
  },

  getCamera:function(){
    if(!this.camera){
      const camEl=document.querySelector("a-camera");
      this.camera=camEl && camEl.getObject3D("camera");
    }
    return this.camera;
  },

  projectWorld:function(v){
    const cam=this.getCamera();
    if(!cam)return null;
    const p=v.clone().project(cam);
    return {
      x:(p.x*0.5+0.5)*window.innerWidth,
      y:(-p.y*0.5+0.5)*window.innerHeight
    };
  },

  updateHoldHits:function(){
    if(!this.world)return;

    const obj=this.world.object3D;
    obj.updateMatrixWorld(true);

    const centerWorld=new THREE.Vector3(0,0,0).applyMatrix4(obj.matrixWorld);
    const rightWorld=new THREE.Vector3(0.5,0,0).applyMatrix4(obj.matrixWorld);
    const upWorld=new THREE.Vector3(0,0.5,0).applyMatrix4(obj.matrixWorld);

    const center=this.projectWorld(centerWorld);
    const right=this.projectWorld(rightWorld);
    const up=this.projectWorld(upWorld);
    if(!center||!right||!up)return;

    const pxPerUnitX=Math.max(1,Math.abs(right.x-center.x)*2);
    const pxPerUnitY=Math.max(1,Math.abs(up.y-center.y)*2);

    Object.entries(this.localPoints).forEach(([key,local])=>{
      const worldPoint=local.clone().applyMatrix4(obj.matrixWorld);
      const screen=this.projectWorld(worldPoint);
      if(!screen)return;

      const [wu,hu]=this.localSizes[key];
      const bw=Math.max(key==="reset"?80:54,wu*pxPerUnitX);
      const bh=Math.max(key==="reset"?42:54,hu*pxPerUnitY);

      const b=this.hits[key];
      b.style.left=(screen.x-bw/2)+"px";
      b.style.top=(screen.y-bh/2)+"px";
      b.style.width=bw+"px";
      b.style.height=bh+"px";
    });
  },

  showHoldHits:function(){
    Object.values(this.hits).forEach(b=>b.style.display="block");
  },

  hideHoldHits:function(){
    Object.values(this.hits).forEach(b=>b.style.display="none");
  },

  tick:function(){
    if(!this.world)return;

    const obj=this.world.object3D;

    if(this.tracking){
      this.el.object3D.updateMatrixWorld(true);
      this.lastMatrix.copy(this.el.object3D.matrixWorld);

      const pos=new THREE.Vector3();
      const quat=new THREE.Quaternion();
      const scale=new THREE.Vector3();
      this.lastMatrix.decompose(pos,quat,scale);

      // Save recent poses. About 20-24 frames gives us a few hundred ms of history.
      this.poseHistory.push({
        pos:pos.clone(),
        quat:quat.clone(),
        scale:scale.clone(),
        time:performance.now()
      });
      if(this.poseHistory.length>this.maxPoseHistory){
        this.poseHistory.shift();
      }

      obj.position.copy(pos);
      obj.quaternion.identity();
      obj.scale.copy(scale);
      obj.updateMatrixWorld(true);
      return;
    }

    if(this.holding){
      // Very small, slow motion so the AR still feels "alive" after the card is removed.
      // It is intentionally much steadier than real tracking jitter.
      const t=(performance.now()-this.holdStart)/1000;
      const bob=Math.sin(t*1.45)*0.022;
      const sway=Math.sin(t*1.05)*0.014;
      const roll=Math.sin(t*1.18)*THREE.MathUtils.degToRad(1.4);

      obj.position.copy(this.basePos);
      obj.position.x+=sway;
      obj.position.y+=bob;

      const qRoll=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),roll);
      obj.quaternion.identity().multiply(qRoll);
      obj.scale.copy(this.baseScale);
      obj.updateMatrixWorld(true);

      // Keep the HTML tap zones exactly on top of the gently moving AR UI.
      this.updateHoldHits();
    }
  }
});
