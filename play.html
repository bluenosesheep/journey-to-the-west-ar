<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Journey to the West AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}canvas.a-canvas{background:transparent!important}.off{display:none}#hint{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;max-width:88vw;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font:14px system-ui;text-align:center}</style>
<script>
AFRAME.registerComponent("cloud-events",{init:function(){const h=document.getElementById("hint");this.el.addEventListener("targetFound",()=>h.textContent="MAGIC 01 · 筋斗云出现啦！✨");this.el.addEventListener("targetLost",()=>h.textContent="选择一张 MAGIC 卡，放进你的故事吧！")}});
AFRAME.registerComponent("fire-events",{init:function(){const h=document.getElementById("hint");this.el.addEventListener("targetFound",()=>h.textContent="MAGIC 02 · 三昧真火出现啦！🔥");this.el.addEventListener("targetLost",()=>h.textContent="选择一张 MAGIC 卡，放进你的故事吧！")}});
function makeUpdater(canvasId,sources,drawFn){return{init:function(){this.c=document.getElementById(canvasId);this.ctx=this.c.getContext("2d");this.img={};this.loaded=0;this.start=performance.now();Object.entries(sources).forEach(([k,s])=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>{this.img[k]=i;this.loaded++};i.src=s})},tick:function(){if(this.loaded<Object.keys(sources).length)return;const w=this.c.width,h=this.c.height,t=(performance.now()-this.start)/1000;this.ctx.clearRect(0,0,w,h);drawFn(this.ctx,this.img,w,h,t);const m=this.el.getObject3D("mesh");if(m&&m.material&&m.material.map)m.material.map.needsUpdate=true;}}}
const dc=(ctx,img,x,y,w,h,r=0,a=1)=>{ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(r);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore()};
AFRAME.registerComponent("cloud-canvas",makeUpdater("cloudCanvas",{cloud:"./assets/cloud/cloud.png",wind01:"./assets/cloud/wind_01.png",wind02:"./assets/cloud/wind_02.png",sparkles:"./assets/cloud/sparkles.png"},(ctx,I,w,h,t)=>{let z=.92+.08*(.5+.5*Math.sin(t*2.2));dc(ctx,I.wind02,w*.72,h*.34,w*.23*z,h*.36*z,(-5+12*(.5+.5*Math.sin(t*1.7)))*Math.PI/180,.82);let cy=h*(.50-.06*Math.sin(t*2)),cr=3*Math.sin(t*1.4)*Math.PI/180;dc(ctx,I.cloud,w*.42,cy,w*.43,h*.43,cr,1);let sx=w*(.50+.10*Math.sin(t*2.4));dc(ctx,I.wind01,sx,h*.61,w*.68,h*.24,0,.8);let ss=.75+.40*(.5+.5*Math.sin(t*5)),sa=.45+.55*(.5+.5*Math.sin(t*5));dc(ctx,I.sparkles,w*.66,h*.28,w*.20*ss,h*.20*ss,0,sa)}));
AFRAME.registerComponent("fire-canvas",makeUpdater("fireCanvas",{fire:"./assets/fire/fire_main.png",sparks:"./assets/fire/fire_sparks.png",smoke:"./assets/fire/smoke.png",heat:"./assets/fire/heat_wave.png"},(ctx,I,w,h,t)=>{let hs=.94+.10*(.5+.5*Math.sin(t*1.6));dc(ctx,I.heat,w*.50,h*.61,w*.78*hs,h*.48*hs,4*Math.sin(t*.9)*Math.PI/180,.58);let sx=w*(.50+.035*Math.sin(t*1.2)),sy=h*(.42-.035*Math.sin(t*1.0)),ss=.92+.10*(.5+.5*Math.sin(t*1.4));dc(ctx,I.smoke,sx,sy,w*.62*ss,h*.42*ss,2.5*Math.sin(t*1.1)*Math.PI/180,.48);let fy=h*(.54-.06*Math.sin(t*2.2)),fs=.88+.18*(.5+.5*Math.sin(t*2.6)),fr=3.5*Math.sin(t*1.8)*Math.PI/180;dc(ctx,I.fire,w*.47,fy,w*.52*fs,h*.42*fs,fr,1);let py=h*(.42-.08*Math.sin(t*1.7)),ps=.88+.22*(.5+.5*Math.sin(t*4)),pa=.55+.40*(.5+.5*Math.sin(t*5.2));dc(ctx,I.sparks,w*.53,py,w*.66*ps,h*.44*ps,0,pa)}));
</script></head><body>
<div id="hint">选择一张 MAGIC 卡，放进你的故事吧！</div>
<canvas id="cloudCanvas" class="off" width="1024" height="1024"></canvas><canvas id="fireCanvas" class="off" width="1024" height="1024"></canvas>
<a-scene mindar-image="imageTargetSrc: ./targets/all.mind; autoStart: true; maxTrack: 3;" color-space="sRGB" renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity mindar-image-target="targetIndex:0" cloud-events><a-plane width="1.65" height="1.65" position="0 0 0.03" material="shader:flat;src:#cloudCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double" cloud-canvas></a-plane></a-entity>
<a-entity mindar-image-target="targetIndex:1" fire-events><a-plane width="1.65" height="1.65" position="0 0 0.03" material="shader:flat;src:#fireCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double" fire-canvas></a-plane></a-entity>
</a-scene></body></html>
