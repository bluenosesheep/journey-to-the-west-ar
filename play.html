<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR Story World · Play</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}
canvas.a-canvas{background:transparent!important}
.hidden-canvas{position:absolute;left:-99999px;top:-99999px;width:1px;height:1px;opacity:.001;pointer-events:none}
#hint{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;max-width:90vw;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.16)}
</style>

<script>
const DEFAULT_HINT="把 MAGIC 或 SCENE 图放进你的故事吧！";
function setHint(t){const h=document.getElementById("hint");if(h)h.textContent=t;}
function regEvent(name,text){
  AFRAME.registerComponent(name,{init:function(){
    this.el.addEventListener("targetFound",()=>setHint(text));
    this.el.addEventListener("targetLost",()=>setHint(DEFAULT_HINT));
  }});
}
regEvent("cloud-events","MAGIC 01 · 筋斗云出现啦！✨");
regEvent("fire-events","MAGIC 02 · 三昧真火出现啦！🔥");
regEvent("forest-events","SCENE · 森林出现啦！🌳");
regEvent("river-events","SCENE · 河流出现啦！🌊");
regEvent("bridge-events","SCENE · 小桥出现啦！🌉");

function drawCentered(ctx,img,cx,cy,w,h,r=0,a=1){
  ctx.save();ctx.globalAlpha=a;ctx.translate(cx,cy);ctx.rotate(r);
  ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();
}
function updateTexture(el){
  const mesh=el.getObject3D("mesh");
  if(mesh&&mesh.material&&mesh.material.map)mesh.material.map.needsUpdate=true;
}

/* MAGIC 01 */
AFRAME.registerComponent("cloud-canvas-updater",{
  init:function(){
    this.c=document.getElementById("cloudCanvas");this.ctx=this.c.getContext("2d");
    this.images={};this.loaded=0;this.start=performance.now();
    const src={cloud:"./assets/cloud/cloud.png",wind01:"./assets/cloud/wind_01.png",wind02:"./assets/cloud/wind_02.png",sparkles:"./assets/cloud/sparkles.png"};
    Object.entries(src).forEach(([k,s])=>{const i=new Image();i.onload=()=>{this.images[k]=i;this.loaded++};i.src=s;});
  },
  tick:function(){
    if(this.loaded<4)return;
    const c=this.c,ctx=this.ctx,w=c.width,h=c.height,t=(performance.now()-this.start)/1000;
    ctx.clearRect(0,0,w,h);
    let z=.92+.08*(.5+.5*Math.sin(t*2.2));
    drawCentered(ctx,this.images.wind02,w*.72,h*.34,w*.23*z,h*.36*z,(-5+12*(.5+.5*Math.sin(t*1.7)))*Math.PI/180,.82);
    let cy=h*(.50-.06*Math.sin(t*2.0)),cr=3*Math.sin(t*1.4)*Math.PI/180;
    drawCentered(ctx,this.images.cloud,w*.42,cy,w*.43,h*.43,cr,1);
    let sx=w*(.50+.10*Math.sin(t*2.4));
    drawCentered(ctx,this.images.wind01,sx,h*.61,w*.68,h*.24,0,.80);
    let ss=.75+.40*(.5+.5*Math.sin(t*5)),sa=.45+.55*(.5+.5*Math.sin(t*5));
    drawCentered(ctx,this.images.sparkles,w*.66,h*.28,w*.20*ss,h*.20*ss,0,sa);
    updateTexture(this.el);
  }
});

/* MAGIC 02 */
AFRAME.registerComponent("fire-canvas-updater",{
  init:function(){
    this.c=document.getElementById("fireCanvas");this.ctx=this.c.getContext("2d");
    this.images={};this.loaded=0;this.start=performance.now();
    const src={fire:"./assets/fire/fire_main.png",sparks:"./assets/fire/fire_sparks.png",smoke:"./assets/fire/smoke.png",heat:"./assets/fire/heat_wave.png"};
    Object.entries(src).forEach(([k,s])=>{const i=new Image();i.onload=()=>{this.images[k]=i;this.loaded++};i.src=s;});
  },
  tick:function(){
    if(this.loaded<4)return;
    const c=this.c,ctx=this.ctx,w=c.width,h=c.height,t=(performance.now()-this.start)/1000;
    ctx.clearRect(0,0,w,h);
    let hs=.94+.10*(.5+.5*Math.sin(t*1.6));
    drawCentered(ctx,this.images.heat,w*.50,h*.61,w*.78*hs,h*.48*hs,4*Math.sin(t*.9)*Math.PI/180,.58);
    let sx=w*(.50+.035*Math.sin(t*1.2)),sy=h*(.42-.035*Math.sin(t*1.0)),ss=.92+.10*(.5+.5*Math.sin(t*1.4));
    drawCentered(ctx,this.images.smoke,sx,sy,w*.62*ss,h*.42*ss,2.5*Math.sin(t*1.1)*Math.PI/180,.48);
    let fy=h*(.54-.06*Math.sin(t*2.2)),fs=.88+.18*(.5+.5*Math.sin(t*2.6)),fr=3.5*Math.sin(t*1.8)*Math.PI/180;
    drawCentered(ctx,this.images.fire,w*.47,fy,w*.52*fs,h*.42*fs,fr,1);
    let py=h*(.42-.08*Math.sin(t*1.7)),ps=.88+.22*(.5+.5*Math.sin(t*4)),pa=.55+.40*(.5+.5*Math.sin(t*5.2));
    drawCentered(ctx,this.images.sparks,w*.53,py,w*.66*ps,h*.44*ps,0,pa);
    updateTexture(this.el);
  }
});

/* Static Scene loader */
AFRAME.registerComponent("static-canvas-updater",{
  schema:{canvas:{type:"selector"},src:{type:"string"}},
  init:function(){
    this.ready=false;
    this.c=this.data.canvas;
    this.ctx=this.c.getContext("2d");
    this.img=new Image();
    this.img.onload=()=>{
      const c=this.c,ctx=this.ctx,img=this.img;
      ctx.clearRect(0,0,c.width,c.height);
      const ir=img.width/img.height,cr=c.width/c.height;
      let dw,dh;
      if(ir>cr){dw=c.width;dh=dw/ir}else{dh=c.height;dw=dh*ir}
      ctx.drawImage(img,(c.width-dw)/2,(c.height-dh)/2,dw,dh);
      this.ready=true;
      updateTexture(this.el);
    };
    this.img.src=this.data.src;
  },
  tick:function(){if(this.ready)updateTexture(this.el);}
});
</script>
</head>

<body>
<div id="hint">把 MAGIC 或 SCENE 图放进你的故事吧！</div>

<canvas id="cloudCanvas" class="hidden-canvas" width="1024" height="1024"></canvas>
<canvas id="fireCanvas" class="hidden-canvas" width="1024" height="1024"></canvas>
<canvas id="forestCanvas" class="hidden-canvas" width="768" height="512"></canvas>
<canvas id="riverCanvas" class="hidden-canvas" width="768" height="512"></canvas>
<canvas id="bridgeCanvas" class="hidden-canvas" width="768" height="512"></canvas>

<a-scene
  mindar-image="imageTargetSrc: ./targets/all.mind; autoStart: true; maxTrack: 5;"
  color-space="sRGB"
  renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex:0" cloud-events>
    <a-plane width="1.65" height="1.65" position="0 0 0.03"
      material="shader:flat;src:#cloudCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      cloud-canvas-updater></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex:1" fire-events>
    <a-plane width="1.65" height="1.65" position="0 0 0.03"
      material="shader:flat;src:#fireCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      fire-canvas-updater></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex:2" forest-events>
    <a-plane width="2.6" height="1.73" position="0 0.05 0.03"
      material="shader:flat;src:#forestCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      static-canvas-updater="canvas:#forestCanvas;src:./assets/forest/forest_scene.png"></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex:3" river-events>
    <a-plane width="2.4" height="1.6" position="0 0.02 0.03"
      material="shader:flat;src:#riverCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      static-canvas-updater="canvas:#riverCanvas;src:./assets/river/river_scene.png"></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex:4" bridge-events>
    <a-plane width="2.4" height="1.6" position="0 0.03 0.03"
      material="shader:flat;src:#bridgeCanvas;transparent:true;alphaTest:0.01;depthWrite:false;side:double"
      static-canvas-updater="canvas:#bridgeCanvas;src:./assets/bridge/bridge_scene.png"></a-plane>
  </a-entity>

</a-scene>
</body>
</html>
